<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本輪 / HONRIN</title><style>body{background:#10372f;color:#f7f5ec;font:16px/1.8 system-ui,sans-serif;margin:0;padding:12vh 8vw}h1{font-size:2rem}a{color:#deedb8}</style></head><body><h1>本輪 HONRIN</h1><p id="progress">アプリを展開しています…</p><script src="payload.js"></script><script>
(async function(){try{
 if(!('DecompressionStream' in window))throw Error('このブラウザは gzip 展開に対応していません。');
 const base64=window.HONRIN_PAYLOAD;
 if(!base64)throw Error('payload.js が見つかりません。');
 const raw=Uint8Array.from(atob(base64), c=>c.charCodeAt(0));
 const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 if(!html.startsWith('<!doctype html>'))throw Error('データ形式が無効です。');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('progress').textContent='起動できません：'+e.message+'。同梱の unpack.py で standalone.html を復元して開いてください。';}})();
</script></body></html>
