<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ShelfPitch | 可動棚の移動最小化</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#273c37;font:16px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #b8c8bb;margin-bottom:24px;padding-bottom:16px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em;margin:0}h2{font-size:20px;margin:0 0 14px}p{margin:8px 0}.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#527264}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;align-items:start}section{background:#fffdf7;border:1px solid #d8d9cc;border-radius:16px;padding:20px;min-width:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:650;margin-bottom:12px}input,textarea{display:block;width:100%;padding:10px;border:1px solid #a9b9ad;border-radius:8px;background:#fff;color:#273c37;font:inherit;margin-top:4px}textarea{resize:vertical;min-height:62px}small{display:block;color:#576a61;font-size:12px;font-weight:400}button{border:0;border-radius:8px;background:#245b49;color:white;font:inherit;font-weight:650;padding:10px 15px;cursor:pointer}button.secondary{background:#e2e9df;color:#244b3c}button:disabled{opacity:.45;cursor:not-allowed}.buttons{display:flex;flex-wrap:wrap;gap:8px}#status{padding:10px 12px;background:#e5ede4;border-radius:8px;margin:0 0 14px;overflow-wrap:anywhere}#status.bad{background:#f8e4d6;color:#8a3c22}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat{flex:1;min-width:100px;background:#edf0e7;padding:10px;border-radius:8px}.stat b{display:block;font-size:25px}.draws{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}.cab{height:310px;display:flex;flex-direction:column-reverse;border:4px solid #715a43;border-radius:3px;background:#f5f0e4;position:relative;overflow:hidden}.bay{display:flex;justify-content:center;align-items:center;min-height:0;overflow:hidden;color:#245b49;background:#dfead9;font-size:12px;border-top:1px dashed #b7c9b0}.bay.short{background:#f5cbb5;color:#7a321e}.shelf{background:#947858;min-height:0}.shelf.moved{background:#cd823e}table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}th,td{text-align:right;padding:7px 4px;border-bottom:1px solid #dedfd3}th:first-child,td:first-child{text-align:left}.badtext{color:#9a381c;font-weight:700}.note{font-size:13px;color:#54665e;margin-top:18px}footer{font-size:12px;color:#52695d;margin-top:18px}@media(max-width:740px){main{padding:14px}.layout{grid-template-columns:1fr}section{padding:15px}.cab{height:250px}}@media print{.input,button,footer{display:none}.layout{display:block}main{padding:0}section{border:0}.cab{height:300px;print-color-adjust:exact}}
</style><main><header><div class="tag">Workshop tools / 01 · offline</div><h1>ShelfPitch</h1><p>収納物に合わせて、動かす棚板を最小限に。</p></header><div class="layout"><section class="input"><h2>01 / 現在の棚を測る</h2><div class="fields"><label>内寸高さ mm<input id="H" type="number" min="1" max="5000" value="1000"></label><label>棚板厚 mm<input id="T" type="number" min="1" max="200" value="18"></label><label>穴の間隔 mm<input id="P" type="number" min="10" max="500" value="32"></label><label>最初の支持位置 mm<input id="F" type="number" min="1" value="32"></label></div><label>現在の棚板下面（下から順に mm）<textarea id="old">256, 512, 768</textarea><small>棚の内底を0とする。穴中心ではなく、実際に棚板下面が載る高さ。</small></label><label>各段に必要な有効高さ（下から順に mm）<textarea id="need">250, 260, 160, 180</textarea><small>収納物の高さ＋取り出し余裕。棚板3枚なら4段分。</small></label><label>使用不可の支持位置（任意、mm）<textarea id="ban" placeholder="例：544, 576"></textarea><small>金具などが干渉する位置。カンマ・空白・改行で区切る。</small></label><div class="buttons"><button id="run">最適な配置を計算</button><button class="secondary" id="reset">初期サンプル</button></div><p class="note">整数mm、最大20枚。収納物の段順と棚板枚数は固定です。</p></section><section><h2>02 / 移動計画</h2><p id="status" role="status" aria-live="polite">計算中</p><div id="result" hidden><div class="stats"><div class="stat">動かす棚板<b id="moves"></b></div><div class="stat">総移動距離<b id="distance"></b></div><div class="stat">不足段（前→後）<b id="shortage"></b></div></div><div class="draws"><div>現在<div class="cab" id="before"></div></div><div>提案<div class="cab" id="after"></div></div></div><p class="note">橙：移動対象の棚板／赤系：高さ不足。図は正面の高さのみ。</p><div id="tables"></div></div><div class="buttons"><button id="save" disabled>CSV出力</button><button class="secondary" id="print" disabled>印刷</button></div></section></div><footer>計算は端末内のみ。耐荷重、たわみ、転倒防止、幅・奥行き、金具の適合、実際の作業手順は別途確認してください。</footer></main>
<script id="engine">
function validate(c){const {H,T,P,F,old,need,ban}=c;const inRange=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;if(!inRange(H,1,5000)||!inRange(T,1,200)||!inRange(P,10,500)||!inRange(F,1,H))throw Error('寸法の範囲または整数mmを確認してください。');if(old.length>20||need.length!==old.length+1||!need.every(v=>inRange(v,0,5000)))throw Error('棚板は最大20枚。必要高さは棚板枚数＋1個です。');const hole=x=>inRange(x,F,H-T)&&(x-F)%P===0;if(!old.every((v,i)=>hole(v)&&(!i||v>=old[i-1]+T)))throw Error('現在位置が支持格子外、範囲外、または棚板が重複しています。');if(!ban.every(hole))throw Error('使用不可位置は有効な支持格子上で指定してください。');return c}
function gaps(c,pos){let b=0;return [...pos,c.H].map((z,i)=>{const h=z-b;b=z+c.T;return {i:i+1,height:h,need:c.need[i],slack:h-c.need[i]}})}
function solve(c){validate(c);const {H,T,P,F,old,need,ban}=c,n=old.length;const holes=[];for(let x=F;x<=H-T;x+=P)if(!ban.includes(x))holes.push(x);const m=holes.length,W=n*H+1;let prev=[],parents=[];if(!n)return H>=need[0]?{pos:[],moves:0,distance:0}:null;for(let i=0;i<n;i++){const curr=Array(m).fill(Infinity),par=Array(m).fill(-1);let k=0,best=-1;for(let j=0;j<m;j++){const x=holes[j],cost=(x===old[i]?0:W)+Math.abs(x-old[i]);if(i===0){if(x>=need[0])curr[j]=cost;continue}while(k<j&&holes[k]+T+need[i]<=x){if(Number.isFinite(prev[k])&&(best<0||prev[k]<prev[best]))best=k;k++}if(best>=0){curr[j]=prev[best]+cost;par[j]=best}}parents.push(par);prev=curr}let end=-1;for(let j=0;j<m;j++)if(H-holes[j]-T>=need[n]&&Number.isFinite(prev[j])&&(end<0||prev[j]<prev[end]))end=j;if(end<0)return null;const pos=Array(n);for(let i=n-1;i>=0;i--){pos[i]=holes[end];end=parents[i][end]}return {pos,moves:pos.filter((v,i)=>v!==old[i]).length,distance:pos.reduce((s,v,i)=>s+Math.abs(v-old[i]),0)}}
</script><script>
const $=id=>document.getElementById(id),ids=['H','T','P','F','old','need','ban'];let report=null;function list(s){return s.trim()?s.trim().split(/[\s,、]+/).map(v=>/^\d+$/.test(v)?Number(v):NaN):[]}function read(){return Object.fromEntries(ids.map((id,i)=>[id,i<4?($ (id).value.trim()?Number($(id).value):NaN):list($(id).value)]))}function status(t,bad=false){$('status').textContent=t;$('status').className=bad?'bad':''}function invalidate(){report=null;$('result').hidden=true;$('save').disabled=$('print').disabled=true}function draw(id,c,pos,after){const root=$(id);root.replaceChildren();gaps(c,pos).forEach((r,i)=>{const b=document.createElement('div');b.className='bay'+(r.slack<0?' short':'');b.style.flex='0 0 '+(100*r.height/c.H)+'%';b.textContent=r.height+' mm';b.title='第'+r.i+'段：必要 '+r.need+' mm';root.append(b);if(i<pos.length){const s=document.createElement('div');s.className='shelf'+(after&&pos[i]!==c.old[i]?' moved':'');s.style.flex='0 0 '+(100*c.T/c.H)+'%';s.title='下面 '+pos[i]+' mm';root.append(s)}})}function table(title,heads,rows){const h=document.createElement('h3');h.textContent=title;const t=document.createElement('table');const tr=t.insertRow();heads.forEach(v=>{const th=document.createElement('th');th.scope='col';th.textContent=v;tr.append(th)});rows.forEach(row=>{const r=t.insertRow();row.forEach(v=>{r.insertCell().textContent=v})});$('tables').append(h,t)}function run(){invalidate();try{const c=read(),a=solve(c);if(!a){status('全段の必要高さを満たす配置がありません。必要高さ、使用不可位置、棚板枚数を見直してください。',true);return}const b=gaps(c,c.old),g=gaps(c,a.pos);report={c,a,b,g};$('result').hidden=false;$('save').disabled=$('print').disabled=false;status(a.moves?'全段の必要高さを満たす最小移動計画です。':'現在の棚板位置で全段の条件を満たします。');$('moves').textContent=a.moves+' 枚';$('distance').textContent=a.distance+' mm';$('shortage').textContent=b.filter(r=>r.slack<0).length+' → 0';draw('before',c,c.old,false);draw('after',c,a.pos,true);$('tables').replaceChildren();table('棚板下面の高さ (mm)',['棚板','現在','提案','移動'],a.pos.map((x,i)=>[i+1,c.old[i],x,(x-c.old[i]>0?'+':'')+(x-c.old[i])]));table('段の有効高さ (mm)',['段','必要','現在','提案','余裕'],g.map((r,i)=>[r.i,r.need,b[i].height,r.height,r.slack]))}catch(e){status(e.message,true)}}ids.forEach(id=>$(id).addEventListener('input',()=>{invalidate();status('入力が変更されました。再計算してください。')}));$('run').onclick=run;$('reset').onclick=()=>{[1000,18,32,32,'256, 512, 768','250, 260, 160, 180',''].forEach((v,i)=>$(ids[i]).value=v);run()};$('save').onclick=()=>{if(!report)return;const {c,a,b,g}=report;const lines=['type,index,old_mm,new_mm,required_mm,delta_or_slack_mm',...a.pos.map((x,i)=>['shelf',i+1,c.old[i],x,'',x-c.old[i]].join(',')),...g.map((r,i)=>['bay',r.i,b[i].height,r.height,r.need,r.slack].join(','))];const u=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='shelfpitch.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('print').onclick=()=>window.print();run();
</script></html>
