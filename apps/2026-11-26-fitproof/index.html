<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寸証 / FitProof</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f2;color:#172e2b;font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{background:#173c38;color:#fff;padding:28px;border-radius:18px;margin-bottom:20px}h1{font-size:36px;margin:0;letter-spacing:.03em}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#a5d5bd}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}.panel{background:white;border:1px solid #d9e2dd;border-radius:15px;padding:18px;min-width:0}label{display:block;font-weight:600;margin:12px 0 4px}textarea,input,select,button{font:inherit;border-radius:7px}textarea,input,select{width:100%;padding:8px;border:1px solid #a6bdb4;background:#fff;color:#172e2b}textarea{font-family:monospace;height:190px;resize:vertical}button{cursor:pointer;border:1px solid #285b51;background:#285b51;color:white;padding:8px 14px}button.secondary{background:white;color:#285b51}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted,small{color:#526a61}.hero{background:#e5f1e9;border-radius:12px;padding:14px;margin-bottom:14px}.hero strong{font-size:32px;display:block;font-variant-numeric:tabular-nums}.warn{color:#a13b25;font-weight:600}.good{color:#176243;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:8px 4px;border-bottom:1px solid #dce7e1}th:first-child,td:first-child{text-align:left}svg{width:100%;height:auto}footer{margin:20px 0;color:#526a61;font-size:12px}@media(max-width:740px){main{padding:12px}.layout{grid-template-columns:1fr}header{padding:20px}h1{font-size:29px}}@media print{body{background:white}.actions,footer{display:none}.layout{display:block}.panel{break-inside:avoid}}
</style>
<main><header><div class="eyebrow">FABRICATION / DIMENSION LAB</div><h1>寸証 <span style="font-weight:400">FitProof</span></h1><p>3Dプリントの寸法補正を、推定と別試験で見極める。</p></header><div class="layout"><section class="panel"><h2>01 / 計測データ</h2><p class="muted">同じ材料・機種・向き・形状種別・設定で測定。穴径と外径は混ぜないでください。</p><label for="kind">対象</label><select id="kind"><option>穴径</option><option>軸径・外形幅</option></select><label for="data">CAD寸法, 実測寸法, 用途 (fit / check)</label><textarea id="data" spellcheck="false"></textarea><small>mm、最大80行。fitは学習、checkは別試験。fitには異なるCAD寸法を3種以上。checkに測定済みデータを追加できます。</small><div class="pair"><div><label for="target">目標の実測寸法 (mm)</label><input id="target" type="number" step="0.01" min="0.01" max="1000" value="15"></div><div><label for="tol">許容誤差 ±mm</label><input id="tol" type="number" step="0.01" min="0.001" max="100" value="0.08"></div></div><div class="actions"><button id="run">計算する</button><button id="reset" class="secondary">例に戻す</button></div></section><section class="panel"><h2>02 / 補正と検証</h2><div id="result" aria-live="polite"></div><div class="actions"><button id="export" disabled>JSON保存</button><button id="print" class="secondary" onclick="window.print()">印刷</button></div></section></div><footer>ローカル計算のみ・外部送信なし。経験的なモデルであり、誤差範囲・嵌合・強度を保証しません。重要部品には使わず、実機の再試作で確認してください。</footer></main>
<script id="core">
const MODEL_NAMES={offset:'一定差',scale:'比例',affine:'比例＋一定差'};
function number(s,min,max){if(String(s).trim()===''||!Number.isFinite(+s)||+s<min||+s>max)throw Error('数値が範囲外です');return +s}
function parse(raw){const lines=raw.trim().split(/\r?\n/).filter(s=>s.trim());if(lines.length>80)throw Error('最大80行です');return lines.map((line,i)=>{const p=line.trim().split(/\s*[,\t]\s*/);try{if(p.length!==3||!['fit','check'].includes(p[2]))throw Error('fit / check を指定');return {x:number(p[0],.01,1000),y:number(p[1],.001,2000),role:p[2]}}catch(e){throw Error(`${i+1}行目: ${e.message}`)}})}
function fit(rows,type){const n=rows.length,mx=rows.reduce((s,r)=>s+r.x,0)/n,my=rows.reduce((s,r)=>s+r.y,0)/n;let a=1,b=0;if(type==='offset')b=my-mx;else if(type==='scale')a=rows.reduce((s,r)=>s+r.x*r.y,0)/rows.reduce((s,r)=>s+r.x*r.x,0);else{const xx=rows.reduce((s,r)=>s+(r.x-mx)**2,0);a=rows.reduce((s,r)=>s+(r.x-mx)*(r.y-my),0)/xx;b=my-a*mx}if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0)return null;return {a,b}}
function analyze(rows,target,tol){target=number(target,.01,1000);tol=number(tol,.001,100);const train=rows.filter(r=>r.role==='fit'),check=rows.filter(r=>r.role==='check'),xs=[...new Set(train.map(r=>r.x))].sort((a,b)=>a-b);if(xs.length<3)throw Error('fitに異なるCAD寸法が3種以上必要です');const models=Object.keys(MODEL_NAMES).flatMap(type=>{const m=fit(train,type);if(!m)return [];let errors=[];for(const x of xs){const f=fit(train.filter(r=>r.x!==x),type);if(!f)return [];const es=train.filter(r=>r.x===x).map(r=>r.y-f.a*r.x-f.b);errors.push(es.reduce((s,e)=>s+e*e,0)/es.length)}return [{type,...m,cv:Math.sqrt(errors.reduce((s,e)=>s+e,0)/xs.length)}]});models.sort((a,b)=>a.cv-b.cv);const best=models[0],cad=(target-best.b)/best.a,inside=cad>=xs[0]-1e-9&&cad<=xs.at(-1)+1e-9,checks=check.map(r=>({...r,pred:best.a*r.x+best.b,error:r.y-(best.a*r.x+best.b),inside:r.x>=xs[0]&&r.x<=xs.at(-1)}));const inChecks=checks.filter(r=>r.inside);const status=!inside?'outside':!inChecks.length?'unverified':inChecks.some(r=>Math.abs(r.error)>tol+1e-9)?'fail':'pass';return {target,tol,models,best,cad,inside,range:[xs[0],xs.at(-1)],checks,status,train}}
</script>
<script>
const $=s=>document.getElementById(s),sample='5,4.72,fit\n10,9.65,fit\n20,19.46,fit\n30,29.33,fit\n15,14.57,check';let current=null;const f=x=>x.toFixed(3);function invalidate(){current=null;$('export').disabled=true;$('result').textContent='入力が変更されました。計算してください。'}
function plot(r){const [lo,hi]=r.range,X=x=>40+270*(x-lo)/(hi-lo),Y=e=>82-55*e/Math.max(r.tol,...r.train.map(p=>Math.abs(p.y-p.x)),...r.train.map(p=>Math.abs(p.y-r.best.a*p.x-r.best.b)),.01);return `<svg viewBox="0 0 340 164" role="img" aria-label="CAD寸法と誤差、補正モデル"><rect x="40" y="16" width="270" height="132" rx="4" fill="#f2f6f3"/><line x1="40" x2="310" y1="82" y2="82" stroke="#708a81"/><line x1="40" x2="310" y1="${Y(r.best.a*lo+r.best.b-lo)}" y2="${Y(r.best.a*hi+r.best.b-hi)}" stroke="#bd7541" stroke-width="2"/>${r.train.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y-p.x)}" r="4" fill="#bd7541"/><circle cx="${X(p.x)}" cy="${Y(p.y-r.best.a*p.x-r.best.b)}" r="3" fill="#26765e"/>`).join('')}<text x="4" y="85" font-size="10">0</text><text x="40" y="160" font-size="10">${lo} mm</text><text x="310" y="160" text-anchor="end" font-size="10">${hi} mm</text></svg>`}
function run(){invalidate();try{const r=analyze(parse($('data').value),$('target').value,$('tol').value);current={kind:$('kind').value,...r};const messages={outside:'範囲外：補正候補を採用せず、追加の試験を行う',unverified:'未検証：範囲内の別試験が必要',fail:'別試験で許容誤差超過：再校正が必要',pass:'範囲内の別試験は許容内（目標寸法の実機検証は別途必要）'};$('result').innerHTML=`<div class="hero"><small>推定CAD寸法（mm）</small><strong>${r.inside?f(r.cad):'—'}</strong><span class="${r.status==='pass'?'good':'warn'}">${messages[r.status]}</span></div><p>選択モデル：<b>${MODEL_NAMES[r.best.type]}</b> ／ 実測 ≈ ${f(r.best.a)} × CAD ${r.best.b<0?'−':'＋'} ${f(Math.abs(r.best.b))}</p><p class="muted">校正範囲 ${r.range.join(' – ')} mm。補正値はCAD寸法に適用する参考値です。</p>${plot(r)}<small>橙：元の誤差と推定線　緑：学習点の残差（別試験ではない）</small><h3>モデル比較</h3><table><tr><th>モデル</th><th>寸法別CV RMSE (mm)</th></tr>${r.models.map(m=>`<tr><td>${MODEL_NAMES[m.type]}${m===r.best?' ✓':''}</td><td>${f(m.cv)}</td></tr>`).join('')}</table><h3>別試験（学習に未使用）</h3><table><tr><th>CAD</th><th>実測</th><th>予測</th><th>誤差</th><th>判定</th></tr>${r.checks.map(c=>`<tr><td>${f(c.x)}</td><td>${f(c.y)}</td><td>${f(c.pred)}</td><td>${f(c.error)}</td><td>${!c.inside?'範囲外':Math.abs(c.error)<=r.tol+1e-9?'許容内':'超過'}</td></tr>`).join('')}</table>${r.checks.length?'':'<p class="muted">別試験データなし</p>'}`;$('export').disabled=false}catch(e){$('result').textContent=e.message}}
for(const id of ['data','kind','target','tol'])$(id).addEventListener('input',invalidate);$('run').onclick=run;$('reset').onclick=()=>{$('data').value=sample;$('target').value=15;$('tol').value=.08;$('kind').selectedIndex=0;run()};$('export').onclick=()=>{if(!current)return;const u=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='fitproof.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').click();
</script></html>
