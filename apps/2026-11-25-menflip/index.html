<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面継 / MENFLIP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#222c29;font:16px/1.65 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:26px 16px 50px}header{border-bottom:1px solid #b6b9ad;margin-bottom:20px}h1{font-size:clamp(32px,6vw,58px);line-height:1.1;margin:8px 0;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 10px}p{margin:8px 0}.tag{font-size:12px;letter-spacing:.16em;color:#596c61;font-weight:700}.panel{background:#fffdf7;border:1px solid #d0d1c4;border-radius:14px;padding:18px;margin:14px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-size:13px;font-weight:650}input,textarea,button{font:inherit;border:1px solid #a7b1a8;border-radius:7px;padding:9px;color:inherit}input,textarea{width:100%;background:#fff}textarea{height:260px;resize:vertical;font:14px/1.7 ui-monospace,monospace}button{background:#285b4d;color:white;border:0;cursor:pointer;font-weight:650}button.secondary{background:#e6e9df;color:#263c32}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note{font-size:13px;color:#52645a}.error{color:#a02d24;font-weight:bold}.side{border:1px solid #bdc7bc;border-radius:10px;padding:12px;margin:12px 0}.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:#e1ded2;margin:8px 0}.bar span{background:#397c67;border-right:2px solid #fffdf7}.bar span:nth-child(even){background:#80a693}.track{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #e4e6dd;padding:5px 0;overflow-wrap:anywhere}.track span:last-child{white-space:nowrap}.metric{font-size:26px;font-weight:750;color:#285b4d}.small{font-size:12px;color:#52645a}#result{min-width:0}@media(max-width:720px){.layout{grid-template-columns:1fr}}@media print{body{background:white}.inputs,.actions,header .note{display:none}.layout{display:block}.panel{border:0;break-inside:avoid}}
</style><main><header><div class="tag">ANALOG / TAPE PLANNING LAB</div><h1>面継 <span style="font-size:.5em">MENFLIP</span></h1><p>曲順を守り、絶対に入れたい曲を残す。A面・B面の録音計画。</p><p class="note">音源の取得・再生・録音は行いません。時間と条件だけで計算します。</p></header>
<div class="layout"><section class="panel inputs"><h2>01 / テープと曲目</h2><div class="fields"><label>A面 実測秒<input id="a" type="number" min="1" max="3600" value="600"></label><label>B面 実測秒<input id="b" type="number" min="1" max="3600" value="540"></label><label>各面の安全余白 秒<input id="r" type="number" min="0" max="3600" value="10"></label><label>曲間無音 秒<input id="g" type="number" min="0" max="60" value="3"></label></div><p class="note">1行1曲（最大30曲）。曲名 | 分:秒 | 優先度1〜99 | 必須/任意 | A/B/自由。連続曲は1行に合算可。</p><label for="tracks">曲順リスト（上から順に固定）</label><textarea id="tracks" spellcheck="false"></textarea><div class="actions"><button id="calc">録音計画を計算</button><button id="reset" class="secondary">サンプル</button></div><p id="status" role="status" aria-live="polite"></p></section><section class="panel" id="result" aria-live="polite"><h2>02 / 録音計画</h2><div id="output"></div><div class="actions"><button id="csv" disabled>CSV保存</button><button id="print" class="secondary" disabled>印刷</button></div></section></div><footer class="note">入力は端末内のみ。安全余白は各面の実測可能時間から差し引きます。先頭・末尾には曲間無音を加えません。実テープの伸びや速度差は保証しません。</footer></main>
<script id="core">
'use strict';
const int=(v,l,h)=>{if(!Number.isInteger(v)||v<l||v>h)throw Error('数値の範囲を確認してください');return v};
function parse(s){const lines=s.trim().split(/\n/).filter(x=>x.trim());int(lines.length,1,30);return lines.map((line,i)=>{const p=line.split('|').map(x=>x.trim()),m=/^(\d{1,2}):([0-5]\d)$/.exec(p[1]||'');if(p.length!==5||!p[0]||p[0].length>120||!m||!['必須','任意'].includes(p[3])||!['A','B','自由'].includes(p[4])||!/^\d+$/.test(p[2]))throw Error(`${i+1}行目の形式を確認してください`);return {name:p[0],d:int(+m[1]*60+ +m[2],1,3600),w:int(+p[2],1,99),req:p[3]==='必須',side:p[4]}})}
function solve(t,a,b,g){int(t.length,1,30);int(a,0,3600);int(b,0,3600);int(g,0,60);const n=t.length;
function profiles(cap,side,reverse){const lim=cap+g;let dp=new Int32Array(lim+1).fill(-1),mask=new Int32Array(lim+1);dp[0]=0;const out=[];function best(){let k=-1;for(let j=0;j<=lim;j++)if(dp[j]>=0&&(k<0||dp[j]>=dp[k]))k=j;return k<0?null:{score:dp[k],time:k? k-g:0,mask:mask[k]}}out[reverse?n:0]=best();for(let z=0;z<n;z++){const i=reverse?n-1-z:z,x=t[i],c=x.d+g,nd=x.req?new Int32Array(lim+1).fill(-1):dp.slice(),nm=x.req?new Int32Array(lim+1):mask.slice();if(x.side==='自由'||x.side===side)for(let j=0;j+c<=lim;j++)if(dp[j]>=0&&dp[j]+x.w>nd[j+c]){nd[j+c]=dp[j]+x.w;nm[j+c]=mask[j]|(1<<i)}dp=nd;mask=nm;out[reverse?i:i+1]=best()}return out}
const A=profiles(a,'A',false),B=profiles(b,'B',true);let best=null;for(let k=0;k<=n;k++){const x=A[k],y=B[k];if(!x||!y)continue;const score=x.score+y.score,time=x.time+y.time,delta=Math.abs(a-x.time-(b-y.time));if(!best||score>best.score||score===best.score&&(time>best.time||time===best.time&&delta<best.delta))best={score,time,delta,x,y,k}}return best}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function rows(t,mask,g){let end=0;return t.flatMap((x,i)=>{if(!(mask&(1<<i)))return [];const start=end?end+g:0;end=start+x.d;return [{...x,start,end}]})}
const cell=x=>'"'+String(x).replace(/^[\s]*[=+@-]/,"'$&").replace(/"/g,'""')+'"';
function makeCSV(t,p,g){return [['面','曲名','開始','終了','優先度'],...['A','B'].flatMap((s,i)=>rows(t,i?p.y.mask:p.x.mask,g).map(x=>[s,x.name,fmt(x.start),fmt(x.end),x.w])),...t.filter((_,i)=>!((p.x.mask|p.y.mask)&(1<<i))).map(x=>['未収録',x.name,'','',x.w])].map(r=>r.map(cell).join(',')).join('\r\n')}
</script><script>
const $=id=>document.getElementById(id),sample='朝の窓 | 4:00 | 8 | 必須 | A\n青い道 | 3:30 | 5 | 任意 | 自由\n小さな波 | 2:30 | 3 | 任意 | 自由\n折り返し | 3:00 | 9 | 必須 | B\n夜の散歩 | 4:00 | 7 | 任意 | 自由\n遠い灯 | 2:20 | 4 | 任意 | B';let current=null;
function el(tag,txt,cls,parent){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;if(parent)parent.append(e);return e}
function invalidate(){current=null;$('output').replaceChildren();$('csv').disabled=$('print').disabled=true;$('status').textContent='入力を変更しました。再計算してください。';$('status').className='note'}
function run(){invalidate();try{const num=(id,l,h)=>{if(!$(id).value.trim())throw Error('空欄を入力してください');return int(Number($(id).value),l,h)},a=num('a',1,3600),b=num('b',1,3600),r=num('r',0,3600),g=num('g',0,60),t=parse($('tracks').value);if(r>a||r>b)throw Error('余白が面の長さを超えています');const p=solve(t,a-r,b-r,g),o=$('output');if(!p){el('p','必須曲・面指定をすべて満たす計画はありません。','error',o);$('status').textContent='条件を見直してください。';return}const used=p.x.mask|p.y.mask;el('div',`${t.filter((_,i)=>used&(1<<i)).length} / ${t.length} 曲・${p.score} 点`,'metric',o);el('p','優先度合計 → 録音尺 → 残り時間差の順に最適化','small',o);for(const [s,x,cap] of [['A',p.x,a-r],['B',p.y,b-r]]){const d=el('div','','side',o);el('h2',`${s}面　${fmt(x.time)} / ${fmt(cap)}`,null,d);const bar=el('div','','bar',d);for(const v of rows(t,x.mask,g)){const seg=el('span','',null,bar);seg.style.width=(cap? (v.d+(v.start?g:0))/cap*100:0)+'%';seg.title=v.name;const line=el('div','','track',d);el('span',v.name,null,line);el('span',`${fmt(v.start)}–${fmt(v.end)}`,null,line)}el('p',`残り ${fmt(cap-x.time)}（安全余白別）`,'small',d)}el('h2','未収録曲',null,o);el('p',t.filter((_,i)=>!(used&(1<<i))).map(x=>x.name).join('、')||'なし',null,o);current={t,p,g};$('csv').disabled=$('print').disabled=false;$('status').textContent='計算完了';}catch(e){$('status').className='error';$('status').textContent=e.message}}
function reset(){for(const [id,v] of Object.entries({a:600,b:540,r:10,g:3,tracks:sample}))$(id).value=v;run()}
for(const id of ['a','b','r','g','tracks'])$(id).addEventListener('input',invalidate);$('calc').onclick=run;$('reset').onclick=reset;$('print').onclick=()=>{if(current)window.print()};$('csv').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob(['\ufeff',makeCSV(current.t,current.p,current.g)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='menflip.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};reset();
</script></html>
