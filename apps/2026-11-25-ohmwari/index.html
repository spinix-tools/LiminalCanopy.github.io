<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抵抗割 OHMWARI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#203b35;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #bccbc2;padding:12px 0 20px}h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:8px 0}h2{font-size:19px;margin:0 0 10px}small,.muted{color:#526b62}p{margin:8px 0}.tag{font:12px monospace;letter-spacing:.15em;color:#487767}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.panel{background:white;border:1px solid #d2ddd5;border-radius:14px;padding:18px;min-width:0}label{display:block;font-weight:650}textarea{display:block;width:100%;min-height:145px;padding:12px;border:1px solid #a1b5a8;border-radius:8px;font:16px/1.5 monospace;color:inherit;background:#f8faf7}button{border:1px solid #275747;border-radius:8px;padding:10px 16px;font:inherit;font-weight:650;background:#275747;color:white;cursor:pointer}button.alt{background:white;color:#275747}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:#e9f1e9;padding:12px;border-radius:8px}.metric strong{display:block;font-size:26px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}td,th{text-align:left;padding:9px;border-bottom:1px solid #dde5df}th{color:#526b62}.bad{color:#a13c26}.ok{color:#216749}.bar{display:inline-block;background:#6a9e83;height:8px;border-radius:6px;min-width:0}footer{margin-top:24px;font-size:13px;color:#526b62}#error{color:#a13c26;min-height:1.5em}@media(max-width:620px){main{padding:14px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.panel{padding:12px}}@media print{.grid,.actions,#error,footer{display:none}body{background:white}main{padding:0}.table{overflow:visible}}
</style><main><header><div class="tag">BENCH TOOLS / 01</div><h1>抵抗割 <span style="font-size:.45em">OHMWARI</span></h1><p>手持ちの抵抗を、複数の目標に無駄なく割り当てる。</p><small>登録不要 · オフライン · Ω単位 · 1本または2本の直列／並列</small></header>
<div class="grid"><section class="panel"><h2>01 / 部品在庫</h2><label for="stock">抵抗値 Ω, 本数, 部品公差 %</label><textarea id="stock" spellcheck="false">100,1,1
200,1,1
300,2,1
470,1,1</textarea><small>最大6種類、各0〜4本。各行は半角カンマ区切り。</small></section><section class="panel"><h2>02 / 必要な抵抗値</h2><label for="targets">目標値 Ω, 許容誤差 %</label><textarea id="targets" spellcheck="false">300,2
150,2
470,2</textarea><small>最大6件。上から R1、R2… として扱います。部品公差の最悪値まで含めて判定。</small></section></div>
<div class="actions"><button id="run">全体を最適化</button><button id="reset" class="alt">サンプルに戻す</button><button id="csv" class="alt" disabled>CSV出力</button><button id="print" class="alt" disabled>印刷</button></div><p id="error" role="alert"></p><section id="result" class="panel" aria-live="polite" hidden></section><footer>低電圧の教育・試作向けの抵抗値モデルです。定格電力、耐電圧、発熱、温度係数、故障、実装可否は評価しません。実回路では別途確認してください。データは送信・保存しません。</footer></main>
<script id="engine">
function parse(raw,stock){const lines=raw.trim().split(/\r?\n/).filter(x=>x.trim());if(!raw.trim()||lines.length>6)throw Error('1〜6行で入力してください。');return lines.map((line,i)=>{const p=line.split(',').map(x=>x.trim());const a=p.map(Number);if(p.length!==(stock?3:2)||p.some(x=>!/^\d+(\.\d+)?$/.test(x))||a.some(x=>!Number.isFinite(x))||a[0]<0.1||a[0]>1e7||(stock?(!Number.isInteger(a[1])||a[1]<0||a[1]>4||a[2]>30):(a[1]>30)))throw Error((stock?'在庫':'目標')+' '+(i+1)+'行目：値0.1〜10000000、公差0〜30%、本数0〜4の範囲で入力してください。');return stock?{r:a[0],n:a[1],t:a[2]}:{r:a[0],t:a[1]};});}
function solve(stock,targets){const n=stock.length,base=stock.map((_,i)=>5**i),start=stock.reduce((s,x,i)=>s+x.n*base[i],0);const avail=(s,c)=>c.ids.every(i=>Math.floor(s/base[i])%5>=c.ids.filter(j=>j===i).length);const combine=(a,b,m)=>m==='S'?a+b:a*b/(a+b);const parts=[];function add(ids,m){let v=ids.map(i=>stock[i]);let calc=k=>ids.length===1?v[0].r*(1+k*v[0].t/100):combine(v[0].r*(1+k*v[0].t/100),v[1].r*(1+k*v[1].t/100),m);parts.push({ids,m,r:calc(0),lo:calc(-1),hi:calc(1),cost:ids.reduce((s,i)=>s+base[i],0)});}for(let i=0;i<n;i++){add([i],'1');for(let j=i;j<n;j++){add([i,j],'S');add([i,j],'P');}}const opts=targets.map(t=>parts.map(c=>({...c,e:Math.max(Math.abs(c.lo/t.r-1),Math.abs(c.hi/t.r-1))*100})).filter(c=>c.e<=t.t+1e-9).sort((a,b)=>a.ids.length-b.ids.length||a.e-b.e));const better=(a,b)=>a.k>b.k||a.k===b.k&&(a.p<b.p||a.p===b.p&&a.e<b.e-1e-9);const memo=new Map();function rec(i,s){if(i===targets.length)return {k:0,p:0,e:0,plan:[]};const key=i*15625+s;if(memo.has(key))return memo.get(key);let z=rec(i+1,s),best={...z,plan:[null,...z.plan]};for(const c of opts[i])if(avail(s,c)){z=rec(i+1,s-c.cost);let q={k:z.k+1,p:z.p+c.ids.length,e:z.e+c.e,plan:[c,...z.plan]};if(better(q,best))best=q;}memo.set(key,best);return best;}let s=start;const greedy=opts.map(list=>{let c=list.find(c=>avail(s,c))||null;if(c)s-=c.cost;return c;});return {best:rec(0,start),greedy,states:memo.size};}
</script><script>
const $=id=>document.getElementById(id),stock=$('stock'),targets=$('targets'),result=$('result'),fmt=x=>Number(x.toPrecision(7)).toString();let data=null;const sample=[stock.value,targets.value];function invalidate(){data=null;result.hidden=true;$('csv').disabled=$('print').disabled=true;$('error').textContent='';}function run(){invalidate();try{const a=parse(stock.value,true),t=parse(targets.value,false),s=solve(a,t),g=s.greedy.filter(Boolean).length,used=a.map(()=>0);s.best.plan.forEach(c=>c?.ids.forEach(i=>used[i]++));const expr=c=>c?c.ids.map(i=>fmt(a[i].r)+'Ω').join(c.m==='S'?' + ':' ∥ '):'未割当';const rows=t.map((v,i)=>{let c=s.best.plan[i];return ['R'+(i+1),fmt(v.r),v.t,expr(c),c?fmt(c.r):'',c?fmt(c.lo)+' – '+fmt(c.hi):'',c?fmt(c.e):'',expr(s.greedy[i])];});const headers=['目標','Ω','許容%','推奨接続','合成Ω','公差範囲Ω','最悪誤差%','入力順の案'];const table=(h,r)=>'<div class="table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';result.innerHTML='<h2>03 / 割当結果</h2><div class="metrics"><div class="metric">充足目標<strong>'+s.best.k+' / '+t.length+'</strong></div><div class="metric">入力順の案<strong>'+g+' / '+t.length+'</strong></div><div class="metric">使用部品<strong>'+s.best.p+' 本</strong></div></div><p>充足数を最大化 → 使用本数を最小化 → 最悪誤差の合計を最小化。</p>'+table(headers,rows)+'<h2 style="margin-top:20px">部品の残り</h2>'+table(['種類','抵抗Ω','使用 / 在庫','残り'],a.map((v,i)=>['#'+(i+1),fmt(v.r),used[i]+' / '+v.n,v.n-used[i]]))+'<p class="muted">探索状態 '+s.states+' 件。未割当は、この制約内で全目標を同時充足できない場合があります。</p>';data=[headers,...rows,[],['種類','抵抗Ω','使用本数','残り本数'],...a.map((v,i)=>[i+1,v.r,used[i],v.n-used[i]])];result.hidden=false;$('csv').disabled=$('print').disabled=false;}catch(e){$('error').textContent=e.message;}}
stock.oninput=targets.oninput=invalidate;$('run').onclick=run;$('reset').onclick=()=>{[stock.value,targets.value]=sample;run();};$('print').onclick=()=>window.print();$('csv').onclick=()=>{if(!data)return;const url=URL.createObjectURL(new Blob(['\ufeff'+data.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ohmwari.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};run();
</script></html>
