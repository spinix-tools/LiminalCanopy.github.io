<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpoolFit — 残糸割付ラボ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f1;color:#193c36;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}header{border-bottom:1px solid #b8cbc3;margin-bottom:24px;padding-bottom:16px}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#526b63}section{background:white;border:1px solid #d0ddd5;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid section{margin:0;min-width:0}label{display:block;font-weight:650;margin:8px 0}textarea,input,button{font:inherit}textarea{width:100%;min-height:150px;border:1px solid #8ca59b;border-radius:8px;padding:12px;resize:vertical;font-family:monospace}input{max-width:100%;padding:7px;border:1px solid #8ca59b;border-radius:6px}button{cursor:pointer;border:1px solid #286a58;background:#286a58;color:white;border-radius:8px;padding:10px 16px;margin:5px 4px 5px 0}button.secondary{background:white;color:#286a58}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #d18d42;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#eaf3ed;padding:14px;border-radius:10px}.metric b{display:block;font-size:26px}.bar{display:flex;height:24px;background:#e6ece7;border-radius:6px;overflow:hidden;margin:6px 0}.used{background:#367d68}.uncertain{background:#d8a55d}.warn{color:#9d4329}article{padding:12px 0;border-bottom:1px solid #dbe4dd;overflow-wrap:anywhere}article:last-child{border:0}#error{color:#9d4329;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:640px){main{padding:14px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}section{padding:14px}}@media print{button,.grid,#error{display:none}body{background:white}section{break-inside:avoid}}
</style><main><header><small>MAKER TOOLS / 01 — LOCAL ONLY</small><h1>SpoolFit</h1><p>残糸割付ラボ — 余ったフィラメントで、何件の造形を終えられるか。</p><small>同一材質・色・径・互換性の確認済みスプールのみ。1ジョブは1スプールで完結。</small></header>
<div class="grid"><section><h2>01 / スプール</h2><label for="spools">ID,総重量g,空重量下限g,空重量上限g</label><textarea id="spools" spellcheck="false"></textarea><small>最大8本。整数g。空重量は実測・メーカー情報に基づく範囲。</small></section><section><h2>02 / 印刷ジョブ</h2><label for="jobs">ID,スライサー推定g</label><textarea id="jobs" spellcheck="false"></textarea><small>最大12件。サポート・パージ等も含めて入力。</small><label for="reserve">各ジョブの追加余裕（%）</label><input id="reserve" type="number" min="0" max="100" step="1" value="0"></section></div>
<p><button id="run">割付を計算</button><button class="secondary" id="sample">例を読み込む</button><button class="secondary" id="save" disabled>JSON保存</button><button class="secondary" onclick="print()">印刷</button></p><p id="error" role="alert"></p><section id="result" aria-live="polite"></section><p class="muted">計算上の下限は入力した空重量範囲に依存します。湿気・巻き癖・残糸の供給不能・実消費の変動は別途確認してください。入力は通信・永続保存しません。</p></main>
<script id="engine">
function parse(text,cols,max){const rows=text.trim().split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split(',').map(y=>y.trim()));if(!rows.length||rows.length>max)throw Error('行数は1〜'+max+'件です');const seen=new Set();return rows.map(r=>{if(r.length!==cols||!r[0]||r[0].length>40||seen.has(r[0]))throw Error('列数・IDの重複または長さを確認');seen.add(r[0]);const nums=r.slice(1).map(s=>{if(!/^\d+$/.test(s)||Number(s)>100000)throw Error('重量は0〜100000の整数g');return Number(s)});return [r[0],...nums]})}
function solve(spools,jobs,reserve){if(!Number.isInteger(reserve)||reserve<0||reserve>100)throw Error('余裕は0〜100の整数%');const s=spools.map(([id,g,lo,hi])=>{if(lo>hi||hi>g)throw Error(id+': 空重量下限 ≤ 上限 ≤ 総重量が必要');return {id,low:g-hi,high:g-lo}}),j=jobs.map(([id,g])=>{if(g<=0)throw Error(id+': 消費量は正の整数');return {id,g,need:Math.ceil(g*(100+reserve)/100)}});const n=j.length,N=1<<n,weights=new Int32Array(N),counts=new Uint8Array(N);for(let m=1;m<N;m++){const bit=m&-m,i=31-Math.clz32(bit);weights[m]=weights[m^bit]+j[i].need;counts[m]=counts[m^bit]+1}function exact(key){let reachable=new Uint8Array(N);reachable[0]=1;const history=[];for(const spool of s){const next=new Uint8Array(N),choice=new Int32Array(N).fill(-1);for(let m=0;m<N;m++)if(reachable[m]){let rem=(N-1)^m;for(let sub=rem;;sub=(sub-1)&rem){if(weights[sub]<=spool[key]&&!next[m|sub]){next[m|sub]=1;choice[m|sub]=sub}if(!sub)break}}history.push(choice);reachable=next}let best=0;for(let m=1;m<N;m++)if(reachable[m]&&(counts[m]>counts[best]||counts[m]===counts[best]&&weights[m]>weights[best]))best=m;let m=best;const masks=[];for(let k=s.length-1;k>=0;k--){const sub=history[k][m];masks.unshift(sub);m^=sub}return report(masks,key)}function report(masks,key){const union=masks.reduce((a,b)=>a|b,0);return {count:counts[union],grams:weights[union],spools:s.map((v,k)=>({...v,capacity:v[key],used:weights[masks[k]],jobs:j.filter((_,i)=>masks[k]&(1<<i))})),unassigned:j.filter((_,i)=>!(union&(1<<i)))}}const masks=s.map(()=>0);j.forEach((job,i)=>{const k=s.findIndex((v,k)=>v.low-weights[masks[k]]>=job.need);if(k>=0)masks[k]|=1<<i});return {reserve,jobs:j,greedy:report(masks,'low'),robust:exact('low'),optimistic:exact('high')}}
</script><script>
const $=id=>document.getElementById(id);let last=null;function el(tag,t,cls){const e=document.createElement(tag);if(t!==undefined)e.textContent=t;if(cls)e.className=cls;return e}function invalidate(){$('result').replaceChildren(el('p','条件を変更しました。再計算してください。'));$('error').textContent='';$('save').disabled=true;last=null}function render(){invalidate();try{if(!$('reserve').value.trim())throw Error('余裕を入力してください');last=solve(parse($('spools').value,4,8),parse($('jobs').value,2,12),Number($('reserve').value));const out=$('result'),r=last.robust;out.replaceChildren(el('h2','03 / 割付結果'));const metrics=el('div',undefined,'metrics');for(const [label,v] of [['入力順・下限',last.greedy],['最適・下限',r],['最適・上限',last.optimistic]]){const e=el('div',undefined,'metric');e.append(el('small',label),el('b',v.count+' / '+last.jobs.length+' 件'),el('small',v.grams+' g 割付'));metrics.append(e)}out.append(metrics,el('p','推奨は空重量上限から算出した残量下限に基づきます。上限案は楽観的な参考値。'));for(const [label,plan] of [['下限の最適案（推奨）',r],['上限の最適案（参考）',last.optimistic]]){out.append(el('h2',label));for(const s of plan.spools){const a=el('article');a.append(el('strong',s.id+' — '+s.used+' / '+s.capacity+' g'),el('p','残量範囲 '+s.low+'〜'+s.high+' g'));const bar=el('div',undefined,'bar');const used=el('div',undefined,'used'),unc=el('div',undefined,'uncertain');used.style.width=100*s.used/Math.max(1,s.high)+'%';unc.style.width=100*Math.max(0,s.high-Math.max(s.low,s.used))/Math.max(1,s.high)+'%';bar.append(used,unc);a.append(bar,el('p',s.jobs.map(j=>j.id+' ('+j.need+'g)').join(' / ')||'未使用'),el('small','割付後の想定残量 '+(s.capacity-s.used)+' g'));out.append(a)}out.append(el('p','未割付：'+(plan.unassigned.map(j=>j.id+' ('+j.need+'g)').join(' / ')||'なし'),plan.unassigned.length?'warn':''))}out.append(el('small','緑：割付量／橙：空重量の不確実な領域（未使用部分）／薄灰：その他の残量'));$('save').disabled=false}catch(e){$('error').textContent=e.message}}
function sample(){$('spools').value='S1,320,210,220\nS2,270,190,200';$('jobs').value='J1,70\nJ2,60\nJ3,40';$('reserve').value='0';render()}for(const id of ['spools','jobs','reserve'])$(id).addEventListener('input',invalidate);$('run').onclick=render;$('sample').onclick=sample;$('save').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='spoolfit-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};sample();
</script></html>
