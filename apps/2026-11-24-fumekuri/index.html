<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>譜めくり間 / FUMEKURI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#202b37;font:15px/1.65 system-ui,sans-serif}header{background:#203447;color:#fff;padding:26px max(20px,calc((100% - 1100px)/2));border-bottom:5px solid #d4ad66}h1{font-size:30px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{margin:6px 0 15px}.tag{font-size:12px;letter-spacing:3px;color:#e4c892}main{max-width:1140px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:white;border:1px solid #ddd9cc;border-radius:12px;padding:18px;min-width:0}label{display:block;font-weight:600;margin-top:10px}input,select,textarea,button{font:inherit;border:1px solid #bdc5c8;border-radius:6px;padding:7px 9px;color:inherit}input,select,textarea{width:100%;background:white}textarea{font-family:ui-monospace,monospace;font-size:13px;min-height:230px;resize:vertical;white-space:pre}button{background:white;cursor:pointer;font-weight:600}button:hover{background:#eef3f4}button.primary{background:#286767;color:white;border-color:#286767}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.muted,small{color:#52636e;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:11px;background:#f0f5f3;border-radius:8px}.stat strong{font-size:25px;display:block;line-height:1.25}.bad{color:#9d391f}.good{color:#216a5c}.spreads{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.spread{display:flex;gap:4px;align-items:stretch}.page{flex:1;min-width:0;border:1px solid #c9c6b9;background:#fffcf4;border-radius:4px;padding:7px;display:flex;flex-direction:column;min-height:150px}.page.empty{background:#eeeae0;border-style:dashed;justify-content:center;text-align:center;color:#697780}.strip{background:#dce9e4;border-bottom:1px solid white;padding:2px 4px;overflow-wrap:anywhere;font-size:12px;min-height:18px}.fill{flex:1}.marker{font-size:11px;font-weight:700;border-top:1px solid #d6d0c3;padding-top:4px;margin-top:6px}.alert{background:#fff0e6;padding:10px;border-radius:6px;color:#92351e}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;text-align:left;border-bottom:1px solid #e0ddd5}footer{max-width:1100px;margin:16px auto;padding:0 16px;color:#52636e;font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr}.stats .stat strong{font-size:21px}}@media print{header,.inputs,footer,.buttons{display:none}main{display:block;margin:0;padding:0}.panel{border:0}.spread{break-inside:avoid}}
</style>
<header><div class="tag">SCORE LAYOUT LAB / 01</div><h1>譜めくり間 <small style="color:#e4c892">FUMEKURI</small></h1><p>演奏を止めない改ページを、組版の前に計画する。</p></header>
<main><section class="panel inputs"><h2>01 / 条件を入力</h2><label for="cap">1ページの高さ上限（任意単位）</label><input id="cap" type="number" min="1" max="100" value="8"><label for="max">最大ページ数（1〜60）</label><input id="max" type="number" min="1" max="60" value="6"><label for="need">めくりに必要な余裕（秒）</label><input id="need" type="number" min="0" max="60" step="0.1" value="2"><label for="mode">閲覧方式</label><select id="mode"><option value="right">見開き・最初は右ページ</option><option value="left">見開き・最初は左ページ</option><option value="single">1ページずつ表示</option></select><label for="rows">段（システム）一覧：段番号または短いラベル, 高さ, 直後の自由時間（秒）</label><textarea id="rows" spellcheck="false" aria-describedby="hint"></textarea><p id="hint" class="muted">1行1段、半角カンマ区切り。最大120段。休符や暗譜で手を離せる時間を入力。最終段の時間は不使用。高さは整数、時間は0.1秒刻み。</p><div class="buttons"><button class="primary" id="run">配置を計算</button><button id="sample">例を戻す</button><button id="save">端末に保存</button></div><p id="status" role="status" class="muted"></p></section><section class="panel"><h2>02 / 配置結果</h2><div id="out" aria-live="polite"></div><div class="buttons"><button id="csv" disabled>CSV出力</button><button id="print">印刷</button></div></section></main><footer>入力は端末内だけで処理。楽譜ファイルの読み込み・自動組版・反復記号の解釈は未対応。演奏時の実測と確認が必要です。</footer>
<script id="core">
function parseRows(s,cap){const lines=s.trim().split(/\r?\n/).filter(x=>x.trim());if(!s.trim()||lines.length>120)throw Error('段数は1〜120で入力してください。');return lines.map((line,i)=>{const a=line.split(',').map(x=>x.trim()),h=Number(a[1]),r=Number(a[2]);if(a.length!==3||!a[0]||a[0].length>40||!a[1]||!a[2]||!Number.isInteger(h)||h<1||h>cap||!Number.isFinite(r)||r<0||r>120||Math.abs(r*10-Math.round(r*10))>1e-7)throw Error((i+1)+'行目：ラベル、高さ1〜上限、自由時間0〜120秒（0.1秒刻み）を確認。');return {label:a[0],h,r:Math.round(r*10)}})}
function turn(p,mode){return mode==='single'||(mode==='right'?p%2===1:p%2===0)}
function score(pages,rows,cap,need,mode){let bad=0,short=0,waste=0;pages.forEach((p,i)=>{const d=i<pages.length-1&&turn(i+1,mode)?Math.max(0,need-rows[p.end-1].r):0;bad+=+(d>0);short+=d;waste+=(cap-p.used)**2});return [bad,short,pages.length,waste]}
function less(a,b){for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i]}return false}
function optimize(rows,cap,limit,need,mode){const n=rows.length,dp=Array.from({length:limit+1},()=>Array(n+1).fill(null));dp[0][0]={v:[0,0,0,0],prev:0,used:0};let best=null,bp=0;for(let p=1;p<=limit;p++){for(let i=0;i<n;i++){const prev=dp[p-1][i];if(!prev)continue;let used=0;for(let j=i+1;j<=n;j++){used+=rows[j-1].h;if(used>cap)break;const d=j<n&&turn(p,mode)?Math.max(0,need-rows[j-1].r):0;const v=[prev.v[0]+ +(d>0),prev.v[1]+d,p,prev.v[3]+(cap-used)**2];if(!dp[p][j]||less(v,dp[p][j].v))dp[p][j]={v,prev:i,used}}}if(dp[p][n]&&(!best||less(dp[p][n].v,best.v))){best=dp[p][n];bp=p}}if(!best)return null;let j=n,pages=[];for(let p=bp;p>0;p--){const x=dp[p][j];pages.unshift({start:x.prev,end:j,used:x.used});j=x.prev}return {pages,v:best.v}}
function greedy(rows,cap){let pages=[],start=0,used=0;rows.forEach((r,i)=>{if(used+r.h>cap){pages.push({start,end:i,used});start=i;used=0}used+=r.h});pages.push({start,end:rows.length,used});return pages}
</script>
<script>
const $=id=>document.getElementById(id),ids=['cap','max','need','mode','rows'],key='fumekuri-v1',demo=['1–4,2,0','5–8,2,0.5','9–12,2,3','13–16,2,0','17–20,3,0','21–24,2,2.5','25–28,2,0','29–32,2,0','33–36,2,3','37–40,2,0','41–44,2,0.5','45–48,2,0'].join('\n');let result=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function settings(){return Object.fromEntries(ids.map(id=>[id,$(id).value]))}function apply(s){ids.forEach(id=>{if(typeof s[id]==='string')$(id).value=s[id]})}function pageHtml(p,i,rows,cap,need,mode,total){let last=i===total-1,t=!last&&turn(i+1,mode),r=rows[p.end-1].r,d=Math.max(0,need-r);return '<div class="page"><b>p.'+(i+1)+' <small>'+p.used+'/'+cap+'</small></b>'+rows.slice(p.start,p.end).map(x=>'<div class="strip" style="flex:'+x.h+'">'+esc(x.label)+'</div>').join('')+'<div class="fill" style="flex:'+Math.max(0,cap-p.used)+'"></div><div class="marker '+(t?(d?'bad':'good'):'')+'">'+(last?'終端':t?'↪ '+(d?'不足 '+(d/10).toFixed(1)+'秒':'余裕あり')+' / '+(r/10).toFixed(1)+'秒':'→ 見開き内')+'</div></div>'}
function calculate(){result=null;$('csv').disabled=true;try{const s=settings(),cap=Number(s.cap),limit=Number(s.max),need=Number(s.need)*10,mode=s.mode;if(!s.cap||!s.max||!s.need||!Number.isInteger(cap)||cap<1||cap>100||!Number.isInteger(limit)||limit<1||limit>60||!Number.isFinite(need)||need<0||need>600||Math.abs(need-Math.round(need))>1e-7)throw Error('上限・ページ数・必要秒数を確認してください。');const target=Math.round(need),rows=parseRows(s.rows,cap),base=greedy(rows,cap),b=score(base,rows,cap,target,mode),opt=optimize(rows,cap,limit,target,mode);if(!opt)throw Error('ページ上限では配置できません。詰め込み方式でも最低 '+base.length+' ページ必要です。');result={rows,pages:opt.pages,need:target,mode};const [bad,short,count]=opt.v,html=opt.pages.map((p,i)=>pageHtml(p,i,rows,cap,target,mode,count));let spreads=[];if(mode==='right')spreads.push('<div class="spread"><div class="page empty">開始面</div>'+html.shift()+'</div>');while(html.length){spreads.push('<div class="spread">'+html.splice(0,mode==='single'?1:2).join('')+'</div>')}$('out').innerHTML='<div class="stats"><div class="stat"><small>余裕不足のめくり</small><strong class="'+(bad?'bad':'good')+'">'+bad+' 回</strong></div><div class="stat"><small>不足時間合計</small><strong>'+ (short/10).toFixed(1)+' 秒</strong></div><div class="stat"><small>使用ページ</small><strong>'+count+' 枚</strong></div></div><p>詰め込み方式：不足 '+b[0]+' 回 / '+(b[1]/10).toFixed(1)+' 秒 / '+b[2]+' ページ。最適化は不足回数 → 不足秒数 → ページ数 → 空き高さの二乗和の順に最小化。</p>'+(bad?'<p class="alert">指定条件では余裕不足が残ります。赤い位置を確認してください。</p>':'<p class="good">入力した条件では、全ての実際のめくりが余裕時間を満たします。</p>')+'<div class="spreads">'+spreads.join('')+'</div><h2 style="margin-top:20px">03 / 改ページ指示</h2><table><thead><tr><th>ページ</th><th>最終段</th><th>次へ</th></tr></thead><tbody>'+opt.pages.map((p,i)=>'<tr><td>'+ (i+1)+'</td><td>'+esc(rows[p.end-1].label)+'</td><td>'+(i===count-1?'終端':turn(i+1,mode)?'めくる':'見開き内')+'</td></tr>').join('')+'</tbody></table>';$('csv').disabled=false;$('status').textContent='計算済み';}catch(e){$('out').innerHTML='<p class="alert">'+esc(e.message)+'</p>';$('status').textContent='入力を確認'}}
function reset(){apply({cap:'8',max:'6',need:'2',mode:'right',rows:demo});calculate()}
$('run').onclick=calculate;$('sample').onclick=reset;$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(settings()));$('status').textContent='この端末に保存しました'}catch(e){$('status').textContent='保存できませんでした'}};ids.forEach(id=>$(id).addEventListener('input',()=>{result=null;$('csv').disabled=true;$('out').textContent='条件が変わりました。配置を再計算してください。'}));$('print').onclick=()=>window.print();$('csv').onclick=()=>{if(!result)return;const {rows,pages,need,mode}=result;const q=x=>'"'+String(x).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const lines=[['page','first','last','height','turn','free_seconds','short_seconds'],...pages.map((p,i)=>{const t=i<pages.length-1&&turn(i+1,mode),r=rows[p.end-1].r;return [i+1,rows[p.start].label,rows[p.end-1].label,p.used,t?'yes':'no',t?r/10:'',t?Math.max(0,need-r)/10:'']})];const url=URL.createObjectURL(new Blob(['\ufeff'+lines.map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='fumekuri.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};reset();try{const s=JSON.parse(localStorage.getItem(key));if(s){apply(s);calculate()}}catch(e){}
</script></html>
