<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>HeaderTrace | 表見出し差分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#18332f;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(30px,5vw,48px);margin:0;letter-spacing:-.04em}h2{font-size:18px;margin:0 0 10px}p{margin:8px 0 16px}small{color:#45645e}.tag{font-size:12px;font-weight:bold;letter-spacing:.14em;color:#397468}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:white;border:1px solid #d8e2dc;border-radius:14px;padding:16px;margin:12px 0;min-width:0}label{display:block;font-weight:700;margin-bottom:5px}textarea{width:100%;min-height:225px;resize:vertical;background:#f8faf9;border:1px solid #bacdc3;border-radius:8px;padding:10px;font:13px/1.5 monospace;color:#18332f}button{border:1px solid #387365;border-radius:8px;background:white;color:#21594e;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:#21594e;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c78a35;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{flex:1;min-width:130px;background:#e9f1eb;border-radius:10px;padding:12px}.stat b{display:block;font-size:27px}.scroll{overflow:auto;max-height:360px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #d8e2dc;padding:9px;text-align:left;overflow-wrap:anywhere;vertical-align:top}th{background:#e9f1eb}td.hit{background:#f8e2ad}th.ref{background:#b9e1d5}td.changed{border-left:4px solid #bd7639}td button{font-size:12px;padding:4px 7px;overflow-wrap:anywhere;max-width:100%}.error{color:#9a351b;white-space:pre-wrap}.muted{color:#45645e}.selected{outline:2px solid #21594e}pre{white-space:pre-wrap;overflow-wrap:anywhere}select{font:inherit;padding:6px;max-width:100%}@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}.panel{padding:12px}}
</style>
<main><div class="tag">HOURLY APP LAB / ACCESSIBILITY QA</div><h1>HeaderTrace</h1><p>表の見出し関連を変更前後で比較。データセルの安定した id を基準に、誤った参照や意図しない差分を見つけます。</p><small>明示的な headers/id のみを検査します。スクリーンリーダーの読み上げやWCAG適合を保証しません。入力は外部送信・保存しません。機密情報・個人情報は入力しないでください。</small>
<div class="grid"><section class="panel"><label for="before">変更前 HTML</label><textarea id="before" spellcheck="false"></textarea></section><section class="panel"><label for="after">変更後 HTML</label><textarea id="after" spellcheck="false"></textarea></section></div>
<div class="actions"><button id="run" class="primary">差分を検査</button><button id="reset">サンプル</button><button id="export" disabled>JSON保存</button></div><p id="status" role="status" aria-live="polite"></p>
<section id="results" hidden><div class="stats" id="stats"></div><section class="panel"><h2>データセル別の差分</h2><label for="filter">表示</label><select id="filter"><option value="all">全件</option><option value="diff">変更・追加・削除</option><option value="issue">参照問題あり（変更後）</option></select><div class="scroll"><table><thead><tr><th>セル ID</th><th>変更前</th><th>変更後</th><th>判定</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>選択セルの参照先</h2><p id="detail"></p><small>黄色＝選択データセル、緑＝有効な明示見出し。HTMLの文字と結合セルだけを再構成した模式表です。</small><div class="grid"><div><h3>変更前</h3><div class="scroll" id="viewA"></div></div><div><h3>変更後</h3><div class="scroll" id="viewB"></div></div></div></section></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id), split=s=>s?s.split(/[\t\n\f\r ]+/).filter(Boolean):[], norm=s=>s.replace(/\s+/g,' ').trim();
function parse(html){
 if(html.length>100000)throw Error('HTMLは10万文字以内にしてください');
 const t=document.createElement('template');t.innerHTML=html;const tables=t.content.querySelectorAll('table');if(tables.length!==1)throw Error('入れ子なしの表を1個だけ入力してください');
 const table=tables[0], rows=Array.from(table.rows);if(rows.length>100||!rows.length)throw Error('表は1〜100行にしてください');
 const ids=new Map();for(const e of t.content.querySelectorAll('[id]')){const id=e.getAttribute('id');if(!ids.has(id))ids.set(id,[]);ids.get(id).push(e)}
 const cells=[],byId=new Map(), data=new Map();for(const row of rows){for(const el of row.cells){if(cells.length>=500)throw Error('最大500セルです');const id=el.getAttribute('id')||'',kind=el.tagName.toLowerCase(),rs=el.rowSpan,cs=el.colSpan;if(rs<1||rs>100||cs>100)throw Error('rowspan=0および100を超える結合は未対応');const c={id,kind,text:norm(el.textContent),row:row.rowIndex,rs,cs,tokens:split(el.getAttribute('headers')),has:el.hasAttribute('headers'),refs:[],issues:[]};cells.push(c);byId.set(el,c);if(kind==='td'){if(!id||split(id).length!==1||split(id)[0]!==id||ids.get(id).length!==1)throw Error('全tdに重複しない空白なしの安定idが必要です（例: id="sales-q1"）');data.set(id,c)}}}
 for(const c of cells){if(c.kind!=='td')continue;if(!c.has||!c.tokens.length)c.issues.push('明示参照なし');const seen=new Set();for(const id of c.tokens){if(seen.has(id)){c.issues.push('重複トークン: '+id);continue}seen.add(id);const hits=ids.get(id)||[];if(hits.length!==1){c.issues.push((hits.length?'ID重複: ':'ID不在: ')+id);continue}const h=byId.get(hits[0]);if(!h||h.kind!=='th'){c.issues.push('同じ表のthではない: '+id);continue}c.refs.push({id,text:h.text});if(!h.text)c.issues.push('見出しテキスト空: '+id)}}
 return {cells,data};
}
function compare(a,b){return [...new Set([...a.data.keys(),...b.data.keys()])].map(id=>{const x=a.data.get(id)||null,y=b.data.get(id)||null;const changes=[];if(!x)changes.push('追加');else if(!y)changes.push('削除');else{const p=new Map(x.refs.map(r=>[r.id,r.text])),q=new Map(y.refs.map(r=>[r.id,r.text]));for(const k of p.keys())if(!q.has(k))changes.push('参照消失: '+k);for(const k of q.keys())if(!p.has(k))changes.push('参照追加: '+k);for(const [k,v] of p)if(q.has(k)&&q.get(k)!==v)changes.push('見出し文言変更: '+k);if(JSON.stringify(x.tokens)!==JSON.stringify(y.tokens))changes.push('headers列変更');if(JSON.stringify(x.issues)!==JSON.stringify(y.issues))changes.push('問題状態変更');if(x.has!==y.has)changes.push('headers属性有無変更')}return {id,before:x,after:y,changes}})}
const sample=`<table><caption>販売数</caption><tr><th rowspan="2" id="area">地域</th><th colspan="2" id="year">2026年</th></tr><tr><th id="q1">上期</th><th id="q2">下期</th></tr><tr><th id="east">東</th><td id="e1" headers="east year q1">120</td><td id="e2" headers="east year q2">180</td></tr><tr><th id="west">西</th><td id="w1" headers="west year q1">90</td><td id="w2" headers="west year q2">110</td></tr></table>`;
let result=null, selected='';const add=(parent,tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e};
function summary(c){return c?c.refs.map(r=>r.id+' ['+r.text+']').join(' / ')+(c.issues.length?'\n⚠ '+c.issues.join(' / '):'')||'参照なし':'—'}
function preview(model,root,id){root.replaceChildren();const table=add(root,'table'), target=model.data.get(id), refs=new Set(target?.refs.map(r=>r.id)||[]);let prev=-1,tr;for(const c of model.cells){if(c.row!==prev){tr=add(table,'tr');prev=c.row}const el=add(tr,c.kind,c.text||'（空）',c.kind==='td'&&c.id===id?'hit':c.kind==='th'&&refs.has(c.id)?'ref':'');el.rowSpan=c.rs;el.colSpan=c.cs;el.title=c.id}}
function choose(id){selected=id;const r=result.rows.find(r=>r.id===id);$('detail').textContent=id+'：'+(r.changes.join(' / ')||'差分なし')+'｜前: '+summary(r.before)+'｜後: '+summary(r.after);preview(result.a,$('viewA'),id);preview(result.b,$('viewB'),id);for(const btn of $('rows').querySelectorAll('button'))btn.setAttribute('aria-pressed',String(btn.textContent===id))}
function render(){const {rows}=result;$('stats').replaceChildren();for(const [label,num] of [['対象ID',rows.length],['差分あり',rows.filter(r=>r.changes.length).length],['変更後の参照問題',rows.filter(r=>r.after?.issues.length).length]]){const d=add($('stats'),'div',label,'stat');add(d,'b',num)}$('rows').replaceChildren();const f=$('filter').value;for(const r of rows.filter(r=>f==='all'||f==='diff'&&r.changes.length||f==='issue'&&r.after?.issues.length)){const tr=add($('rows'),'tr'),td=add(tr,'td',undefined,r.changes.length?'changed':'');const btn=add(td,'button',r.id);btn.onclick=()=>choose(r.id);add(tr,'td',summary(r.before));add(tr,'td',summary(r.after));add(tr,'td',r.changes.join(' / ')||'差分なし')}if(rows.length)choose(rows.some(r=>r.id===selected)?selected:rows.find(r=>r.changes.length)?.id||rows[0].id);else{$('detail').textContent='データセルなし';$('viewA').replaceChildren();$('viewB').replaceChildren()}}
function clear(){result=null;selected='';$('results').hidden=true;$('export').disabled=true;$('status').textContent='入力変更後は再検査してください';$('status').className='muted'}
function run(){clear();try{const a=parse($('before').value),b=parse($('after').value);result={a,b,rows:compare(a,b)};render();$('results').hidden=false;$('export').disabled=false;$('status').textContent='検査完了。差分は意図した変更も含みます。'}catch(e){clear();$('status').textContent=e.message;$('status').className='error'}}
$('run').onclick=run;$('filter').onchange=()=>{if(result)render()};for(const k of ['before','after'])$(k).oninput=clear;
$('reset').onclick=()=>{$('before').value=sample;$('after').value=sample.replace('下期','後半').replace('east year q1','east year q2').replace('west year q1','west year missing');$('filter').value='all';run()};
$('export').onclick=()=>{if(!result)return;const u=URL.createObjectURL(new Blob([JSON.stringify({version:1,rows:result.rows},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='headertrace.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').click();
</script></html>
