<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>袖割 / SODEWARI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#26382e;font:15px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}header{background:#203d32;color:#fff;padding:26px;border-radius:18px}h1{font-size:36px;margin:0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.tag{font-size:12px;letter-spacing:.18em;color:#c9dca9}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}section{min-width:0;background:#fff;border:1px solid #dadfd4;border-radius:14px;padding:18px}.wide{grid-column:1/-1}label{display:block;font-weight:650;margin:8px 0}textarea,input,button{font:inherit}textarea{width:100%;height:136px;border:1px solid #9ca99d;border-radius:8px;padding:10px;resize:vertical;font-family:monospace}button{border:1px solid #486752;background:white;color:#203d32;border-radius:8px;padding:8px 13px;cursor:pointer}button.primary{background:#286048;color:white}button:hover{filter:brightness(.95)}button:focus-visible,textarea:focus-visible{outline:3px solid #d6a744;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.small{font-size:13px;color:#526458}.stats{display:flex;flex-wrap:wrap;gap:10px}.stat{background:#e8efe2;border-radius:10px;padding:12px;flex:1;min-width:120px}.stat strong{display:block;font-size:25px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #dbe2d8;white-space:nowrap}th{font-size:13px}#error{color:#a12620;font-weight:700;white-space:pre-wrap}.bar{height:9px;background:#e3e8df;border-radius:8px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:#418268}.warn{color:#a12620}footer{padding:14px 0;color:#526458}@media(max-width:650px){main{padding:12px}.layout{grid-template-columns:1fr}header{padding:18px}h1{font-size:30px}}@media print{header{background:white;color:black}.tag,.edit,.actions,footer{display:none}section{border:0}main{padding:0}}
</style><main><header><div class="tag">TABLETOP / PURCHASE PLANNER</div><h1>袖割 <small style="font-size:17px">SODEWARI</small></h1><p>余ったスリーブを使い切り、買い足す袋の組み合わせを最安に。</p></header><div class="layout"><section class="edit"><h2>01 / 必要なカード</h2><label for="needs">作品・セット名, 確認済み製品コード, 枚数, 予備枚数</label><textarea id="needs" spellcheck="false"></textarea><p class="small">1行1セット。上の行から手持ちを割り当てます。同じコードは同一製品のみ。カンマは区切り専用。</p></section><section class="edit"><h2>02 / 手持ちと販売袋</h2><label for="stock">製品コード, 手持ち枚数</label><textarea id="stock" spellcheck="false" style="height:80px"></textarea><label for="offers">製品コード, 袋名, 入数, 価格（円）</label><textarea id="offers" spellcheck="false"></textarea><p class="small">価格は税込など条件を揃える。例は架空。袋は在庫無制限と仮定。</p></section><section class="wide"><div class="actions"><button id="calc" class="primary">購入計画を計算</button><button id="demo">サンプルに戻す</button><button id="save">入力を保存</button><button id="csv" disabled>購入表CSV</button><button id="print">印刷</button></div><div id="error" role="alert"></div><div id="status" role="status" class="small"></div><h2>03 / 購入計画</h2><div id="result" aria-live="polite"></div></section></div><footer>端末内処理・通信なし。サイズの適合、送料、店舗在庫、割引は判定しません。製品コードは自分で実物適合を確認して指定してください。</footer></main><script>
'use strict';
const demo={needs:'森の探検・基本,STD-A,83,5\n森の探検・拡張,STD-A,72,3\n交易カード,MINI-B,65,5',stock:'STD-A,38\nMINI-B,10',offers:'STD-A,50枚袋,50,330\nSTD-A,100枚袋,100,580\nSTD-A,200枚袋,200,1200\nMINI-B,40枚袋,40,250\nMINI-B,100枚袋,100,520'};
function rows(s,n){if(s.length>20000)throw Error('入力が長すぎます');let a=s.split(/\r?\n/).filter(x=>x.trim()).map((x,i)=>{let p=x.split(',').map(v=>v.trim());if(p.length!==n||p.some(v=>!v||v.length>100))throw Error(`${i+1}行目: ${n}項目を入力してください`);return p});if(a.length>60)throw Error('各欄60行まで');return a}
function num(s,min,max){if(!/^\d+$/.test(s)||+s<min||+s>max)throw Error(`整数 ${min}〜${max} を指定: ${s}`);return +s}
function best(need,offers){if(!need)return {cost:0,qty:0,packs:0,counts:offers.map(()=>0)};if(!offers.length)return null;const limit=need+Math.max(...offers.map(o=>o.qty))-1,dp=Array(limit+1).fill(null);dp[0]={cost:0,packs:0,prev:-1,idx:-1};for(let q=1;q<=limit;q++){for(let i=0;i<offers.length;i++){let o=offers[i],p=dp[q-o.qty];if(!p)continue;let c=p.cost+o.price,k=p.packs+1,v=dp[q];if(!v||c<v.cost||(c===v.cost&&k<v.packs))dp[q]={cost:c,packs:k,prev:q-o.qty,idx:i}}}let win=-1;for(let q=need;q<=limit;q++)if(dp[q]&&(win<0||dp[q].cost<dp[win].cost))win=q;let counts=offers.map(()=>0),q=win;while(q>0){let v=dp[q];counts[v.idx]++;q=v.prev}return {cost:dp[win].cost,qty:win,packs:dp[win].packs,counts}}
function plan(input){let groups=new Map;function get(code){if(!groups.has(code))groups.set(code,{code,stock:0,need:0,offers:[],lines:[]});return groups.get(code)}for(let [name,code,a,b] of rows(input.needs,4)){let g=get(code),n=num(a,1,5000)+num(b,0,5000);g.need+=n;if(g.need>10000)throw Error('製品ごとの必要枚数は10000まで');g.lines.push({name,n})}for(let [code,a] of rows(input.stock,2)){let g=get(code);g.stock+=num(a,0,10000)}for(let [code,name,a,b] of rows(input.offers,4)){get(code).offers.push({name,qty:num(a,1,2000),price:num(b,0,1000000)})}return [...groups.values()].map(g=>{let remaining=g.stock;for(let l of g.lines){l.fromStock=Math.min(remaining,l.n);remaining-=l.fromStock}let shortage=Math.max(0,g.need-g.stock);let buy=best(shortage,g.offers),single=shortage?(g.offers.length?Math.min(...g.offers.map(o=>Math.ceil(shortage/o.qty)*o.price)):null):0;return {...g,shortage,buy,single,left:buy?g.stock+buy.qty-g.need:null}})}
const $=id=>document.getElementById(id),keys=['needs','stock','offers'];let latest=null;function input(){return Object.fromEntries(keys.map(k=>[k,$(k).value]))}function fill(x){keys.forEach(k=>$(k).value=x[k]);run()}function el(tag,s,parent){let x=document.createElement(tag);if(s!==null)x.textContent=s;if(parent)parent.append(x);return x}function table(parent,heads,lines){let w=el('div',null,parent);w.className='scroll';let t=el('table',null,w),h=el('tr',null,el('thead',null,t));heads.forEach(s=>el('th',s,h));let b=el('tbody',null,t);for(let row of lines){let tr=el('tr',null,b);row.forEach(s=>el('td',String(s),tr))}return t}function yen(n){return n.toLocaleString('ja-JP')+' 円'}
function run(){let root=$('result');root.replaceChildren();$('error').textContent='';$('csv').disabled=true;latest=null;try{let a=plan(input());latest=a;let stats=el('div',null,root);stats.className='stats';for(let [label,value] of [['必要枚数',a.reduce((s,g)=>s+g.need,0)],['手持ち充当',a.reduce((s,g)=>s+g.need-g.shortage,0)],['購入費（計算可能分）',yen(a.reduce((s,g)=>s+(g.buy?.cost||0),0))],['単一袋種類より節約',yen(a.reduce((s,g)=>s+(g.buy?g.single-g.buy.cost:0),0))],['未解決製品',a.filter(g=>!g.buy).length]]){let d=el('div',label,stats);d.className='stat';el('strong',value,d)}table(root,['製品','必要','手持ち','不足','購入','購入後余り','費用','単一袋との差'],a.map(g=>[g.code,g.need,g.stock,g.shortage,g.buy?.qty??'未解決',g.left??'—',g.buy?yen(g.buy.cost):'—',g.buy?yen(g.single-g.buy.cost):'—']));el('h3','買い物リスト',root);table(root,['製品','袋','入数','袋数','小計'],a.flatMap(g=>g.buy?g.offers.flatMap((o,i)=>g.buy.counts[i]?[[g.code,o.name,o.qty,g.buy.counts[i],yen(o.price*g.buy.counts[i])]]:[]):[[g.code,'販売袋未登録','—','—','—']]));el('h3','セット別の手持ち充当',root);table(root,['セット','製品','必要','手持ち充当','買い足し分','充当率'],a.flatMap(g=>g.lines.map(l=>[l.name,g.code,l.n,l.fromStock,l.n-l.fromStock,Math.round(l.fromStock/l.n*100)+'%'])));$('csv').disabled=false;$('status').textContent='計算済み。価格→購入枚数→袋数の順で最小化。'}catch(e){$('error').textContent=e.message;$('status').textContent='入力を修正してください。'}}
function csvCell(v){let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}function exportCSV(){if(!latest)return;let data=[['製品','袋','入数','袋数','小計'],...latest.flatMap(g=>g.buy?g.offers.flatMap((o,i)=>g.buy.counts[i]?[[g.code,o.name,o.qty,g.buy.counts[i],o.price*g.buy.counts[i]]]:[]):[[g.code,'未解決','','','']])].map(r=>r.map(csvCell).join(',')).join('\r\n');let u=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='sodewari.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
if(typeof document!=='undefined'){for(let k of keys)$(k).addEventListener('input',()=>{latest=null;$('csv').disabled=true;$('result').replaceChildren();$('status').textContent='入力が変更されました。再計算してください。';$('error').textContent=''});$('calc').onclick=run;$('demo').onclick=()=>fill(demo);$('save').onclick=()=>{try{localStorage.setItem('sodewari-v1',JSON.stringify(input()));$('status').textContent='このブラウザに入力を保存しました。'}catch{$('status').textContent='端末保存が利用できません。'}};$('csv').onclick=exportCSV;$('print').onclick=()=>window.print();let initial=demo;try{let x=JSON.parse(localStorage.getItem('sodewari-v1'));if(x&&keys.every(k=>typeof x[k]==='string'))initial=x}catch{}fill(initial)}
if(typeof module!=='undefined')module.exports={best,plan,rows,num,csvCell,demo};
</script></html>
