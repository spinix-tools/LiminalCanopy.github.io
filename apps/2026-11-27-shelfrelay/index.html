<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShelfRelay — 配架修正ナビ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ec;color:#233c36;font:16px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px 16px 48px}header{padding:24px 0;border-bottom:1px solid #b8c6b9;margin-bottom:20px}h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:6px 0}h2{font-size:19px;margin:0 0 10px}p{margin:8px 0}small,.muted{color:#536a61}.grid,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel,.metric{background:white;border:1px solid #d3d9ce;border-radius:12px;padding:16px;min-width:0}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}.metric strong{display:block;font-size:28px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{border:1px solid #356554;background:#fff;color:#244d40;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}button.primary{background:#245b47;color:white}button:disabled{opacity:.45;cursor:default}textarea{width:100%;min-height:210px;resize:vertical;padding:12px;font:15px/1.5 ui-monospace,monospace;border:1px solid #abbdb0;border-radius:8px;background:#fafbf8;color:#233c36}label{display:block;font-weight:650;margin-bottom:6px}.shelf{display:flex;flex-wrap:wrap;gap:5px;border-bottom:5px solid #8d7354;padding:8px 0}.book{padding:9px 7px;border-radius:4px 4px 0 0;background:#d9e9df;border:1px solid #aac4b3;font:13px ui-monospace,monospace;overflow-wrap:anywhere;max-width:100%}.move{background:#f7d9a8;border-color:#d5aa67}.unknown{background:#eed3cf;border-color:#c89087}.error{color:#a13329}ol{padding-left:28px}li{padding:5px 0;overflow-wrap:anywhere}#status,#issues{overflow-wrap:anywhere}#issues p{margin:6px 0}section{margin-top:12px}button:focus-visible,textarea:focus-visible{outline:3px solid #b28038;outline-offset:2px}@media(max-width:620px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px}}@media print{.actions,.grid,header p{display:none}body{background:white}.panel{break-inside:avoid}}
</style>
<main><header><small>LIBRARY WORKFLOW / 01</small><h1>ShelfRelay <span style="font-size:.55em">配架修正ナビ</span></h1><p>現物を動かす前に、必要最小限の移動と確認事項を見つける。</p><small>ローカル処理・登録不要・個人情報を入力しないでください。</small></header>
<div class="grid"><div class="panel"><label for="target">01 正しい並び（台帳順）</label><p class="muted">1行に1冊の固有ID。ISBNではなく個体IDを使用。</p><textarea id="target" spellcheck="false"></textarea></div><div class="panel"><label for="actual">02 現物の並び（左から右）</label><p class="muted">手入力、貼り付け、Enterを送るバーコード機器で入力。</p><textarea id="actual" spellcheck="false"></textarea></div></div>
<div class="actions"><button id="run" class="primary">配架を検査</button><button id="sample">サンプル</button><button id="save" disabled>JSON保存</button><button id="print" disabled>印刷</button></div><p id="status" role="status" aria-live="polite"></p><div id="result"></div></main>
<script id="core">
function parse(s){if(s.length>500000)throw Error('入力が長すぎます');const a=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(a.length>5000||a.some(x=>x.length>120))throw Error('最大5,000行、IDは120文字まで');return a}
function duplicates(a){const seen=new Set(),dup=new Set();for(const x of a){if(seen.has(x))dup.add(x);seen.add(x)}return [...dup]}
function audit(target,actual){
 const dt=duplicates(target),da=duplicates(actual);if(dt.length||da.length)return {blocked:true,dt,da};
 const ranks=new Map(target.map((x,i)=>[x,i])),seen=new Set(actual),missing=target.filter(x=>!seen.has(x)),unknown=actual.filter(x=>!ranks.has(x));
 const present=actual.filter(x=>ranks.has(x)),goal=target.filter(x=>seen.has(x)),tails=[],prev=[];
 for(let i=0;i<present.length;i++){const r=ranks.get(present[i]);let l=0,h=tails.length;while(l<h){const m=(l+h)>>1;if(ranks.get(present[tails[m]])<r)l=m+1;else h=m}prev[i]=l?tails[l-1]:-1;tails[l]=i}
 const keep=new Set();for(let i=tails.length?tails[tails.length-1]:-1;i>=0;i=prev[i])keep.add(present[i]);
 const moves=[];for(let i=goal.length-1;i>=0;i--)if(!keep.has(goal[i]))moves.push({id:goal[i],before:goal[i+1]??null});
 return {blocked:false,missing,unknown,present,goal,keep:present.filter(x=>keep.has(x)),moves};
}
</script><script>
const $=id=>document.getElementById(id);let report=null;
function el(tag,value,cls){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;if(cls)e.className=cls;return e}
function reset(message='入力が変更されました。再検査してください。'){report=null;$('result').replaceChildren();$('save').disabled=$('print').disabled=true;$('status').textContent=message;$('status').className=''}
function section(title){const s=el('section',undefined,'panel');s.append(el('h2',title));$('result').append(s);return s}
function shelf(parent,ids,moved,unknown){const s=el('div',undefined,'shelf');for(const id of ids)s.append(el('span',id,'book'+(unknown.has(id)?' unknown':moved.has(id)?' move':'')));if(!ids.length)s.append(el('span','（なし）','muted'));parent.append(s)}
function run(){reset('');try{const target=parse($('target').value),actual=parse($('actual').value);if(!target.length)throw Error('台帳順を1件以上入力してください');const r=audit(target,actual);if(r.blocked){$('status').textContent='重複IDのため停止。台帳: '+(r.dt.join('、')||'なし')+' ／ 現物: '+(r.da.join('、')||'なし');$('status').className='error';return}report={target,actual,...r};$('save').disabled=$('print').disabled=false;$('status').textContent='検査完了。未確認・台帳外は現物を確認してから処理してください。';const m=el('div',undefined,'metrics');for(const [n,v] of [['確認済',r.present.length],['最少移動',r.moves.length],['未確認',r.missing.length],['台帳外',r.unknown.length]]){const c=el('div',undefined,'metric');c.append(el('small',n),el('strong',String(v)));m.append(c)}$('result').append(m);const a=section('03 現在の配架');shelf(a,actual,new Set(r.moves.map(x=>x.id)),new Set(r.unknown));a.append(el('p','緑＝残す / 黄＝移動 / 赤＝台帳外','muted'));const b=section('04 確認事項');b.id='issues';b.append(el('p','未確認（貸出中・未走査などを含む可能性）: '+(r.missing.join('、')||'なし')),el('p','台帳外（別の棚・読取誤りなどの可能性）: '+(r.unknown.join('、')||'なし')));const c=section('05 移動手順');c.append(el('p','台帳外の扱いを確認し、対象外の本を除いた状態で、上から順番に実施。未確認本の追加は含みません。','muted'));const list=el('ol');for(const x of r.moves)list.append(el('li',x.id+' を '+(x.before===null?'対象列の末尾へ':x.before+' の直前へ')+' 移動'));c.append(list);if(!r.moves.length)c.append(el('p','確認済の本の順序は正しいです。'));const d=section('06 修正後の対象列');shelf(d,r.goal,new Set(),new Set());d.append(el('p','1冊を任意の位置に移す操作を1回と数えるモデル。棚の容量・物理的な移動距離は対象外。','muted'))}catch(e){reset(e.message);$('status').className='error'}}
function sample(){$('target').value='B01\nB02\nB03\nB04\nB05\nB06\nB07\nB08';$('actual').value='B03\nB01\nB02\nX99\nB06\nB04\nB05\nB08';run()}
for(const id of ['target','actual'])$(id).addEventListener('input',()=>reset());$('run').onclick=run;$('sample').onclick=sample;$('print').onclick=()=>window.print();$('save').onclick=()=>{if(!report)return;const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='shelfrelay-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};sample();
</script></html>
