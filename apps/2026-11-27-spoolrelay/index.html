<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpoolRelay | フィラメント割付</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#203a32;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{padding:22px 0}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#52695f}section{background:#fff;border:1px solid #d5dfd8;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.grid section{margin:0}textarea,input,button{font:inherit}textarea{width:100%;height:155px;resize:vertical;border:1px solid #9eafa5;border-radius:8px;padding:10px;font:14px/1.6 monospace;white-space:pre}input{width:100px;padding:6px;border:1px solid #9eafa5;border-radius:6px}label{display:block;margin:6px 0}button{background:#215e4b;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e1eae4;color:#214d3e}button:disabled{opacity:.45;cursor:default}.stats{display:flex;flex-wrap:wrap;gap:14px}.stat{flex:1;min-width:130px;padding:14px;background:#eaf2ed;border-radius:10px}.stat strong{display:block;font-size:30px}.bar{height:16px;background:#e0e8e2;border-radius:9px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#287c61}.spool{border-bottom:1px solid #d5dfd8;padding:12px 0;overflow-wrap:anywhere}.spool:last-child{border:0}.warn{color:#9a3c25}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:13px;color:#52695f}@media print{body{background:white}header,.inputs,.actions,footer{display:none}main{padding:0}section{break-inside:avoid}}
</style>
<main><header><small>WORKSHOP TOOL / 01 · OFFLINE</small><h1>SpoolRelay</h1><p>端材スプールから、造形ジョブをまとめて割り付ける。</p></header>
<div class="grid inputs"><section><h2>01 / スプールの計量</h2><label for="spools">ID / 適合キー / 総重量g / 空重量g / 誤差g</label><small>タブ区切り。適合キーは素材・色・径などを同じ名前で指定。最大8本。</small><textarea id="spools" spellcheck="false"></textarea></section><section><h2>02 / 造形ジョブ</h2><label for="jobs">ID / 適合キー / 必要g / 優先度(1〜9)</label><small>タブ区切り。最大12件。必要量にサポートやパージを含める。</small><textarea id="jobs" spellcheck="false"></textarea></section></div>
<section class="inputs"><h2>03 / 余裕設定</h2><label>スプールごとに残す量 g <input id="reserve" type="number" min="0" max="10000" step="1" value="5"></label><label>ジョブ必要量の上乗せ % <input id="margin" type="number" min="0" max="100" step="1" value="0"></label><small>使用可能量 = 総重量 − 空重量 − 誤差 − 残す量。負なら0。必要量は上乗せ後に整数gへ切り上げ。</small><div><button id="run">割付を計算</button><button id="sample" class="secondary">サンプルに戻す</button></div></section>
<section aria-live="polite"><h2>04 / 計画結果</h2><p id="status" role="status"></p><div id="results"></div><div class="actions"><button id="download" disabled>JSON保存</button><button id="print" class="secondary" disabled>印刷</button></div></section><footer>計画支援のみ。実測誤差、材料の状態、機器適合、実際の消費量は別途確認してください。データ送信・永続保存なし。</footer></main>
<script>
// CORE START
function integer(x,min,max){if(!/^\d+$/.test(String(x).trim()))throw Error('整数を入力してください: '+x);const n=Number(x);if(!Number.isSafeInteger(n)||n<min||n>max)throw Error('数値範囲外: '+x);return n}
function parse(text,cols,limit){const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t').map(s=>s.trim()));if(!rows.length||rows.length>limit||rows.some(r=>r.length!==cols||r.some(v=>!v||v.length>100)))throw Error('列数・行数・空欄を確認してください');if(new Set(rows.map(r=>r[0])).size!==rows.length)throw Error('IDが重複しています');return rows}
function prepare(s,j,r,m){r=integer(r,0,10000);m=integer(m,0,100);return {spools:parse(s,5,8).map(([id,key,g,t,e])=>{g=integer(g,0,100000);t=integer(t,0,g);e=integer(e,0,10000);return {id,key,g,t,e,cap:Math.max(0,g-t-e-r)}}),jobs:parse(j,4,12).map(([id,key,g,p])=>{g=integer(g,1,100000);return {id,key,g,p:integer(p,1,9),need:Math.ceil(g*(100+m)/100)}}),reserve:r,margin:m}}
function solve(spools,jobs){const N=1<<jobs.length,full=N-1,weight=new Int32Array(N),priority=new Int32Array(N),count=new Int8Array(N);for(let a=1;a<N;a++){const bit=a&-a,i=31-Math.clz32(bit),b=a^bit;weight[a]=weight[b]+jobs[i].need;priority[a]=priority[b]+jobs[i].p;count[a]=count[b]+1}let dp=new Int8Array(N).fill(99);dp[0]=0;const history=[];for(const s of spools){let allowed=0;jobs.forEach((j,i)=>{if(j.key===s.key)allowed|=1<<i});const next=dp.slice(),pick=new Int32Array(N).fill(-1);for(let a=0;a<N;a++)if(dp[a]!==99){const rest=allowed&(full^a);for(let b=rest;b;b=(b-1)&rest)if(weight[b]<=s.cap&&dp[a]+1<next[a|b]){next[a|b]=dp[a]+1;pick[a|b]=b}}history.push(pick);dp=next}let best=0;for(let a=1;a<N;a++)if(dp[a]!==99&&(count[a]>count[best]||count[a]===count[best]&&(priority[a]>priority[best]||priority[a]===priority[best]&&dp[a]<dp[best])))best=a;let a=best;const allocation=spools.map(()=>[]);for(let i=spools.length-1;i>=0;i--){const b=history[i][a];if(b>0){allocation[i]=jobs.map((_,k)=>k).filter(k=>b&(1<<k));a^=b}}return {allocation,unassigned:jobs.map((_,i)=>i).filter(i=>!(best&(1<<i))),count:count[best],priority:priority[best],used:dp[best]}}
function greedy(spools,jobs){const remaining=spools.map(s=>s.cap);let count=0;for(const j of jobs){const i=spools.findIndex((s,k)=>s.key===j.key&&remaining[k]>=j.need);if(i>=0){remaining[i]-=j.need;count++}}return count}
// CORE END
const $=id=>document.getElementById(id);let report=null;function add(parent,tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}
function invalidate(){report=null;$('results').replaceChildren();$('status').textContent='入力が変更されました。再計算してください。';$('download').disabled=$('print').disabled=true}
function calculate(){invalidate();try{const data=prepare($('spools').value,$('jobs').value,$('reserve').value,$('margin').value),plan=solve(data.spools,data.jobs),baseline=greedy(data.spools,data.jobs);report={...data,plan,baseline};const root=$('results'),stats=add(root,'div','','stats');for(const [label,value] of [['割付可能',plan.count+' / '+data.jobs.length],['入力順の単純割付',baseline+' / '+data.jobs.length],['使用スプール',plan.used+' 本']]){const box=add(stats,'div','','stat');add(box,'small',label);add(box,'strong',value)}data.spools.forEach((s,i)=>{const list=plan.allocation[i].map(k=>data.jobs[k]),used=list.reduce((a,j)=>a+j.need,0),box=add(root,'div','','spool');add(box,'h2',s.id+' / '+s.key);add(box,'p',used+' / '+s.cap+' g 使用予定 · 余裕 '+(s.cap-used)+' g');const bar=add(box,'div','','bar'),fill=add(bar,'div','','fill');fill.style.width=(s.cap?100*used/s.cap:0)+'%';add(box,'p',list.map(j=>j.id+' ('+j.need+' g)').join(' → ')||'使用しない')});add(root,'h2','未割付ジョブ');for(const i of plan.unassigned){const j=data.jobs[i],fits=data.spools.some(s=>s.key===j.key&&s.cap>=j.need);add(root,'p',j.id+' / '+j.need+' g：'+(fits?'他ジョブとの容量競合':'単独で収まる適合スプールなし'),'warn')}if(!plan.unassigned.length)add(root,'p','すべて割付済み');$('status').textContent='計算完了。件数 → 優先度合計 → 使用本数の順で厳密最適化。';$('download').disabled=$('print').disabled=false}catch(e){$('status').textContent='入力エラー：'+e.message}}
function sample(){$('spools').value='S1\tPLA-black\t308\t200\t3\nS2\tPLA-black\t268\t200\t3\nS3\tPETG-white\t288\t200\t3';$('jobs').value='J1\tPLA-black\t60\t5\nJ2\tPLA-black\t100\t5\nJ3\tPETG-white\t40\t2\nJ4\tPETG-white\t45\t9';$('reserve').value=5;$('margin').value=0;calculate()}
for(const id of ['spools','jobs','reserve','margin'])$(id).addEventListener('input',invalidate);$('run').onclick=calculate;$('sample').onclick=sample;$('print').onclick=()=>window.print();$('download').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='spoolrelay-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};sample();
</script></html>
