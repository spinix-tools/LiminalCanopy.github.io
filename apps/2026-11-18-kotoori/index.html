<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こと折 / KOTOORI — 1枚の紙から8ページ</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#25352f;font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f5f3ef}header{background:#223e37;color:#fff;padding:16px 3%;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:25px}header small{font-size:11px}button,label,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #c9cbc3;border-radius:9px;padding:8px 12px}button:hover{background:#fff0dc}.accent{background:#e9ae63;font-weight:bold;border-color:#e9ae63}.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 285px;min-height:85vh}aside{padding:16px;background:white}.left{border-right:1px solid #dfded6}.right{border-left:1px solid #dfded6}main{min-width:0;padding:20px}h2{font-size:13px;color:#597168}p{line-height:1.7}nav{display:grid;gap:7px}.item{display:block;width:100%;text-align:left;font-size:12px}.item.active{background:#ffdfac;border-color:#b47930}.sheetwrap{background:#e8e6de;overflow:auto;padding:18px;border-radius:12px}.sheet{width:100%;aspect-ratio:297/210;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);box-shadow:0 5px 30px #5554;background:white;--size:15}.panel{position:relative;min-width:0;min-height:0;background:var(--bg);outline:1px dashed #aaa;overflow:hidden;cursor:pointer}.panel.selected{outline:2px solid #ad722e;outline-offset:-2px}.rot{position:absolute;inset:0}.panel.upper .rot{transform:rotate(180deg)}.content{position:absolute;inset:6% 9%;overflow:hidden;writing-mode:var(--mode);color:#25332e}.content b{display:block;margin:0 0 .8em;font-family:serif;font-size:calc(var(--size) * 1px * 1.1);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.content p{font:calc(var(--size) * 1px)/1.6 serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.sheet .cut{position:absolute;top:50%;left:25%;width:50%;border-top:2px dashed #b16c5b;pointer-events:none}.sheet{position:relative}.noguides .panel{outline:0}.noguides .cut{display:none}.formfield{margin:0 0 16px}.formfield label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}input[type=text],select,textarea{width:100%;padding:9px;border:1px solid #d1d4ce;border-radius:8px}textarea{resize:vertical;line-height:1.6}#body{min-height:215px}input[type=range]{width:100%}#message{color:#47635a;font-size:12px;min-height:20px}.help{font-size:12px;background:#f1f2ec;padding:12px;border-radius:8px;margin-top:16px;line-height:1.7}.reading{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.reading .panel{aspect-ratio:74.25/105}.reading .panel .content b{font-size:12px}.reading .panel .content p{font-size:11px}.hidden{display:none!important}
@media(max-width:1050px){.layout{grid-template-columns:155px minmax(0,1fr) 245px}.sheet{min-width:450px}}@media(max-width:750px){.layout{display:flex;flex-direction:column}main{order:1}.left{order:2}.right{order:3}.sheet{min-width:500px}nav{grid-template-columns:repeat(2,1fr)}.reading{grid-template-columns:repeat(2,1fr)}}
@page{size:A4 landscape;margin:0}
@media print{html,body,.layout,main,.sheetwrap{width:297mm!important;height:210mm!important;min-height:0!important;padding:0!important;margin:0!important;overflow:visible!important;background:white!important}header,aside,h1,.controls,.help,#message,.reading{display:none!important}.layout{display:block!important}main,.sheetwrap{border:0!important}.sheet{width:297mm!important;height:210mm!important;min-width:0!important;box-shadow:none!important;aspect-ratio:auto!important;display:grid!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.panel.selected{outline:1px dashed #aaa;outline-offset:0}}
</style>
<header><div><h1>こと折 <small>KOTOORI / one-sheet zine</small></h1></div><div><button id="save">↓ JSON保存</button> <button id="load">📂 読込</button> <button class="accent" id="print">🖨 A4印刷</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<div class="layout"><aside class="left"><h2>01 / ページ</h2><nav id="pages"></nav><div class="help">A4用紙1枚を8ページに折る小さな冊子。読み順で編集したら、面付けを確認して横向き・片面・倍率100%で印刷してください。<p>印刷した中央横線の内側2コマ分だけを切って折ります。</p>内容は端末の中だけで処理します。</div></aside><main><div class="controls"><h1>1枚から、8ページの物語。</h1><p>縦書きの短文・詩・日記を、手のひらサイズの折本に。</p><button id="sheetBtn">✂ 面付けを見る</button> <button id="readBtn">📖 読み順を見る</button></div><div class="sheetwrap"><div id="sheet" class="sheet"></div></div><div id="reader" class="reading hidden"></div><p id="message"></p></main><aside class="right"><h2>02 / ページを編集</h2><h3 id="chosen">1 / 表紙</h3><div class="formfield"><label for="title">見出し</label><textarea id="title" rows="2" maxlength="200"></textarea></div><div class="formfield"><label for="body">本文</label><textarea id="body" maxlength="3200"></textarea></div><h2>03 / 印刷設定</h2><div class="formfield"><label for="mode">組み方向</label><select id="mode"><option value="vertical-rl">日本語・縦書き</option><option value="horizontal-tb">横書き</option></select></div><div class="formfield"><label for="color">紙色</label><select id="color"><option value="#f2ece3">生成り</option><option value="#e0ebee">淡青</option><option value="#efe6e3">薄紅</option><option value="#e6e8da">若草</option></select></div><div class="formfield"><label for="size">文字サイズ <span id="sizeLabel">15</span>px</label><input id="size" type="range" min="11" max="23" value="15"></div><label><input id="guides" type="checkbox" checked> ガイド表示</label><div class="help">入力は自動保存されます。別端末への持ち運びにはJSONを利用してください。写真・文字あふれ検査は同梱フル版をご利用ください。</div></aside></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),N=['表紙','2','3','4','5','6','7','裏表紙'],order=[7,6,5,4,8,1,2,3],key='kotoori-lite-v1';
const defaults=[['小さな旅の記録','一枚の紙から\n八つのページへ。'],['01 はじまり','路地の角で、小さな地図を拾った。'],['02 まがり角','右へ曲がると花屋があった。'],['03 寄り道','知らない道を歩いてみよう。'],['04 ひと休み','コーヒーを一杯。時計は見ない。'],['05 帰り道','遠くへ行かなくても、発見はある。'],['06 あとがき','今日の発見を一行だけ。'],['おしまい','こと折 / KOTOORI']];
const fresh=()=>({pages:defaults.map(x=>({title:x[0],body:x[1]})),mode:'vertical-rl',color:'#f2ece3',size:15,guides:true});
function valid(x){if(!x||!Array.isArray(x.pages)||x.pages.length!==8)throw Error('8ページが必要です');return{pages:x.pages.map(p=>({title:String(p.title||'').slice(0,200),body:String(p.body||'').slice(0,3200)})),mode:x.mode==='horizontal-tb'?'horizontal-tb':'vertical-rl',color:['#f2ece3','#e0ebee','#efe6e3','#e6e8da'].includes(x.color)?x.color:'#f2ece3',size:Math.max(11,Math.min(23,Number(x.size)||15)),guides:x.guides!==false};}
let book;try{book=valid(JSON.parse(localStorage.getItem(key)))}catch(e){book=fresh()}let chosen=0,reader=false;
const save=()=>{try{localStorage.setItem(key,JSON.stringify(book));$('message').textContent='✓ 自動保存しました'}catch(e){$('message').textContent='保存不可。JSON保存をご利用ください'}};
const el=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function panel(i,top){const item=el('div','panel'+(top?' upper':'')+(i===chosen?' selected':''));item.dataset.page=i+1;item.style.setProperty('--bg',book.color);item.style.setProperty('--mode',book.mode);const rot=el('div','rot'),c=el('div','content');c.append(el('b','',book.pages[i].title),el('p','',book.pages[i].body));rot.append(c);item.append(rot);item.addEventListener('click',()=>select(i));return item}
function draw(){const sh=$('sheet');sh.replaceChildren();sh.style.setProperty('--size',book.size);sh.classList.toggle('noguides',!book.guides);order.forEach((n,j)=>sh.append(panel(n-1,j<4)));sh.append(el('div','cut'));const r=$('reader');r.replaceChildren();r.style.setProperty('--size',book.size);for(let i=0;i<8;i++)r.append(panel(i,false));sh.parentElement.classList.toggle('hidden',reader);r.classList.toggle('hidden',!reader);const n=$('pages');n.replaceChildren();book.pages.forEach((p,i)=>{let b=el('button','item'+(i===chosen?' active':''),String(i+1).padStart(2,'0')+' / '+N[i]+' · '+(p.title||'未入力'));b.onclick=()=>select(i);n.append(b)})}
function select(i){chosen=i;$('chosen').textContent=(i+1)+' / '+N[i];$('title').value=book.pages[i].title;$('body').value=book.pages[i].body;draw()}
$('title').addEventListener('input',()=>{book.pages[chosen].title=$('title').value;save();draw()});$('body').addEventListener('input',()=>{book.pages[chosen].body=$('body').value;save();draw()});
$('mode').onchange=()=>{book.mode=$('mode').value;save();draw()};$('color').onchange=()=>{book.color=$('color').value;save();draw()};$('size').oninput=()=>{book.size=+$('size').value;$('sizeLabel').textContent=book.size;save();draw()};$('guides').onchange=()=>{book.guides=$('guides').checked;save();draw()};
$('sheetBtn').onclick=()=>{reader=false;draw()};$('readBtn').onclick=()=>{reader=true;draw()};$('print').onclick=()=>{reader=false;draw();window.print()};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify(book,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='kotoori-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>200000)throw Error('JSONが大きすぎます');book=valid(JSON.parse(await f.text()));$('mode').value=book.mode;$('color').value=book.color;$('size').value=book.size;$('sizeLabel').textContent=book.size;$('guides').checked=book.guides;chosen=0;select(0);save()}catch(err){$('message').textContent='読込失敗: '+err.message}e.target.value=''};
$('mode').value=book.mode;$('color').value=book.color;$('size').value=book.size;$('sizeLabel').textContent=book.size;$('guides').checked=book.guides;select(0);
})();
</script></html>
