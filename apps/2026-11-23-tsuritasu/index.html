<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釣足 TSURITASU</title><style>body{margin:0;background:#102c32;color:#d6e9df;font:16px/1.8 system-ui,sans-serif}main{max-width:720px;margin:10vh auto;padding:24px}strong{color:#b4ebd0}a{color:#adf1dd}</style></head><body><main id="note"><h1>釣足 / TSURITASU</h1><p>お釣り準備の試算室をローカルで展開しています。</p><p id="status">読み込み中…</p></main><script src="payload.js"></script><script>
(async()=>{try{if(!window.DecompressionStream)throw new Error('このブラウザはgzip展開に未対応です。unpack.pyでHTMLを復元してください。');const b=atob(window.TSURITASU_GZIP_B64);const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));const decoded=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(decoded).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='起動エラー: '+e.message;}})();
</script></body></html>
