<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DotFit | 点字ラベル寸法検査</title>
<style>
:root{color-scheme:light;--ink:#173a39;--muted:#506866;--line:#d4e1dc;--green:#146b59;--paper:#f5f7f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{padding:18px 0 24px;border-bottom:1px solid var(--line)}h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.05em;margin:0;line-height:1.2}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-size:14px;font-weight:650}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #91a7a0;border-radius:8px;padding:8px;color:var(--ink);background:white}textarea{resize:vertical;min-height:100px}button{border:1px solid var(--green);border-radius:9px;padding:9px 14px;background:var(--green);color:white;cursor:pointer;font-weight:700}button.secondary{background:white;color:var(--green)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #c47b20;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.small{font-size:13px;color:var(--muted)}.result{border-top:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}.result h3{margin:0;font-size:18px}.ok{color:#146b59}.bad{color:#9a3426}.metric{font-size:28px;font-weight:800}.drawing{display:block;width:100%;max-height:220px;margin:10px 0;background:#f5f7f2;border-radius:8px}.mono{font-family:monospace;white-space:pre-wrap}.notice{border-left:3px solid #b67d33;padding-left:12px}.result ul{padding-left:20px}footer{margin:18px 0;color:var(--muted);font-size:13px}@media(max-width:720px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:14px}}
</style><main><header><div class="eyebrow">DOTFIT / LABEL PREFLIGHT</div><h1>点字ラベル寸法検査</h1><p>点訳済みの6点点字を縮小せず、手元のラベル規格に割り付ける。</p><p class="small notice">寸法の試算専用。点訳・触読性・規格適合・製造品質を保証しません。入力例は架空の点配列です。</p></header>
<div class="layout"><section class="panel"><h2>01 入力条件</h2><label for="labels">点字（1行につき1ラベル、空白で分割可能）</label><textarea id="labels" spellcheck="false">⠁⠃⠉⠙ ⠑⠋⠛⠓
⠁⠃⠉⠙⠑⠋⠛⠓⠊⠚
⠁⠃⠉ ⠙⠑⠋ ⠛⠓⠊</textarea><p class="small">Unicode 6点点字のみ。ASCII空白・点字空白を語群の区切りとし、群内の分割はしません。</p><label for="stock">候補ラベルの幅 × 高さ (mm)、1行1種類</label><textarea id="stock" spellcheck="false">35 x 15
40 x 25
60 x 15
70 x 25</textarea><h2>02 寸法設定 (mm)</h2><div class="fields"><label>点の直径<input id="d" type="number" value="1.5" step="0.1" min="0.1" max="20"></label><label>セル内横間隔<input id="dx" type="number" value="2.5" step="0.1" min="0.1" max="30"></label><label>セル内縦間隔<input id="dy" type="number" value="2.5" step="0.1" min="0.1" max="30"></label><label>セル送り<input id="pitch" type="number" value="6" step="0.1" min="0.1" max="100"></label><label>行送り<input id="line" type="number" value="10" step="0.1" min="0.1" max="100"></label><label>四辺の余白<input id="margin" type="number" value="3" step="0.1" min="0" max="100"></label></div><p class="small">初期値は計算例であり、規格の推奨値ではありません。</p><div class="actions"><button id="run">寸法を検査</button><button id="reset" class="secondary">例に戻す</button></div></section>
<section class="panel"><h2>03 検査結果</h2><div id="status" role="status" aria-live="polite"></div><div id="out"></div><button id="save" class="secondary" disabled>JSON報告書を保存</button></section></div><footer>ブラウザ内で処理。外部通信・登録・永続保存なし。印刷縮尺や点の高さは検査対象外。</footer></main>
<script id="core">
const DotFit=(()=>{
const EPS=1e-8;
function parseLabels(text){const a=text.split(/\r?\n/).map(s=>s.replace(/[ \t\u2800]+/g,' ').trim()).filter(Boolean);if(!a.length||a.length>60)throw Error('ラベルは1〜60件');return a.map((s,i)=>{if(!/^[\u2801-\u283f]+(?: [\u2801-\u283f]+)*$/u.test(s)||s.length>300)throw Error(`ラベル ${i+1}: 6点点字と空白のみ、300セル以内`);return s.split(' ')});}
function parseStock(text){const a=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!a.length||a.length>30)throw Error('候補寸法は1〜30件');return a.map((s,i)=>{const m=s.match(/^(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)$/);if(!m||m.slice(1).some(x=>+x<=0||+x>1000))throw Error(`候補 ${i+1}: 幅 x 高さ、0超〜1000mm`);return {w:+m[1],h:+m[2]};});}
function geometry(g){if(!['d','dx','dy','pitch','line','margin'].every(k=>Number.isFinite(g[k])&&g[k]>=0&&g[k]<=100)||g.d<=0||g.dx<g.d||g.dy<g.d||g.pitch<g.dx+g.d-EPS||g.line<2*g.dy+g.d-EPS)throw Error('寸法が不正です。点・セル・行の外接範囲が重ならない値を指定してください。');return {cw:g.dx+g.d,ch:2*g.dy+g.d};}
function wrap(words,cap){const n=words.length,dp=Array(n+1).fill(null);dp[n]={lines:[],cost:0};for(let i=n-1;i>=0;i--){let len=0;for(let j=i;j<n;j++){len+=words[j].length+(j>i?1:0);if(len>cap)break;if(!dp[j+1])continue;const p={lines:[words.slice(i,j+1).join(' '),...dp[j+1].lines],cost:(cap-len)**2+dp[j+1].cost};if(!dp[i]||p.lines.length<dp[i].lines.length||p.lines.length===dp[i].lines.length&&p.cost<dp[i].cost)dp[i]=p;}}return dp[0];}
function plan(words,stocks,g){const {cw,ch}=geometry(g);const options=stocks.map(({w,h},i)=>{const cap=Math.max(0,Math.floor((w-2*g.margin-cw+EPS)/g.pitch)+1),rows=Math.max(0,Math.floor((h-2*g.margin-ch+EPS)/g.line)+1);const p=wrap(words,cap);return {i,w,h,cap,rows,lines:p?.lines??null,fit:!!p&&p.lines.length<=rows};});const best=options.filter(o=>o.fit).sort((a,b)=>a.w*a.h-b.w*b.h||a.lines.length-b.lines.length||a.w-b.w||a.i-b.i)[0]??null;return {best,options,minWidth:2*g.margin+cw+(Math.max(...words.map(w=>w.length))-1)*g.pitch,minHeight:2*g.margin+ch};}
function dots(lines,g){const a=[];lines.forEach((s,r)=>Array.from(s).forEach((c,j)=>{if(c===' ')return;const bits=c.codePointAt(0)-0x2800;for(let k=0;k<6;k++)if(bits&(1<<k))a.push({x:g.margin+g.d/2+j*g.pitch+(k>=3?g.dx:0),y:g.margin+g.d/2+r*g.line+(k%3)*g.dy});}));return a;}
return {parseLabels,parseStock,geometry,wrap,plan,dots};})();
if(typeof module!=='undefined')module.exports=DotFit;
</script><script>
const $=id=>document.getElementById(id),keys=['d','dx','dy','pitch','line','margin'],ids=['labels','stock',...keys],initial=Object.fromEntries(ids.map(k=>[k,$(k).value]));let report=null;
function add(parent,tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e;}
function draw(parent,b,g){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${b.w} ${b.h}`);svg.setAttribute('class','drawing');svg.setAttribute('role','img');svg.setAttribute('aria-label',`幅 ${b.w}mm 高さ ${b.h}mm の点配列見本`);function shape(tag,attrs){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));svg.append(e);}shape('rect',{x:0,y:0,width:b.w,height:b.h,fill:'#edf2e7',stroke:'#729185','stroke-width':.3});for(const p of DotFit.dots(b.lines,g))shape('circle',{cx:p.x,cy:p.y,r:g.d/2,fill:'#146b59'});parent.append(svg);}
function clear(){report=null;$('out').replaceChildren();$('save').disabled=true;}
function run(){clear();try{const g=Object.fromEntries(keys.map(k=>[k,$(k).value.trim()===''?NaN:Number($(k).value)]));DotFit.geometry(g);const stocks=DotFit.parseStock($('stock').value),labels=DotFit.parseLabels($('labels').value),results=labels.map(words=>DotFit.plan(words,stocks,g));report={geometry:g,stocks,results};$('status').textContent=`${results.filter(r=>r.best).length} / ${results.length} 件が候補寸法に収まります。`;results.forEach((r,i)=>{const el=add($('out'),'article','','result');add(el,'h3',`ラベル ${i+1} — ${r.best?'適合候補あり':'候補なし'}`,r.best?'ok':'bad');if(r.best){const b=r.best;add(el,'div',`${b.w} × ${b.h} mm`,'metric');add(el,'p',`${b.lines.length}行 / ${b.cap}セル毎行まで / 面積 ${b.w*b.h} mm²`);draw(el,b,g);add(el,'p',b.lines.join('\n'),'mono');}else add(el,'p',`分割不可の最長群に必要な幅は ${r.minWidth.toFixed(2)} mm 以上。1行の高さは ${r.minHeight.toFixed(2)} mm 以上。`);const ul=add(el,'ul','','small');r.options.forEach(o=>add(ul,'li',`${o.w} × ${o.h} mm：${o.fit?'収まる':o.lines?`必要 ${o.lines.length} 行 / 最大 ${o.rows} 行`:'幅不足（群を分割しない条件）'}`));});$('save').disabled=false;}catch(e){$('status').textContent=e.message;}}
$('run').onclick=run;$('reset').onclick=()=>{ids.forEach(k=>$(k).value=initial[k]);run();};ids.forEach(k=>$(k).addEventListener('input',()=>{clear();$('status').textContent='入力を変更しました。再検査してください。';}));$('save').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='dotfit-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};run();
</script></html>
