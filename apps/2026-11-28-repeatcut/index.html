<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>RepeatCut | 柄合わせ裁断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243b35;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}header{border-bottom:1px solid #c7d0c6;margin-bottom:20px}h1{font-size:clamp(32px,6vw,56px);line-height:1;margin:14px 0}h2{font-size:20px;margin:0 0 12px}small,.muted{color:#52665d}.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}section{background:white;border:1px solid #d7ddd4;border-radius:16px;padding:20px;min-width:0}label{display:block;font-weight:600;margin:10px 0}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #aebdb3;border-radius:8px;padding:8px;background:#fafbf9;color:inherit}textarea{min-height:150px;resize:vertical;font-family:monospace}button{border:1px solid #286b56;border-radius:8px;padding:9px 14px;background:#286b56;color:white;cursor:pointer;margin:6px 5px 6px 0}button.alt{background:white;color:#286b56}button:disabled{opacity:.45;cursor:default}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.metric{background:#eff4ee;border-radius:10px;padding:12px}.metric b{display:block;font-size:26px;line-height:1.3}.bar{display:flex;height:42px;border-radius:7px;overflow:hidden;background:#e1e6df;margin:8px 0 16px}.bar span{display:grid;place-items:center;overflow:hidden;white-space:nowrap;font-size:12px}.cut{background:#347963;color:white}.gap{background:#dfad64}.tail{background:#e1e6df}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 5px;border-bottom:1px solid #e0e5df;text-align:left;overflow-wrap:anywhere}#error{color:#a12d20;font-weight:600}#status{overflow-wrap:anywhere}.scroll{overflow-x:auto}footer{margin-top:18px;font-size:13px}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr}section{padding:15px}}
</style><main><header><small>OFFCUT LAB / 01 · OFFLINE</small><h1>RepeatCut</h1><p>柄を合わせながら、手持ちの壁紙から何枚切れるか。施工順を変えず、裁断順だけを最適化します。</p></header><div class="layout"><section><h2>01 / 裁断条件</h2><label>手持ちの長さ (mm)<input id="length" type="number" min="1" max="1000000" value="10800"></label><label>縦リピート (mm)<input id="repeat" type="number" min="1" max="100000" value="600"></label><label>ロール先端の柄位置 (mm)<input id="phase" type="number" min="0" value="0"></label><label>必要片：ID、裁断長、開始柄位置 (TSV)<textarea id="pieces" spellcheck="false">A	2500	0
B	2500	0
C	2500	300
D	2500	300</textarea></label><small>1行1枚・最大14枚。長さに上下の切りしろを含め、開始柄位置は切りしろ込みの切断開始点を指定。全て同幅・同方向、同品番・同ロットを想定します。</small><div><button id="run">裁断計画を計算</button><button class="alt" id="reset">サンプル</button></div><p id="error" role="alert"></p></section><section><h2>02 / 裁断計画</h2><p id="status" aria-live="polite">条件を入力してください。</p><div id="result"></div><button class="alt" id="export" disabled>JSONを保存</button></section></div><footer>柄位置は共通の目印から進行方向に測った距離をリピートで割った余り。横柄、反転、欠陥、刃幅、施工中の伸縮は対象外。実際に切る前に現物で柄と寸法を再確認してください。</footer></main>
<script id="core">
const mod=(x,r)=>((x%r)+r)%r;
function validate(L,R,P,items){if(!Number.isSafeInteger(L)||L<1||L>1000000||!Number.isSafeInteger(R)||R<1||R>100000||!Number.isSafeInteger(P)||P<0||P>=R)throw Error('長さ・リピート・先端柄位置を整数の範囲内で入力してください。');if(!Array.isArray(items)||items.length<1||items.length>14)throw Error('必要片は1〜14枚です。');const ids=new Set();for(const x of items){if(typeof x.id!=='string'||!x.id||x.id.length>60||ids.has(x.id)||!Number.isSafeInteger(x.len)||x.len<1||x.len>1000000||!Number.isSafeInteger(x.phase)||x.phase<0||x.phase>=R)throw Error('ID重複または裁断長・柄位置が不正です。');ids.add(x.id)}}
function solve(L,R,P,items){validate(L,R,P,items);const n=items.length,N=1<<n,dp=new Float64Array(N*n).fill(Infinity),prev=new Int8Array(N*n).fill(-1),sum=new Int32Array(N),count=new Uint8Array(N);let bm=0,bj=-1,be=0;for(let i=0;i<n;i++){const e=mod(items[i].phase-P,R)+items[i].len;if(e<=L)dp[(1<<i)*n+i]=e}for(let m=1;m<N;m++){const bit=m&-m,k=31-Math.clz32(bit);sum[m]=sum[m^bit]+items[k].len;count[m]=count[m^bit]+1;for(let j=0;j<n;j++){const e=dp[m*n+j];if(!Number.isFinite(e))continue;if(count[m]>count[bm]||(count[m]===count[bm]&&(sum[m]>sum[bm]||(sum[m]===sum[bm]&&e<be)))){bm=m;bj=j;be=e}for(let k=0;k<n;k++)if(!(m&(1<<k))){const end=e+mod(items[k].phase-mod(P+e,R),R)+items[k].len,ix=(m|(1<<k))*n+k;if(end<=L&&end<dp[ix]){dp[ix]=end;prev[ix]=j}}}}const order=[];for(let m=bm,j=bj;j>=0;){order.push(j);const p=prev[m*n+j];m^=1<<j;j=p}order.reverse();return {optimal:layout(L,R,P,items,order),baseline:layout(L,R,P,items,items.map((_,i)=>i))}}
function layout(L,R,P,items,order){let end=0;const cuts=[];for(const i of order){const x=items[i],gap=mod(x.phase-mod(P+end,R),R),start=end+gap;if(start+x.len>L)continue;end=start+x.len;cuts.push({...x,gap,start,end})}const used=cuts.reduce((s,x)=>s+x.len,0);return {cuts,used,waste:end-used,remaining:L-end,end,nextPhase:mod(P+end,R),missing:items.filter(x=>!cuts.some(c=>c.id===x.id)).map(x=>x.id)}}
</script><script>
const $=id=>document.getElementById(id);let report=null;const defaults=['10800','600','0','A\t2500\t0\nB\t2500\t0\nC\t2500\t300\nD\t2500\t300'];const fields=['length','repeat','phase','pieces'];function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function clear(){report=null;$('result').replaceChildren();$('export').disabled=true;$('error').textContent='';$('status').textContent='条件が変更されました。再計算してください。'}function readInt(s){if(!/^\d+$/.test(s.trim()))throw Error('数値は非負の整数で入力してください。');return Number(s)}function bar(parent,r,L){const b=element('div',undefined,'bar');function part(v,t,c){if(!v)return;const x=element('span',t,c);x.style.width=(100*v/L)+'%';x.title=t+' '+v+' mm';b.append(x)}for(const x of r.cuts){part(x.gap,'','gap');part(x.len,x.id,'cut')}part(r.remaining,'残','tail');parent.append(b)}function calc(){clear();try{const [L,R,P]=fields.slice(0,3).map(k=>readInt($(k).value));const items=$('pieces').value.split(/\r?\n/).filter(s=>s.trim()).map(s=>{const a=s.split('\t');if(a.length!==3)throw Error('各行はタブ区切り3列で入力してください。');return {id:a[0].trim(),len:readInt(a[1]),phase:readInt(a[2])}});const {optimal:o,baseline:b}=solve(L,R,P,items);report={L,R,P,items,optimal:o,baseline:b};$('status').textContent=o.missing.length?'未割付：'+o.missing.join('、'):'全ての必要片を裁断できます。';const root=$('result'),metrics=element('div',undefined,'metrics');for(const [t,v] of [['入力順 / 最適',b.cuts.length+' / '+o.cuts.length+' 枚'],['最適の残り',o.remaining+' mm'],['柄合わせ端材',o.waste+' mm'],['次の先端柄位置',o.nextPhase+' mm']]){const m=element('div',undefined,'metric');m.append(element('small',t),element('b',v));metrics.append(m)}root.append(metrics,element('small','入力順（入らない片は飛ばす）'));bar(root,b,L);root.append(element('small','最適順 · 緑：必要片 / 黄：柄合わせ端材 / 灰：残り'));bar(root,o,L);const wrap=element('div',undefined,'scroll'),table=element('table');const h=element('tr');for(const t of ['ID','端材 mm','開始 mm','終了 mm'])h.append(element('th',t));table.append(h);for(const c of o.cuts){const tr=element('tr');for(const v of [c.id,c.gap,c.start,c.end])tr.append(element('td',String(v)));table.append(tr)}wrap.append(table);root.append(wrap,element('p','裁断位置は現在の先端を0とする累積距離。最大枚数 → 最大必要片長 → 最小消費長の順に最適化。','muted'));$('export').disabled=false}catch(e){$('error').textContent=e.message;$('status').textContent='計算できませんでした。'}}fields.forEach(k=>$(k).addEventListener('input',clear));$('run').onclick=calc;$('reset').onclick=()=>{fields.forEach((k,i)=>$(k).value=defaults[i]);calc()};$('export').onclick=()=>{if(!report)return;const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=element('a');a.href=u;a.download='repeatcut.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};calc();
</script></html>
