<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糸継 / ITORELAY</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25382f;font:16px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #c9c4b5;margin-bottom:20px;padding-bottom:16px}h1{font-size:clamp(32px,6vw,54px);line-height:1.2;margin:10px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#58665b}.tag{font-size:12px;letter-spacing:.16em;color:#496653;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}.panel{min-width:0;background:#fffdf7;border:1px solid #d9d2c2;border-radius:16px;padding:20px}label{display:block;font-weight:650;margin-top:12px}textarea,input[type=number]{display:block;width:100%;padding:10px;border:1px solid #aaa99c;border-radius:8px;background:white;color:inherit;font:inherit}textarea{resize:vertical;min-height:128px}.pair,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#e7eee2;border-radius:10px;padding:10px}.metric strong{display:block;font-size:26px;overflow-wrap:anywhere}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{border:1px solid #416650;border-radius:8px;padding:10px 14px;background:#315a45;color:white;font:inherit;font-weight:650;cursor:pointer}button.alt{background:white;color:#315a45}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c78a3d;outline-offset:2px}.warning{background:#fbefda;border-left:4px solid #ad743b;padding:10px;font-size:14px}.timeline{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}.tile{min-width:46px;max-width:100%;padding:4px 8px;border-radius:5px;border-bottom:4px solid var(--tone);background:#eeeee6;font-size:13px;overflow-wrap:anywhere}.tile b{display:block}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px;border-bottom:1px solid #e1ded1;overflow-wrap:anywhere}#status{min-height:1.6em;color:#85481d}footer{margin-top:18px;font-size:13px}.check{display:flex;gap:8px;align-items:flex-start}.check input{margin-top:6px}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:14px}}@media print{body{background:white}.layout{display:block}.input,header .muted,footer,.buttons,#status{display:none}.panel{border:none}.tile{break-inside:avoid}}
</style></head><body><main><header><div class="tag">WORKSHOP TOOL / 01 · LOCAL ONLY</div><h1>糸継 <small>ITORELAY</small></h1><p>作品ごとの色順を守り、糸替えと枠替えの合計時間を減らす。</p><p class="muted">単針ミシン向けの段取り比較。登録・通信不要。</p></header><div class="layout"><section class="panel input"><h2>01 / 条件を入力</h2><label for="jobs">作品ごとの糸コード（1行1作品、空白区切り）</label><textarea id="jobs" spellcheck="false" maxlength="1500">赤 青 白
赤 青 白
赤 青 白</textarea><small>1〜4作品、各1〜8工程。色名は同じ糸なら完全に同じ表記に。</small><div class="pair"><div><label for="thread">糸替え（秒）</label><input id="thread" type="number" min="0" max="3600" step="1" value="90"></div><div><label for="hoop">枠替え（秒）</label><input id="hoop" type="number" min="0" max="3600" step="1" value="15"></div></div><label class="check"><input id="split" type="checkbox">各工程が独立実行可能で、枠を外しても安全に位置を再現できる場合のみ、作品途中の切替を許可</label><p class="warning">機種・刺繍データによって途中切替はできません。枠の再装着精度、再開機能、糸始末などを確認してください。これは計画表であり機械制御ではありません。</p><div class="buttons"><button id="run">最適化</button><button id="reset" class="alt">サンプルに戻す</button></div><p id="status" role="status" aria-live="polite"></p></section><section class="panel" id="result" aria-live="polite"><h2>02 / 段取り比較</h2><div id="output"></div><div class="buttons"><button id="export" class="alt" disabled>CSV出力</button><button id="print" class="alt" disabled>印刷</button></div></section></div><footer>初回の糸・枠装着と最後の取り外し、実際の縫製時間は両案共通として集計外。途中切替の追加作業は枠替え秒数に含めてください。</footer></main>
<script id="core">
'use strict';
function parseJobs(s){const jobs=s.trim().split(/\r?\n/).filter(x=>x.trim()).map(x=>x.trim().split(/\s+/));if(jobs.length<1||jobs.length>4||jobs.some(j=>j.length<1||j.length>8||j.some(c=>c.length>24||/[\u0000-\u001f]/.test(c))))throw Error('1〜4作品、各1〜8工程、糸コードは24文字以内にしてください。');return jobs}
function score(jobs,order,t,h){const p=jobs.map(()=>0);let last=-1,color=null,threads=0,hoops=0;const steps=order.map(j=>{if(!Number.isInteger(j)||!jobs[j]||p[j]>=jobs[j].length)throw Error('不正な工程');const c=jobs[j][p[j]++],dt=last!==-1&&c!==color,dh=last!==-1&&j!==last;threads+=+dt;hoops+=+dh;last=j;color=c;return {job:j,step:p[j],color:c,dt,dh,seconds:+dt*t+ +dh*h}});if(p.some((v,i)=>v!==jobs[i].length))throw Error('未完了工程');return {order,steps,threads,hoops,cost:threads*t+hoops*h}}
function optimize(jobs,t,h,split){if(!jobs.length||jobs.length>4||jobs.some(j=>!j.length||j.length>8)||![t,h].every(x=>Number.isInteger(x)&&x>=0&&x<=3600))throw Error('入力範囲外');const p=jobs.map(()=>0),memo=new Map();function solve(last){const key=p.join(',')+'|'+last;if(memo.has(key))return memo.get(key);if(p.every((x,i)=>x===jobs[i].length))return {cost:0,j:-1};let best={cost:Infinity,j:-1};const prev=last<0?null:jobs[last][p[last]-1];for(let j=0;j<jobs.length;j++){if(p[j]===jobs[j].length||(!split&&last>=0&&p[last]<jobs[last].length&&j!==last))continue;const c=jobs[j][p[j]],cost=(last>=0&&c!==prev?t:0)+(last>=0&&j!==last?h:0);p[j]++;const total=cost+solve(j).cost;p[j]--;if(total<best.cost)best={cost:total,j}}memo.set(key,best);return best}const min=solve(-1).cost,order=[];let last=-1;while(order.length<jobs.flat().length){const j=solve(last).j;order.push(j);p[j]++;last=j}const result=score(jobs,order,t,h);if(result.cost!==min)throw Error('内部計算エラー');return result}
function baseline(jobs,t,h){return score(jobs,jobs.flatMap((a,j)=>a.map(()=>j)),t,h)}
function csv(plan){const cell=v=>'"'+String(v).replace(/^[=+\-@\t\r\n]/,"'$&").replace(/"/g,'""')+'"';return [['順番','作品','工程','糸','糸替え','枠替え','追加秒'],...plan.steps.map((s,i)=>[i+1,String.fromCharCode(65+s.job),s.step,s.color,+s.dt,+s.dh,s.seconds])].map(r=>r.map(cell).join(',')).join('\r\n')}
</script><script>
const $=id=>document.getElementById(id),el=(tag,s)=>{const e=document.createElement(tag);if(s!==undefined)e.textContent=s;return e};let current=null;const names=['A','B','C','D'],tones=['#bb6b51','#537f9c','#71936d','#9d79a7','#c6a04b','#426b59'];
function clear(msg){current=null;$('output').replaceChildren();$('export').disabled=$('print').disabled=true;$('status').textContent=msg}
function render(){clear('');try{const jobs=parseJobs($('jobs').value),read=id=>$(id).value.trim()===''?NaN:Number($(id).value),t=read('thread'),h=read('hoop'),split=$('split').checked,b=baseline(jobs,t,h),o=optimize(jobs,t,h,split),out=$('output');current=o;const met=el('div');met.className='metrics';for(const [label,val] of [['入力順の段取り',b.cost+' 秒'],['推奨段取り',o.cost+' 秒'],['削減見込み',b.cost-o.cost+' 秒'],['糸替え / 枠替え',o.threads+' / '+o.hoops+' 回']]){const d=el('div');d.className='metric';d.append(el('small',label),el('strong',val));met.append(d)}out.append(met);const colors=[...new Set(jobs.flat())];for(const [title,plan] of [['入力順',b],['推奨順',o]]){out.append(el('p',title+'｜糸 '+plan.threads+'回・枠 '+plan.hoops+'回'));const line=el('div');line.className='timeline';for(const s of plan.steps){const tile=el('div');tile.className='tile';tile.style.setProperty('--tone',tones[colors.indexOf(s.color)%tones.length]);tile.append(el('b',names[s.job]+s.step),el('span',s.color));line.append(tile)}out.append(line)}out.append(el('h2','03 / 実行順序表'));const wrap=el('div');wrap.className='scroll';const table=el('table'),head=el('thead'),hr=el('tr');for(const v of ['順','作品 / 工程','糸','交換','秒'])hr.append(el('th',v));head.append(hr);table.append(head);const body=el('tbody');o.steps.forEach((s,i)=>{const r=el('tr');for(const v of [i+1,names[s.job]+' / '+s.step,s.color,i===0?'初回（除外）':(s.dt?'糸 ':'')+(s.dh?'枠':'')||'なし',s.seconds])r.append(el('td',v));body.append(r)});table.append(body);wrap.append(table);out.append(wrap);$('export').disabled=$('print').disabled=false;$('status').textContent=split?'途中切替ありのモデルで計算しました。':'作品を完了してから切り替えるモデルで計算しました。'}catch(e){clear(e.message)}}
for(const id of ['jobs','thread','hoop','split'])$(id).addEventListener('input',()=>clear('条件が変わりました。再計算してください。'));$('run').onclick=render;$('reset').onclick=()=>{$('jobs').value='赤 青 白\n赤 青 白\n赤 青 白';$('thread').value=90;$('hoop').value=15;$('split').checked=false;render()};$('export').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob(['\ufeff'+csv(current)],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download='itorelay.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('print').onclick=()=>{if(current)window.print()};render();
</script></body></html>
