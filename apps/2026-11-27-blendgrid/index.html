<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BlendGrid | 配合目盛りラボ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#243b38;font:16px/1.6 system-ui,sans-serif}header,main{max-width:1050px;margin:auto;padding:24px}header{padding-bottom:0}h1{font-size:clamp(28px,5vw,42px);margin:0;letter-spacing:-1px}h2{font-size:20px;margin:0 0 12px}small,.muted{color:#536762}.tag{font-size:12px;letter-spacing:2px;color:#657b70}section{background:#fffdf8;border:1px solid #d9ded3;border-radius:16px;padding:20px;margin-bottom:16px}.inputs,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}label{display:grid;gap:4px;font-size:14px}input,select,button{font:inherit;border:1px solid #b8c6bd;border-radius:8px;padding:9px;min-width:0;width:100%;background:#fff;color:inherit}button{width:auto;cursor:pointer;background:#285b52;color:white;border:0}button.secondary{background:#e4ece4;color:#243b38}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.stat{background:#eaf0e7;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px}.warn{color:#9b401f}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:right;padding:8px;border-bottom:1px solid #e1e5dc}th:first-child,td:first-child{text-align:left}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:12px 0}.tile{border:1px solid #d0d7cd;border-radius:9px;padding:8px;font-size:12px}.tile.bad{border:2px solid #b85f35}.bar{height:14px;display:flex;border-radius:3px;overflow:hidden;background:#ddd}.bar i{display:block}.error{color:#9b401f;font-weight:bold;min-height:1.5em}.hidden{display:none}@media(max-width:480px){header,main{padding:14px}section{padding:14px}}@media print{body{background:white}header,main{padding:0}.controls,.actions{display:none}section{break-inside:auto}.scroll{overflow:visible}.tile{break-inside:avoid}}
</style><header><div class="tag">STUDIO TOOLS / 01</div><h1>BlendGrid <small>配合目盛りラボ</small></h1><p>試験配合の理想比率を、手元の秤で区別できる計量表へ。</p></header>
<main><section class="controls"><h2>01 / 試験条件</h2><div class="inputs"><label>配合方式<select id="k"><option value="2">2材料・直線</option><option value="3" selected>3材料・三角</option></select></label><label>辺の分割数（2–12）<input id="n" type="number" min="2" max="12" step="1" value="8"></label><label>1試料の質量 g<input id="mass" type="number" min="0.01" step="0.01" value="1.0"></label><label>秤の表示刻み g<select id="step"><option>1</option><option selected>0.1</option><option>0.01</option></select></label><label>許容誤差（百分率ポイント）<input id="tol" type="number" min="0" max="100" step="0.01" value="2"></label></div><div class="actions"><button id="run">計量表を作成</button><button id="reset" class="secondary">初期値</button></div><div id="error" class="error" role="alert"></div><small>材料A/B/Cは事前に適合性を確認した任意の材料・原液の質量比。焼成、化学的安全性、秤の実精度を判定しません。</small></section>
<section id="result" aria-live="polite" class="hidden"><h2>02 / 計量可能性</h2><div class="stats" id="stats"></div><p id="recommend"></p><div class="actions"><button id="apply">推奨質量を適用</button><button id="csv" class="secondary">CSV保存</button><button id="print" class="secondary">印刷</button></div><p class="muted">橙枠：許容誤差超過・材料消失・別試料との同一配合。色はA/B/Cの質量比を示し、焼成色の予測ではありません。</p><div class="tiles" id="tiles"></div><h2>03 / 計量指示表</h2><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section></main>
<script id="core">
function grid(k,n){if(![2,3].includes(k)||!Number.isInteger(n)||n<2||n>12)throw Error('分割数は2〜12');const a=[];for(let i=n;i>=0;i--)if(k===2)a.push([i,n-i]);else for(let j=n-i;j>=0;j--)a.push([i,j,n-i-j]);return a}
function roundParts(p,n,t){const q=p.map(x=>Math.floor(x*t/n));const order=p.map((x,i)=>({i,r:x*t%n})).sort((a,b)=>b.r-a.r||a.i-b.i);let left=t-q.reduce((a,b)=>a+b,0);for(let j=0;j<left;j++)q[order[j].i]++;return q}
function evaluate(k,n,t,tol){if(!Number.isInteger(t)||t<1||t>10000||!Number.isFinite(tol)||tol<0||tol>100)throw Error('質量は1〜10000目盛り、許容誤差は0〜100');const rows=grid(k,n).map((p,i)=>{const q=roundParts(p,n,t),error=Math.max(...p.map((v,j)=>Math.abs(q[j]*n-v*t)*100/(n*t)));return {id:i+1,p,q,error,missing:p.some((v,j)=>v>0&&q[j]===0)}});const counts=new Map();for(const r of rows){const key=r.q.join(',');counts.set(key,(counts.get(key)||0)+1)}for(const r of rows){r.duplicate=counts.get(r.q.join(','))>1;r.bad=r.error>tol+1e-10||r.missing||r.duplicate}return {rows,unique:counts.size,bad:rows.filter(r=>r.bad).length,max:Math.max(...rows.map(r=>r.error))}}
function recommend(k,n,t,tol){for(let u=t;u<=Math.min(10000,t+n-1);u++)if(!evaluate(k,n,u,tol).bad)return u;return null}
if(typeof module!=='undefined')module.exports={grid,roundParts,evaluate,recommend};
</script><script>
const $=id=>document.getElementById(id),fmt=x=>Number(x.toFixed(6)).toString(),colors=['#487e77','#c49b64','#8c83b0'];let state=null;
function invalidate(){state=null;$('result').classList.add('hidden');$('error').textContent=''}
function run(){invalidate();try{const k=Number($('k').value),n=Number($('n').value),mass=Number($('mass').value),step=Number($('step').value),tol=Number($('tol').value),t=Math.round(mass/step);if(!['n','mass','tol'].every(id=>$(id).value.trim()!==''))throw Error('入力欄を埋めてください');if(!Number.isFinite(mass)||Math.abs(mass/step-t)>1e-7)throw Error('質量は秤の表示刻みの整数倍にしてください');const p=evaluate(k,n,t,tol),u=recommend(k,n,t,tol);state={k,n,t,step,tol,p,u};$('stats').innerHTML=[['試料数',p.rows.length],['異なる配合',p.unique],['要確認',p.bad],['最大誤差',p.max.toFixed(3)+' pp']].map(([a,b])=>'<div class="stat"><small>'+a+'</small><strong>'+b+'</strong></div>').join('');$('recommend').textContent=u===null?'上限内で推奨質量なし':p.bad?'現在量以上の最小合格質量：'+fmt(u*step)+' g / 全試料 '+fmt(u*step*p.rows.length)+' g':'現在の設定は全試料合格 / 全試料 '+fmt(t*step*p.rows.length)+' g';$('apply').disabled=u===null||u===t;$('tiles').innerHTML=p.rows.map(r=>'<div class="tile '+(r.bad?'bad':'')+'"><b>T'+r.id+'</b> / '+r.p.join(':')+'<div class="bar">'+r.q.map((v,i)=>'<i style="width:'+v/t*100+'%;background:'+colors[i]+'"></i>').join('')+'</div>'+r.q.map(v=>fmt(v*step)).join(' / ')+' g</div>').join('');const cols=['ID','理想比',...['A','B','C'].slice(0,k).map(x=>x+' g'),'誤差 pp','判定'];$('head').innerHTML='<tr>'+cols.map(v=>'<th>'+v+'</th>').join('')+'</tr>';$('rows').innerHTML=p.rows.map(r=>'<tr>'+cells(r,step).map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('');$('result').classList.remove('hidden')}catch(e){$('error').textContent=e.message}}
function cells(r,step){return ['T'+r.id,r.p.join(':'),...r.q.map(v=>fmt(v*step)),r.error.toFixed(6),[r.missing?'材料消失':'',r.duplicate?'同一配合':'',r.bad?'要確認':'OK'].filter(Boolean).join(' / ')]}
for(const id of ['k','n','mass','step','tol'])$(id).addEventListener('input',invalidate);$('run').onclick=run;$('reset').onclick=()=>{for(const [id,v] of Object.entries({k:3,n:8,mass:1,step:0.1,tol:2}))$(id).value=v;run()};$('apply').onclick=()=>{if(state?.u!=null){$('mass').value=fmt(state.u*state.step);run()}};$('print').onclick=()=>window.print();$('csv').onclick=()=>{if(!state)return;const {p,k,step}=state;const csv=[['ID','Target ratio',...['A','B','C'].slice(0,k).map(x=>x+' g'),'Error pp','Status'],...p.rows.map(r=>cells(r,step))].map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='blendgrid.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};run();
</script></html>
