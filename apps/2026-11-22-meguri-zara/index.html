<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#18322c"><title>巡り皿｜リユース食器の循環・不足シミュレーター</title>
<style>
:root{--ink:#18322c;--moss:#236355;--mint:#d4eadf;--paper:#f6f7f1;--line:#d6e0d8;--red:#b34f39;--slate:#61756b;--gold:#f7d793}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--ink);color:white}.wrap{max-width:1250px;margin:0 auto;padding:0 24px}.top-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:90px}.brand small{font-size:11px;letter-spacing:.17em;color:#b6d1c4}.brand h1{font-size:26px;letter-spacing:.04em;margin:3px 0 0;font-weight:800}.brand span{color:#88d6ad}.header-tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:white;border-radius:10px;color:var(--ink);padding:10px 14px;font-weight:700;transition:filter .15s}.btn:hover{filter:brightness(.96)}.btn.primary{background:var(--moss);border-color:var(--moss);color:white}.top .btn{background:#31524a;color:white;border-color:#527269}.top .btn.strong{background:#d6ebc4;color:#17392c}.tabs{display:flex;gap:5px;margin:24px 0 17px;border-bottom:1px solid #c9d7d0}.tab{border:0;background:none;padding:14px 20px;color:#61756b;font-weight:800;border-bottom:3px solid transparent}.tab.active{border-color:var(--moss);color:var(--ink)}.layout{min-width:0;display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px #173a2810;padding:22px}.panel h2,.panel h3{margin:0}.eyebrow{letter-spacing:.13em;text-transform:uppercase;color:var(--moss);font-size:10px;font-weight:900}.sub{color:var(--slate);font-size:12px;line-height:1.7}.panel-title{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:16px}.panel-title h2{font-size:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;min-width:0}.field.span{grid-column:1/-1}label{color:#52695d;font-weight:700;font-size:12px}input,select{width:100%;background:#fbfcf8;color:var(--ink);border:1px solid #c8d8ce;border-radius:9px;padding:11px;min-width:0}input:focus,select:focus{outline:2px solid #5cb591;outline-offset:1px}.hint{border-radius:12px;background:#f0f6f1;padding:14px;line-height:1.75;color:#4a6656;margin-top:18px;font-size:12px}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat strong{font-size:27px;display:block;letter-spacing:-.03em;margin:7px 0 4px}.stat .u{font-size:13px;font-weight:700;margin-left:3px}.stat.attention{border-color:#e6bbad;background:#fff5ef}.stat.good{background:#e9f5ee}.muted{color:var(--slate)}.notice{border-left:4px solid #e6a46f;border-radius:10px;background:#fff8ec;padding:14px 16px;margin-bottom:18px;line-height:1.7}.notice.ok{border-color:#6aa98c;background:#ecf7ef}.notice b{display:block}.chart{display:flex;align-items:flex-end;gap:13px;min-height:218px;padding:16px 4px 0;overflow-x:auto}.bar-col{display:flex;flex:1 0 50px;flex-direction:column;align-items:center;justify-content:end;gap:8px;min-width:42px;height:190px}.bar-stack{height:145px;display:flex;align-items:flex-end;gap:4px;width:100%}.bar{position:relative;flex:1 1 0;border-radius:6px 6px 1px 1px;min-height:0;background:var(--moss)}.bar.demand{background:#a9cab5}.bar.issue{background:var(--moss)}.bar.shortage{background:#dc927a}.bar-label{font-size:11px;color:var(--slate);white-space:nowrap}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--slate);margin-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:12px 8px;border-bottom:1px solid #e4ebe6;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#60776a;font-weight:800;font-size:11px;background:#f8faf7}td.bad{font-weight:800;color:var(--red)}.small-input{padding:7px 9px;width:86px;text-align:right}.label-input{width:100px;text-align:left}.mini{font-size:11px;color:var(--slate)}.side-box{display:grid;gap:7px;margin:15px 0}.side-box .btn{width:100%}.pill{background:var(--mint);color:#2b6249;font-weight:800;font-size:11px;border-radius:99px;padding:5px 9px}.ledger-layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.ledger-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.ledger-stats .stat{padding:14px}.ledger-stats .stat strong{font-size:23px}.grid-two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.note-line{margin-top:15px;border-top:1px solid var(--line);padding-top:13px;line-height:1.7;color:var(--slate);font-size:12px}.footer{padding:20px 0 35px;color:var(--slate);font-size:11px;line-height:1.8}.empty{text-align:center;padding:30px 10px;color:var(--slate)}.print-only{display:none}#toast{position:fixed;bottom:20px;right:22px;border-radius:12px;background:var(--ink);color:white;padding:14px 18px;box-shadow:0 6px 25px #122b2399;max-width:360px;z-index:100;display:none}#toast.error{background:#933f34}@media(max-width:940px){.layout,.ledger-layout{grid-template-columns:minmax(0,1fr)}.stat-grid{grid-template-columns:repeat(2,1fr)}.ledger-stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.wrap{padding:0 14px}.top-inner{align-items:flex-start;flex-direction:column;padding:16px 0}.brand h1{font-size:22px}.header-tools{justify-content:flex-start}.btn{padding:9px 11px}.panel{padding:16px}.stat-grid{gap:7px}.stat{padding:13px}.stat strong{font-size:23px}.tab{padding:13px 16px}.fields{gap:9px}.ledger-stats{gap:7px}}@media print{body{background:#fff}.top,.tabs,.no-print,.footer,#toast{display:none!important}.wrap{max-width:none;padding:0}.layout,.ledger-layout{display:block}.panel{break-inside:avoid;box-shadow:none;border:1px solid #bbb;margin-bottom:12px}.stat-grid{grid-template-columns:repeat(4,1fr)}.print-only{display:block}.side-panel{display:none}.bar{print-color-adjust:exact;-webkit-print-color-adjust:exact}.notice{print-color-adjust:exact}} 
</style></head><body>
<header class="top"><div class="wrap top-inner"><div class="brand"><small>LOCAL-FIRST / EVENT TOOLKIT</small><h1><span>巡り皿</span> <span style="color:#fff;font-size:13px;font-weight:500">MEGURI ZARA</span></h1></div><div class="header-tools"><button class="btn" data-action="export-json">JSON保存</button><button class="btn" data-action="import-json">JSON読込</button><button class="btn" data-action="export-csv">CSV出力</button><button class="btn strong" data-action="print">印刷</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></div></header>
<main class="wrap"><nav class="tabs no-print"><button class="tab active" data-tab="plan">01 · 事前計画</button><button class="tab" data-tab="ledger">02 · 当日記録</button><button class="tab" data-tab="help">03 · 使い方・安全</button></nav><section id="view"></section><footer class="footer">巡り皿 v1.0 — リユース容器の数量計画ツール。無料・オフライン対応。登録・通信・個人情報入力は不要。衛生管理や自治体の指導に代わるものではありません。</footer></main><div id="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script><script>
(function(){'use strict';const E=window.MeguriEngine, KEY='meguri-zara-v1';let state,tab='plan',toastTimer;
const $=(s,root=document)=>root.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ja-JP');
function notify(msg,error=false){const t=$('#toast');t.textContent=msg;t.className=error?'error':'';t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',4000)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){return {plan:E.normalizePlan(x.plan),log:E.normalizeLog(x.log)}}}catch(e){}return E.demo()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('ブラウザへの保存に失敗。JSON保存をご利用ください',true)}}
function field(label,key,value,info,span='',type='number'){return `<div class="field ${span}"><label for="p-${key}">${label}</label><input id="p-${key}" data-setting="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="1"':''}><small class="mini">${info||''}</small></div>`}
function planView(){const p=state.plan,r=E.simulate(p),a=Math.max(0,r.required-p.initial);const max=Math.max(1,...r.rows.map(x=>x.demand));
const bars=r.rows.map(x=>`<div class="bar-col"><div class="bar-stack" title="${esc(x.label)}: 需要${x.demand} / 提供${x.served}"><div class="bar demand" style="height:${x.demand/max*100}%"></div><div class="bar issue" style="height:${x.served/max*100}%;${x.shortage?'background:#bd6b4d':''}"></div></div><div class="bar-label">${esc(x.label)}</div></div>`).join('');
const trs=r.rows.map((x,i)=>`<tr><td><input aria-label="${i+1}枠目の時刻" class="small-input label-input" data-slot="${i}" data-prop="label" value="${esc(x.label)}" maxlength="24"></td><td><input aria-label="${x.label}の需要" class="small-input" type="number" min="0" data-slot="${i}" data-prop="demand" value="${x.demand}"></td><td><input aria-label="${x.label}の清潔食器補充" class="small-input" type="number" min="0" data-slot="${i}" data-prop="supply" value="${x.supply}"></td><td>${fmt(x.returns)}</td><td>${fmt(x.served)}</td><td class="${x.shortage?'bad':''}">${fmt(x.shortage)}</td><td>${fmt(x.clean)}</td></tr>`).join('');
return `<div class="print-only"><h1>巡り皿 — ${esc(p.title)}</h1></div><div class="layout"><aside class="panel side-panel no-print"><div class="panel-title"><div><div class="eyebrow">INPUT PARAMETERS</div><h2>イベント条件</h2></div><span class="pill">ローカル保存</span></div><div class="fields">${field('イベント名','title',p.title,'記録・印刷の見出し','span','text')}${field('開始時の清潔食器','initial',p.initial,'洗浄済みの在庫数')}${field('1個あたりの預り金（円）','deposit',p.deposit,'返金精算の参考値')}${field('想定回収率（%）','rate',p.rate,'実際の回収を保証しません')}${field('返却までの時間枠数','delay',p.delay,'例：2＝2枠後に戻る')}</div><div class="side-box"><button class="btn primary" data-action="recommend">推奨初期在庫 ${fmt(r.required)} 個に変更</button><button class="btn" data-action="reset-demo">サンプルに戻す</button></div><div class="hint">🔎 <b>重要な数え方</b><br>返却された食器は「未洗浄」として積み上げます。イベント中の店頭洗浄を前提に、清潔在庫へ戻すことはありません。補充欄には<strong>衛生的に洗浄済みで実際に届く数量</strong>だけを入力してください。</div></aside>
<div><div class="stat-grid"><div class="stat"><small class="muted">想定需要</small><strong>${fmt(r.demand)}<span class="u">個</span></strong><small class="muted">全時間帯の合計</small></div><div class="stat ${r.unmet?'attention':'good'}"><small class="muted">提供できない見込み</small><strong>${fmt(r.unmet)}<span class="u">個</span></strong><small class="muted">在庫不足分</small></div><div class="stat"><small class="muted">必要な開始在庫</small><strong>${fmt(r.required)}<span class="u">個</span></strong><small class="muted">補充を含めた下限</small></div><div class="stat"><small class="muted">終了時の貸出中</small><strong>${fmt(r.outside)}<span class="u">個</span></strong><small class="muted">預り金 ${fmt(r.held)} 円</small></div></div>
<div class="notice ${a===0?'ok':''}"><b>${a?`清潔な開始在庫があと ${fmt(a)} 個必要です`:'想定需要を全て提供できる在庫計画です'}</b>清潔な補充予定は合計 ${fmt(r.replenished)} 個。回収見込み ${fmt(r.returned)} 個は未洗浄として管理し、同じイベントでの再配布には数えません。${r.late?`イベント終了後の返却見込み ${fmt(r.late)} 個は終了時在庫に含めません。`:''}</div>
<div class="panel" style="margin-bottom:18px"><div class="panel-title"><div><div class="eyebrow">FLOW BY TIME SLOT</div><h2>時間帯ごとの提供可能数</h2></div><span class="pill">${p.slots.length} 枠</span></div><div class="chart" role="img" aria-label="時間別の需要と提供数の棒グラフ">${bars}</div><div class="legend"><span><i class="dot" style="background:#a9cab5"></i>想定需要</span><span><i class="dot" style="background:#236355"></i>提供可能数</span><span><i class="dot" style="background:#bd6b4d"></i>不足した枠</span></div></div>
<div class="panel"><div class="panel-title"><div><div class="eyebrow">EDIT THE SCHEDULE</div><h2>時間枠を編集</h2></div><div class="no-print"><button class="btn" data-action="add-slot">＋ 時間枠</button> <button class="btn" data-action="remove-slot">－ 最終枠</button></div></div><div class="scroll"><table><thead><tr><th>時間</th><th>需要数</th><th>清潔補充</th><th>返却数</th><th>提供数</th><th>不足</th><th>清潔残</th></tr></thead><tbody>${trs}</tbody></table></div><p class="note-line">補充は各枠の提供前に到着する想定。返却数はそれ以前に提供した数 × 回収率から推計します。将来の返却分・未洗浄食器は清潔在庫へ加算しません。</p></div></div></div>`}
function ledgerView(){const log=state.log,l=E.replayLog(log,state.plan.deposit);const labels={issue:'提供・貸出',return:'返却（未洗浄）',supply:'清潔食器の到着',discard:'清潔食器を除外'};
return `<div class="print-only"><h1>巡り皿 — 当日実績</h1></div><div class="ledger-stats"><div class="stat good"><small class="muted">清潔・提供可能</small><strong>${fmt(l.clean)} 個</strong></div><div class="stat"><small class="muted">貸出中</small><strong>${fmt(l.out)} 個</strong></div><div class="stat"><small class="muted">回収済・未洗浄</small><strong>${fmt(l.dirty)} 個</strong></div><div class="stat"><small class="muted">未返金預り金</small><strong>${fmt(l.held)} 円</strong></div></div>
<div class="ledger-layout"><aside class="panel no-print"><div class="panel-title"><div><div class="eyebrow">LIVE MANUAL LEDGER</div><h2>取引を記録</h2></div></div><p class="sub">氏名・連絡先・容器IDを入力しない匿名集計。返却は未洗浄在庫に入り、店頭での再利用は想定しません。</p><div class="field"><label for="log-type">取引の種類</label><select id="log-type"><option value="issue">提供・貸出（清潔在庫 −）</option><option value="return">返却（未洗浄 ＋）</option><option value="supply">洗浄済み食器が到着（清潔在庫 ＋）</option><option value="discard">清潔食器を除外（清潔在庫 −）</option></select></div><div class="grid-two" style="margin-top:14px"><div class="field"><label for="log-qty">点数</label><input id="log-qty" type="number" min="1" value="1"></div><div class="field"><label for="log-note">任意メモ</label><input id="log-note" maxlength="80" placeholder="例：午後の追加便"></div></div><div class="side-box"><button class="btn primary" data-action="record">この取引を記録</button><button class="btn" data-action="undo">最後の取引を取り消す</button><button class="btn" data-action="start-ledger">計画の開始在庫（${fmt(state.plan.initial)}個）で実績を新規開始</button></div><div class="hint">⚠ 清潔食器の到着は、衛生管理者・外部サービスから受け取った洗浄済み品を記録してください。回収食器をそのまま「到着」と記録しないでください。</div></aside><div class="panel"><div class="panel-title"><div><div class="eyebrow">RECONCILIATION</div><h2>実績台帳</h2></div><span class="pill">${log.entries.length} 件</span></div><div class="grid-two"><div class="hint" style="margin:0">配布累計 <b>${fmt(l.issued)}個</b><br>回収累計 <b>${fmt(l.returned)}個</b><br>補充累計 <b>${fmt(l.supplied)}個</b></div><div class="hint" style="margin:0">除外累計 <b>${fmt(l.discarded)}個</b><br>開始清潔在庫 <b>${fmt(log.start)}個</b><br>数量整合 <b>${l.conservation?'一致':'要確認'}</b></div></div><div class="scroll" style="margin-top:16px"><table><thead><tr><th>記録日時</th><th>区分</th><th>点数</th><th>清潔残</th><th>貸出中</th><th>メモ</th></tr></thead><tbody>${l.history.length?l.history.slice().reverse().map(e=>`<tr><td>${esc(e.at)}</td><td>${esc(labels[e.type])}</td><td>${fmt(e.qty)}</td><td>${fmt(e.clean)}</td><td>${fmt(e.out)}</td><td>${esc(e.note)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">取引を入力すると、ここに履歴が表示されます。</td></tr>'}</tbody></table></div><p class="note-line">数量保存式：開始在庫 ＋ 清潔補充 ＝ 清潔残 ＋ 貸出中 ＋ 未洗浄返却 ＋ 除外。預り金は設定単価×貸出中数の計算値であり、実際の現金残高とは異なります。</p></div></div>`}
function helpView(){return `<div class="panel" style="max-width:820px;margin:auto"><div class="eyebrow">HOW TO USE</div><h2>安全に使うための3つの考え方</h2><div class="hint"><b>1. 清潔在庫と返却在庫を混ぜない</b><p>提供した容器が返却されても、未洗浄品はすぐ使える在庫ではありません。事前計画では、外部から届く洗浄済みの補充品だけを供給に足します。</p><b>2. シミュレーションは数量見積もり</b><p>回収率と返却時間は仮定です。推奨開始在庫は登録した需要と補充予定に対する算術的な下限で、混雑や輸送遅延などの余裕は含みません。</p><b>3. 当日台帳は数量のみ</b><p>「当日記録」で提供・返却・清潔補充・除外を入力します。最後の取引は取り消せます。JSON出力で別の端末へ引き継げます。</p></div><p class="note-line">衛生に関する注意：大阪市「リユース食器 導入ガイド（イベント主催者向け）」（2026年11月4日）は、回収した食器を各店で洗って再使用しないよう注意喚起しています。ここでは返却品を清潔在庫へ自動復帰させません。地域の保健所・主催者の要件に従ってください。<br><a href="https://www.city.osaka.lg.jp/kankyo/page/0000687593.html" target="_blank" rel="noopener noreferrer">大阪市の公式ガイドを開く</a></p></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{const a=b.dataset.tab===tab;b.classList.toggle('active',a);b.setAttribute('aria-selected',String(a))});$('#view').innerHTML=tab==='plan'?planView():tab==='ledger'?ledgerView():helpView()}
function changePlan(action,value){const next=structuredClone(state.plan);if(action==='title')next.title=value;else next[action]=Number(value);state.plan=E.normalizePlan(next);save();render()}
function download(name,text,mime){const blob=new Blob(['\ufeff',text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csv(){const p=state.plan,r=E.simulate(p),l=E.replayLog(state.log,p.deposit);const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const lines=[['時刻','需要','清潔補充','返却（未洗浄）','提供','不足','清潔残','貸出中'],...r.rows.map(x=>[x.label,x.demand,x.supply,x.returns,x.served,x.shortage,x.clean,x.outside]),[],['当日実績記録日時','区分','点数','メモ','清潔残','貸出中'],...l.history.map(e=>[e.at,e.type,e.qty,e.note,e.clean,e.out])];return lines.map(row=>row.map(quote).join(',')).join('\r\n')}
function applyAction(action){try{if(action==='export-json')download('meguri-zara-plan.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');else if(action==='import-json')$('#import-file').click();else if(action==='export-csv')download('meguri-zara-report.csv',csv(),'text/csv');else if(action==='print')window.print();else if(action==='recommend'){state.plan.initial=E.requiredInitial(state.plan);save();render();notify('推奨初期在庫に更新しました')}else if(action==='reset-demo'){if(confirm('現在の計画・実績をサンプルで置き換えますか？')){state=E.demo();save();render();notify('サンプルに戻しました')}}else if(action==='add-slot'){if(state.plan.slots.length>=24)throw new Error('最大24枠です');state.plan.slots.push({label:`${state.plan.slots.length+1}枠目`,demand:0,supply:0});save();render()}else if(action==='remove-slot'){if(state.plan.slots.length<=1)throw new Error('最低1枠必要です');state.plan.slots.pop();save();render()}else if(action==='record'){const type=$('#log-type').value,qty=Number($('#log-qty').value),note=$('#log-note').value;state.log=E.appendEntry(state.log,{type,qty,note},state.plan.deposit);save();render();notify('取引を記録しました')}else if(action==='undo'){if(!state.log.entries.length)throw new Error('取り消す記録がありません');state.log.entries.pop();save();render();notify('最後の取引を取り消しました')}else if(action==='start-ledger'){if(confirm('実績履歴を消して、計画の開始在庫から記録し直しますか？')){state.log={start:state.plan.initial,entries:[]};save();render();notify('新しい台帳を開始しました')}}}catch(e){notify(e.message,true)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}const a=e.target.closest('[data-action]');if(a)applyAction(a.dataset.action)});
document.addEventListener('change',e=>{try{const t=e.target;if(t.dataset.setting){changePlan(t.dataset.setting,t.value)}else if(t.dataset.slot!=null){const i=Number(t.dataset.slot),p=t.dataset.prop,copy=structuredClone(state.plan);copy.slots[i][p]=p==='label'?t.value:Number(t.value);state.plan=E.normalizePlan(copy);save();render()}}catch(err){notify(err.message,true);render()}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>400000)throw new Error('JSONファイルは400KB以下にしてください');const raw=JSON.parse(await f.text());const next={plan:E.normalizePlan(raw.plan),log:E.normalizeLog(raw.log)};E.replayLog(next.log,next.plan.deposit);state=next;save();render();notify('JSONを読み込みました')}catch(err){notify(`読込失敗：${err.message}`,true)}finally{e.target.value=''}});
state=load();render();
})();
</script></body></html>
