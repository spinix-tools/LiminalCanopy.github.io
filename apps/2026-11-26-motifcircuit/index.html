<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柄環 / MotifCircuit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#263c38;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 18px 48px}header{border-bottom:1px solid #b6c4b9;padding-bottom:18px;margin-bottom:20px}small,.muted{color:#536963}h1{font-size:clamp(30px,6vw,48px);margin:2px 0;letter-spacing:-.05em}h2{font-size:18px;margin:0 0 10px}p{margin:6px 0 14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}.panel{background:#fffdf8;border:1px solid #d6d9ce;border-radius:15px;padding:19px;min-width:0}label{display:block;font-weight:650;margin:12px 0 4px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #abbdb3;border-radius:7px;padding:9px;background:#fff;color:#253c38}textarea{resize:vertical;font:13px/1.7 ui-monospace,monospace;min-height:84px}button{border:1px solid #315d50;background:#315d50;color:white;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:650}button.alt{background:transparent;color:#315d50}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{padding:12px;border-radius:9px;background:#e3eee5;font-weight:700;overflow-wrap:anywhere}.bad{background:#fbe3d6;color:#8a3527}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f0f3eb;padding:10px;border-radius:8px;font-size:12px}.stat strong{display:block;font-size:24px}.strip{height:22px;border:1px solid #a3b2a4;border-radius:4px;background:repeating-linear-gradient(90deg,#dce8da 0 38%,#416b5d 38% 48%,#efd6a1 48% 64%,#8a4437 64% 70%,#dce8da 70% 100%);background-size:var(--period) 100%;background-position:var(--phase) 0}.item{margin:10px 0;overflow-wrap:anywhere}.item b{display:block}.issue{border-left:3px solid #a64e3c;padding:5px 9px;margin:8px 0;overflow-wrap:anywhere}.pill{display:inline-block;margin:3px 3px 3px 0;font-size:13px}.section{border-top:1px solid #d6d9ce;margin-top:17px;padding-top:14px}footer{margin-top:18px;font-size:12px;color:#536963}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:14px}main{padding:15px 10px 30px}}@media print{.editor,.actions,footer{display:none}.layout{display:block}}
</style></head><body><main><header><small>FIELD TOOLS / 01 · SEWING</small><h1>柄環 <span style="font-size:.52em;letter-spacing:0">MotifCircuit</span></h1><p>裁断前に、複数の合印で横縞の柄合わせが同時に成立するか検査。</p></header><div class="layout"><section class="panel editor"><h2>01 / 条件を入力</h2><label for="repeat">柄の周期（mm・整数）</label><input id="repeat" type="number" min="1" max="10000" value="60"><label for="parts">パーツ ID, 名前（1行1件）</label><textarea id="parts" rows="4" spellcheck="false">A,前身頃
B,後身頃
C,切替布</textarea><label for="seams">合印 左ID, 左オフセット, 右ID, 右オフセット</label><small>オフセットは各パーツの同じ向きの基準点からの距離（mm）。完成縫い線上の合印を測る。</small><textarea id="seams" rows="5" spellcheck="false">A,20,B,10
B,20,C,10
C,0,A,0</textarea><label for="anchors">固定柄位相 ID, 位相（任意）</label><small>既に裁断済みのパーツなど。位相0は実布の柄の起点。</small><textarea id="anchors" rows="2" spellcheck="false">A,0</textarea><div class="actions"><button id="run">検査する</button><button class="alt" id="reset">矛盾例に戻す</button><button class="alt" id="good">成立例</button></div></section><section class="panel" aria-live="polite"><h2>02 / 検査レポート</h2><div id="status" class="status">入力してください</div><div id="result"></div><div class="actions"><button id="export" disabled>JSON保存</button><button id="print" class="alt" disabled>印刷</button></div></section></div><footer>同じ向きの直線状の周期柄を1軸だけ扱う試算。位相は基準点の柄位置であり、裁断座標ではありません。布幅・縫い代・曲線・伸び・反転・裁断配置は検証しません。入力は端末内のみ。</footer></main>
<script id="engine">
const mod=(x,r)=>((x%r)+r)%r;
function parse(r,p,s,a){const num=(v,min,max)=>{if(!/^-?\d+$/.test(String(v).trim())||!Number.isSafeInteger(Number(v))||Number(v)<min||Number(v)>max)throw Error('整数の範囲を確認してください: '+v);return Number(v)};const rows=t=>t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(',').map(x=>x.trim()));r=num(r,1,10000);const parts=rows(p).map(x=>{if(x.length!==2||!/^[A-Za-z0-9_-]{1,16}$/.test(x[0])||!x[1]||x[1].length>60)throw Error('パーツの形式を確認');return {id:x[0],name:x[1]}});const ids=new Set(parts.map(x=>x.id));if(parts.length<1||parts.length>40||ids.size!==parts.length)throw Error('パーツは重複なしで1〜40件');const seams=rows(s).map((x,i)=>{if(x.length!==4||!ids.has(x[0])||!ids.has(x[2]))throw Error('合印 '+(i+1)+' のIDを確認');return {id:'S'+(i+1),u:x[0],v:x[2],left:num(x[1],-100000,100000),right:num(x[3],-100000,100000)}});const anchors=rows(a).map((x,i)=>{if(x.length!==2||!ids.has(x[0]))throw Error('固定位相 '+(i+1)+' のIDを確認');return {id:'F'+(i+1),u:'@',v:x[0],left:num(x[1],0,r-1),right:0}});if(seams.length>100||anchors.length>40)throw Error('合印100件、固定40件まで');return {r,parts,seams,anchors}}
function solve(data,skip=''){const {r,parts,seams,anchors}=data,edges=[...anchors,...seams].filter(e=>e.id!==skip),nodes=['@',...parts.map(p=>p.id)],adj=new Map(nodes.map(n=>[n,[]])),phase=new Map(),parent=new Map(),component=new Map();for(const e of edges){const d=mod(e.left-e.right,r);adj.get(e.u).push({v:e.v,d,id:e.id});adj.get(e.v).push({v:e.u,d:mod(-d,r),id:e.id})}for(const root of nodes){if(phase.has(root))continue;phase.set(root,0);component.set(root,root);const q=[root];for(let i=0;i<q.length;i++){const u=q[i];for(const e of adj.get(u)){if(phase.has(e.v))continue;phase.set(e.v,mod(phase.get(u)+e.d,r));component.set(e.v,root);parent.set(e.v,{u,id:e.id});q.push(e.v)}}}const path=n=>{const a=[];while(parent.has(n)){const e=parent.get(n);a.push({n,id:e.id});n=e.u}return {a,root:n}};function witness(u,v,id){const a=path(u).a,b=path(v).a;while(a.length&&b.length&&a.at(-1).id===b.at(-1).id){a.pop();b.pop()}return [...a.map(e=>e.id),...b.reverse().map(e=>e.id),id]};const checks=edges.map(e=>{const left=mod(phase.get(e.u)+e.left,r),right=mod(phase.get(e.v)+e.right,r),d=mod(left-right,r);return {...e,match:d===0,leftPhase:left,rightPhase:right,delta:Math.min(d,r-d),witness:d?witness(e.u,e.v,e.id):[]}});return {ok:checks.every(e=>e.match),phases:parts.map(p=>({...p,phase:phase.get(p.id),fixed:component.get(p.id)==='@',component:component.get(p.id)})),checks}}
function analyze(data){const result=solve(data);return {...result,repairs:result.ok?[]:data.seams.filter(e=>solve(data,e.id).ok).map(e=>e.id)}}
</script><script>
const $=id=>document.getElementById(id);const sample={repeat:'60',parts:'A,前身頃\nB,後身頃\nC,切替布',seams:'A,20,B,10\nB,20,C,10\nC,0,A,0',anchors:'A,0'};let report=null;function element(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function invalidate(){report=null;$('result').replaceChildren();$('status').className='status';$('status').textContent='条件が変更されました。再検査してください。';$('export').disabled=$('print').disabled=true}function load(good=false){for(const [id,v] of Object.entries(sample))$(id).value=v;if(good)$('seams').value=sample.seams.replace('C,0,A,0','C,0,A,20');run()}function run(){invalidate();try{const d=parse($('repeat').value,$('parts').value,$('seams').value,$('anchors').value),r=analyze(d);report={input:d,result:r};$('status').textContent=r.ok?'成立：全条件を同時に満たす位相があります。':'矛盾：全条件を同時に満たす位相はありません。';$('status').className='status'+(r.ok?'':' bad');const out=$('result'),stats=element('div',undefined,'stats');for(const [k,v] of [['パーツ',d.parts.length],['不一致※',r.checks.filter(e=>!e.match).length],['1件解除候補',r.repairs.length]]){const box=element('div',k,'stat');box.append(element('strong',String(v)));stats.append(box)}out.append(stats,element('p','※探索木から得た仮配置での不一致数。最低違反数ではありません。','muted'));const sec=element('div',undefined,'section');sec.append(element('h2',r.ok?'位相の一例':'矛盾検出用の仮位相'));for(const p of r.phases){const row=element('div',undefined,'item'),bar=element('div',undefined,'strip');bar.style.setProperty('--period','100px');bar.style.setProperty('--phase',(-p.phase/d.r*100)+'px');row.append(element('b',p.id+' · '+p.name+' / '+p.phase+' mm '+(p.fixed?'（固定基準）':'（相対基準 '+p.component+'）')),bar);sec.append(row)}out.append(sec);const cs=element('div',undefined,'section');cs.append(element('h2','合印・固定条件の照合'));for(const c of r.checks){const row=element('div',c.id+' · '+c.u+' → '+c.v+' : '+c.leftPhase+' / '+c.rightPhase+' mm '+(c.match?' ✓':' × 差 '+c.delta+' mm'),c.match?'item':'issue');if(!c.match)row.append(element('div','矛盾に関わる条件: '+c.witness.join(' → '),'muted'));cs.append(row)}out.append(cs);if(!r.ok){const fix=element('div',undefined,'section');fix.append(element('h2','解除候補（合印1件のみ）'),element('p',r.repairs.length?'下記のどれか1件を除けば全条件が成立します。重要度を考慮し実布で確認してください。':'合印1件の解除だけでは解消できません。固定条件や複数の合印を確認してください。'));for(const id of r.repairs){const b=element('button',id+' を外して再検査','alt pill');b.onclick=()=>{const lines=$('seams').value.split(/\r?\n/).filter(l=>l.trim());lines.splice(Number(id.slice(1))-1,1);$('seams').value=lines.join('\n');run()};fix.append(b)}out.append(fix)}$('export').disabled=$('print').disabled=false}catch(e){$('status').className='status bad';$('status').textContent=e.message}}
for(const id of ['repeat','parts','seams','anchors'])$(id).addEventListener('input',invalidate);$('run').onclick=run;$('reset').onclick=()=>load();$('good').onclick=()=>load(true);$('print').onclick=()=>window.print();$('export').onclick=()=>{if(!report)return;const a=element('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='motifcircuit-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};load();
</script></body></html>
