<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盤棚 / BANTANA</title>
<style>
:root{color-scheme:light;--ink:#243b39;--muted:#5b716d;--paper:#f5f2e9;--line:#deded2;--green:#356d60;--orange:#b86438}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:25px 20px 40px}header{border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:20px}h1{font-size:clamp(34px,6vw,54px);line-height:1.1;margin:6px 0 12px;letter-spacing:-.06em}h1 small{font-size:16px;letter-spacing:.12em;color:var(--green)}h2{font-size:19px;margin:0 0 10px}p{margin:5px 0 12px}small,.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}.panel{background:#fffefa;border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #aabbb4;background:#fff;color:var(--ink);padding:10px;border-radius:8px}textarea{resize:vertical;min-height:220px;font:14px/1.7 ui-monospace,monospace}button{border:1px solid var(--green);border-radius:8px;background:var(--green);color:white;padding:9px 13px;cursor:pointer;font-weight:650}button.alt{background:transparent;color:var(--green)}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 16px}.stat{background:#edf1e8;border-radius:10px;padding:10px;overflow-wrap:anywhere}.stat strong{display:block;font-size:clamp(20px,4vw,30px);line-height:1.25}.shelf{margin:14px 0}.track{height:45px;border:1px solid #aabbb4;background:repeating-linear-gradient(135deg,#f4f4ec,#f4f4ec 6px,#e8eae0 6px,#e8eae0 9px);display:flex;overflow:hidden;position:relative;border-radius:5px}.segment{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:1px solid #fff8;color:white;font-size:12px;white-space:nowrap;background:var(--green)}.segment.move{background:var(--orange)}.limit{position:absolute;top:0;bottom:0;width:2px;background:#253c3a;pointer-events:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.error{color:#a33e29;font-weight:650}.legend{font-size:12px;color:var(--muted)}.legend b{color:var(--orange)}footer{margin-top:18px;font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:15px 12px}.panel{padding:14px}}@media print{body{background:white}.layout{display:block}#inputs,.actions,footer{display:none}.panel{border:0}.track,.segment{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<main><header><div class="eyebrow">RECORD SHELF PLANNER / 01</div><h1>盤棚 <small>BANTANA</small></h1><p>並び順はそのまま。増えるレコードの余白をつくる、最小移動の棚割り。</p><small>登録不要・端末内計算 / 実測幅で計画する</small></header>
<div class="layout"><section class="panel" id="inputs"><h2>01　棚とレコードを入力</h2><form id="form"><label for="caps">棚の有効幅（mm、カンマ区切り）</label><input id="caps" value="300,300,300" required><label for="reserve">各棚に残す余白（%）</label><input id="reserve" type="number" min="0" max="90" step="1" value="20" required><label for="groups">レコードのグループ（希望する並び順）</label><small>1行＝名前,枚数,合計実測幅mm,現在の棚番号。棚番号0は新規。グループは分割しません。最大120行・12棚。</small><textarea id="groups" spellcheck="false" required>A-C,24,120,1
D-F,20,100,1
G-J,12,60,1
K-M,20,100,2
N-Q,12,60,2
R-T,16,80,3
U-Z,20,100,3</textarea><div class="actions"><button type="submit">棚割りを計算</button><button type="button" class="alt" id="sample">サンプルに戻す</button></div></form><p class="muted">棚の幅は仕切り・安全な取り出し余裕を除いた値を入力。重量・耐荷重は別途確認してください。</p></section>
<section class="panel"><h2>02　推奨する棚割り</h2><div id="status" role="status" aria-live="polite"></div><div id="result"></div><div class="actions"><button id="csv" disabled>移動表 CSV</button><button class="alt" id="print" disabled>印刷</button></div></section></div><footer>最小移動は棚をまたぐ既存レコード枚数で評価。同じ棚内の並べ替え・作業順序・重量・将来の購入内容は計算外。データ送信・外部ライブラリなし。</footer></main>
<script id="core">
'use strict';
const Bantana=(()=>{
function integer(s,min,max){if(!/^\d+$/.test(String(s).trim()))throw Error('整数を入力してください');const n=Number(s);if(!Number.isSafeInteger(n)||n<min||n>max)throw Error(`${min}〜${max}の範囲で入力してください`);return n}
function parse(c,r,g){const caps=c.split(',').map(v=>integer(v,1,100000));if(caps.length>12)throw Error('棚は最大12個');const reserve=integer(r,0,90);const lines=g.trim().split(/\r?\n/).filter(v=>v.trim());if(!lines.length||lines.length>120)throw Error('1〜120グループを入力してください');const groups=lines.map((line,i)=>{const a=line.split(',').map(v=>v.trim());if(a.length!==4||!a[0]||a[0].length>80)throw Error(`${i+1}行目: 名前,枚数,幅,棚番号 を入力`);return {name:a[0],count:integer(a[1],1,100000),width:integer(a[2],1,100000),old:integer(a[3],0,caps.length)}});return {caps,reserve,groups}}
function solve(caps,groups,reserve){const n=groups.length,m=caps.length,limit=caps.map(c=>Math.floor(c*(100-reserve)/100)),w=[0];for(const g of groups)w.push(w.at(-1)+g.width);let prev=Array(n+1).fill(Infinity);prev[0]=0;const back=[];for(let s=0;s<m;s++){const cost=[0];for(const g of groups)cost.push(cost.at(-1)+(g.old&&g.old!==s+1?g.count:0));const next=Array(n+1).fill(Infinity),from=Array(n+1).fill(-1);for(let i=0;i<=n;i++){for(let j=i;j>=0&&w[i]-w[j]<=limit[s];j--){const v=prev[j]+cost[i]-cost[j];if(v<next[i]){next[i]=v;from[i]=j}}}prev=next;back.push(from)}if(!Number.isFinite(prev[n]))return null;let i=n;const shelves=Array(m),assignment=Array(n);for(let s=m-1;s>=0;s--){const j=back[s][i];shelves[s]={start:j,end:i,used:w[i]-w[j],limit:limit[s]};for(let k=j;k<i;k++)assignment[k]=s+1;i=j}return {moved:prev[n],shelves,assignment}}
function maxReserve(caps,groups){if(!solve(caps,groups,0))return null;let lo=0,hi=90;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(solve(caps,groups,mid))lo=mid;else hi=mid-1}return lo}
function csvCell(v){let s=String(v);if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(groups,plan){return [['グループ','枚数','実測幅mm','現棚','推奨棚','棚間移動枚数'],...groups.map((g,i)=>[g.name,g.count,g.width,g.old,plan.assignment[i],g.old&&g.old!==plan.assignment[i]?g.count:0])].map(r=>r.map(csvCell).join(',')).join('\r\n')}
return {parse,solve,maxReserve,csv};})();
</script>
<script>
const $=id=>document.getElementById(id),sample={caps:$('caps').value,reserve:$('reserve').value,groups:$('groups').value};let last=null;
function el(tag,content,cls){const e=document.createElement(tag);if(content!==undefined)e.textContent=content;if(cls)e.className=cls;return e}
function stats(items){const div=el('div',undefined,'stats');for(const [label,value] of items){const d=el('div',undefined,'stat');d.append(el('small',label),el('strong',value));div.append(d)}return div}
function render(){last=null;$('csv').disabled=$('print').disabled=true;$('result').replaceChildren();$('status').className='';try{const {caps,reserve,groups}=Bantana.parse($('caps').value,$('reserve').value,$('groups').value),plan=Bantana.solve(caps,groups,reserve),base=Bantana.solve(caps,groups,0),max=Bantana.maxReserve(caps,groups);const out=$('result');$('status').textContent=plan?'順序を維持した最小移動の計画です。':'指定した余白では収まりません。';if(!plan)$('status').className='error';out.append(stats([['移動する既存盤',plan?plan.moved+'枚':'—'],['確保可能な最大余白',max===null?'不可':max+'%'],['余白0%の最小移動',base?base.moved+'枚':'不可']]));if(!plan){out.append(el('p',max===null?'棚幅を増やすか、大きなグループを分割して再入力してください。':'余白を'+max+'%以下にすると計画を作成できます。'));return}out.append(el('p','緑：現棚のまま　橙：移動・新規　斜線：空き　縦線：余白境界','legend'));for(let s=0;s<caps.length;s++){const sh=plan.shelves[s],d=el('div',undefined,'shelf');d.append(el('strong',`棚 ${s+1}　${sh.used} / ${caps[s]} mm`),el('small',`　空き ${caps[s]-sh.used} mm`));const track=el('div',undefined,'track');for(let i=sh.start;i<sh.end;i++){const g=groups[i],b=el('div',g.name,'segment'+(g.old!==s+1?' move':''));b.style.width=(g.width/caps[s]*100)+'%';b.style.flexShrink='0';b.title=`${g.name}: ${g.count}枚 / ${g.width}mm`;track.append(b)}const lim=el('div',undefined,'limit');lim.style.left=`${Math.min(99.7,sh.limit/caps[s]*100)}%`;track.append(lim);d.append(track);out.append(d)}const scroll=el('div',undefined,'scroll'),table=el('table'),head=el('thead'),hr=el('tr');for(const h of ['グループ','枚数','現在 → 推奨','状態'])hr.append(el('th',h));head.append(hr);table.append(head);const body=el('tbody');groups.forEach((g,i)=>{const tr=el('tr');for(const v of [g.name,g.count,`${g.old||'新規'} → ${plan.assignment[i]}`,g.old===0?'新規':g.old===plan.assignment[i]?'維持':'移動'])tr.append(el('td',v));body.append(tr)});table.append(body);scroll.append(table);out.append(scroll);last={groups,plan};$('csv').disabled=$('print').disabled=false}catch(e){$('status').className='error';$('status').textContent=e.message}}
$('form').addEventListener('submit',e=>{e.preventDefault();render()});$('form').addEventListener('input',()=>{last=null;$('csv').disabled=$('print').disabled=true;$('result').replaceChildren();$('status').className='';$('status').textContent='入力が変更されました。再計算してください。'});$('sample').onclick=()=>{for(const k of Object.keys(sample))$(k).value=sample[k];render()};$('csv').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob(['\ufeff',Bantana.csv(last.groups,last.plan)],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download='bantana-plan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('print').onclick=()=>window.print();render();
</script></html>
