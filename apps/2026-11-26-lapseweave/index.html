<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時紡 / LapseWeave</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f0;color:#183d38;font:15px/1.6 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:24px 16px 48px}header{background:#183d38;color:#fff;padding:28px;border-radius:20px;margin-bottom:18px}h1{font-size:32px;margin:0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#526c67}header p{color:#d3e9df}.panel{background:white;border:1px solid #d2dfd9;border-radius:16px;padding:18px;margin:12px 0}.fields,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:600}input{width:100%;padding:9px;border:1px solid #a9bbb5;border-radius:8px;font:inherit;color:inherit;background:white}button{font:inherit;background:#176654;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}button.secondary{background:#e0eae6;color:#183d38}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.segment{display:grid;grid-template-columns:1.2fr repeat(4,1fr) auto;gap:8px;align-items:end;border-top:1px solid #e0e8e4;padding:10px 0}.stat{background:#f0f6f2;padding:12px;border-radius:10px}.stat b{display:block;font-size:24px}.bar{display:flex;height:32px;border-radius:7px;overflow:hidden;background:#e8eeea;margin:4px 0 14px}.bar span{min-width:0;overflow:hidden;white-space:nowrap;color:#fff;padding:4px;text-align:center}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{text-align:right;padding:9px;border-bottom:1px solid #e0e8e4}td:first-child,th:first-child{text-align:left}.warn{color:#9c3525;font-weight:700}#status{min-height:24px}@media(max-width:650px){main{padding:12px}.segment{grid-template-columns:repeat(2,minmax(0,1fr))}.segment label:first-child{grid-column:1/-1}header{padding:20px}h1{font-size:26px}}@media print{header{background:white;color:black}header p{color:black}.actions,#setup,#segments{display:none}}
</style><main><header><small style="color:#a9d5c5">FIELD NOTES / 01</small><h1>時紡 <span style="font-weight:400">LapseWeave</span></h1><p>変化の大きい時間帯に、より多くのフレームを。撮影区間ごとの時間配分を設計する。</p></header>
<section class="panel" id="setup"><h2>01 / 完成動画と撮影予算</h2><div class="fields"><label>目標フレーム数<input id="frames" type="number" min="1" max="10000" value="240"></label><label>再生 fps<input id="fps" type="number" min="1" max="120" value="24"></label><label>1枚の容量 (MB)<input id="size" type="number" min="0.1" step="0.1" value="25"></label><label>使用可能容量 (GB, 1000MB)<input id="storage" type="number" min="0.001" step="0.001" value="8"></label><label>撮影可能枚数（電池等）<input id="shots" type="number" min="1" max="10000" value="300"></label></div></section>
<section class="panel" id="segments"><h2>02 / 撮影区間</h2><p class="muted">最短間隔には露光・保存・操作の余裕を含める。最長間隔は許容する時間の飛び幅。希望間隔は優先したい画の密度。</p><div id="rows"></div><div class="actions"><button id="add" class="secondary">＋ 区間</button><button id="reset" class="secondary">サンプルに戻す</button><button id="run">配分を計算</button></div></section>
<section class="panel"><h2>03 / 撮影計画</h2><div id="status" role="status" aria-live="polite"></div><div id="result"></div><div class="actions"><button id="export" disabled>撮影計画 CSV</button><button id="print" class="secondary" disabled>印刷</button></div></section><p class="muted">通信・登録不要。実機制御は行いません。区間内は一定間隔、区間境界では速度が変化します。撮影可能枚数や書込時間は実測値で余裕を持たせてください。</p></main>
<script id="engine">
function plan(rows,target,budget){
 if(!Number.isInteger(target)||target<1||target>10000||!Number.isInteger(budget)||budget<0||!Array.isArray(rows)||!rows.length||rows.length>12)throw Error('入力範囲を確認してください。');
 const a=rows.map(r=>{const {duration,min,pref,max}=r;if(![duration,min,pref,max].every(Number.isFinite)||duration<1||duration>86400||min<0.1||min>pref||pref>max||max>86400)throw Error('区間の秒数・間隔を確認してください（最短≤希望≤最長）。');const lo=Math.max(1,Math.ceil(duration/max-1e-9)),hi=Math.min(10000,Math.floor(duration/min+1e-9)),ideal=duration/pref;return {...r,lo,hi,ideal,n:lo}});
 const low=a.reduce((s,r)=>s+r.lo,0),high=Math.min(10000,budget,a.reduce((s,r)=>s+r.hi,0));
 if(a.some(r=>r.lo>r.hi)||low>high)return {ok:false,low,high,reason:'区間条件または撮影予算が成立しません。'};
 if(target<low||target>high)return {ok:false,low,high,reason:'目標フレーム数が実現可能範囲外です。'};
 for(let k=low;k<target;k++){let best=-1,delta=Infinity;for(let i=0;i<a.length;i++){const r=a[i];if(r.n>=r.hi)continue;const d=(2*(r.n-r.ideal)+1)/r.ideal;if(d<delta){delta=d;best=i}}a[best].n++}
 return {ok:true,low,high,rows:a.map(r=>({...r,interval:r.duration/r.n})),cost:a.reduce((s,r)=>s+(r.n-r.ideal)**2/r.ideal,0)};
}
</script><script>
const $=id=>document.getElementById(id),colors=['#287b68','#a96943','#5b7298','#786396','#637e46','#9c5e74'];
const sample=[['雲の流れ',600,3,10,30],['夕焼け',300,1,2,6],['夜景',900,5,15,40]];let current=null;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function invalidate(){current=null;$('result').replaceChildren();$('status').textContent='入力変更後は再計算してください。';$('status').className='';$('export').disabled=$('print').disabled=true}
function addRow(values){if($('rows').children.length>=12)return;const row=el('div');row.className='segment';['区間名','長さ (秒)','最短 (秒)','希望 (秒)','最長 (秒)'].forEach((name,i)=>{const l=el('label',name),inp=el('input');inp.type=i?'number':'text';if(i)inp.step='any';else inp.maxLength=40;inp.value=values[i];l.append(inp);row.append(l)});const del=el('button','削除');del.className='secondary';del.onclick=()=>{if($('rows').children.length>1){row.remove();invalidate()}};row.append(del);$('rows').append(row);invalidate()}
function number(id){const v=$(id).value;if(v.trim()==='')throw Error('空欄を埋めてください。');return Number(v)}
function reset(){for(const [k,v] of Object.entries({frames:240,fps:24,size:25,storage:8,shots:300}))$(k).value=v;$('rows').replaceChildren();sample.forEach(addRow);run()}
function run(){invalidate();try{const target=number('frames'),fps=number('fps'),size=number('size'),storage=number('storage'),shots=number('shots');if(!Number.isInteger(fps)||fps<1||fps>120||!Number.isFinite(size)||size<.1||size>1000||!Number.isFinite(storage)||storage<.001||storage>10000||!Number.isInteger(shots)||shots<1||shots>10000)throw Error('撮影予算の入力範囲を確認してください。');const rows=[...$('rows').children].map((r,i)=>{const v=[...r.querySelectorAll('input')].map(x=>x.value);if(v.slice(1).some(x=>!x.trim()))throw Error('区間の空欄を埋めてください。');return {name:v[0].trim()||`区間${i+1}`,duration:+v[1],min:+v[2],pref:+v[3],max:+v[4]}});const budget=Math.min(shots,Math.floor(storage*1000/size+1e-9));const p=plan(rows,target,budget);if(!p.ok){$('status').className='warn';$('status').textContent=p.reason+' 最小 '+p.low+' / 上限 '+p.high+' 枚';return}current={p,target,fps,size};$('status').textContent=`実現可能範囲 ${p.low}–${p.high} 枚 / 予算 ${budget} 枚`;const result=$('result'),stats=el('div');stats.className='stats';for(const [label,value] of [['完成動画', (target/fps).toFixed(2)+' 秒'],['撮影枚数',target+' 枚'],['使用容量',(target*size/1000).toFixed(2)+' GB']]){const d=el('div',label);d.className='stat';d.append(el('b',value));stats.append(d)}result.append(stats);for(const [label,key] of [['実時間の割合','duration'],['動画時間の割合','n']]){result.append(el('p',label));const bar=el('div');bar.className='bar';const sum=p.rows.reduce((s,r)=>s+r[key],0);p.rows.forEach((r,i)=>{const s=el('span',r.name);s.style.width=100*r[key]/sum+'%';s.style.background=colors[i%colors.length];s.title=r.name+' '+(100*r[key]/sum).toFixed(1)+'%';bar.append(s)});result.append(bar)}const wrap=el('div');wrap.className='scroll';const table=el('table'),head=el('tr');['区間','枚数','間隔(s)','動画(s)','早送り倍率','希望枚数'].forEach(x=>head.append(el('th',x)));table.append(head);p.rows.forEach(r=>{const tr=el('tr');[r.name,r.n,r.interval.toFixed(3),(r.n/fps).toFixed(2),(r.interval*fps).toFixed(1),r.ideal.toFixed(1)].forEach(x=>tr.append(el('td',x)));table.append(tr)});wrap.append(table);result.append(wrap,el('p','間隔は表示上の丸め値です。CSVの撮影時刻は秒単位の小数で出力します。'));$('export').disabled=$('print').disabled=false}catch(e){$('status').className='warn';$('status').textContent=e.message}}
function csvCell(v){let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function csv(){if(!current)return;const out=[['frame','segment','start_seconds','interval_seconds']];let offset=0,k=1;for(const r of current.p.rows){for(let j=0;j<r.n;j++)out.push([k++,r.name,(offset+j*r.interval).toFixed(6),r.interval.toFixed(6)]);offset+=r.duration}const url=URL.createObjectURL(new Blob(['\ufeff'+out.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download='lapseweave.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('setup').addEventListener('input',invalidate);$('rows').addEventListener('input',invalidate);$('add').onclick=()=>addRow(['新規区間',300,1,5,30]);$('reset').onclick=reset;$('run').onclick=run;$('export').onclick=csv;$('print').onclick=()=>window.print();reset();
</script></html>
