<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>折章 / ORICHAPTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#253c36;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 18px}header{border-bottom:2px solid #254c40;margin-bottom:24px}h1{font:700 42px/1.2 Georgia,serif;margin:6px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0 16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}.panel{background:#fffdf7;border:1px solid #d8d3c6;border-radius:14px;padding:20px;min-width:0}label{display:block;font-weight:650;margin:12px 0 5px}textarea,input,select,button{font:inherit}textarea,input[type=number],select{width:100%;padding:8px;border:1px solid #aab6ad;border-radius:7px;background:#fff}textarea{height:180px;resize:vertical}button{background:#235746;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:700}button.secondary{background:#e6e9df;color:#234439}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.sizes{display:flex;flex-wrap:wrap;gap:12px}.sizes label{margin:0;font-weight:500}.small{font-size:13px;color:#52665e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#e9eee5;border-radius:8px;padding:10px;font-size:12px}.metric b{display:block;font-size:25px;line-height:1.2}.signature{border-top:1px solid #dad9cd;padding:12px 0}.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(29px,1fr));gap:3px;margin:8px 0}.page{font-size:12px;text-align:center;padding:5px 0;border:1px solid #b9c9bd;border-radius:3px;background:#e2ecdf}.blank{background:#f5dfc0;border-color:#e2be86}.cut{color:#a14e28}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px;text-align:left;border-bottom:1px solid #e6e1d5;white-space:nowrap}#status{min-height:1.6em;color:#a14e28}details{margin-top:8px}summary{cursor:pointer}footer{margin-top:20px;font-size:13px;color:#52665e}@media(max-width:750px){.layout{grid-template-columns:1fr}.panel{padding:14px}h1{font-size:34px}}@media print{body{background:white}.controls,.actions,footer{display:none}.layout{display:block}.panel{border:0}.signature{break-inside:avoid}details{display:none}}
</style><main><header><div class="small">BOOKBINDING / PLANNING LAB</div><h1>折章 <small style="font-size:.42em">ORICHAPTER</small></h1><p>章の切れ目を守る、手製本の折丁設計。</p></header><div class="layout"><section class="panel controls"><h2>01 / 原稿と製本条件</h2><label for="chapters">章データ（1行ずつ）</label><textarea id="chapters" spellcheck="false"></textarea><div class="small">章名 | ページ数 | 開始（任意 / 奇数 / 折丁） | 分割（可 / 禁止）<br>奇数＝本の物理的な奇数ページ側。右綴じでは左側です。表紙は含めません。</div><label>使用できる折丁ページ数</label><div class="sizes" id="sizes"></div><label for="penalty">章途中の折丁境界の負担点（白紙1頁＝1点）</label><input id="penalty" type="number" min="0" max="100" value="4"><label for="binding">綴じ方向（面付け表）</label><select id="binding"><option value="left">左綴じ</option><option value="right">右綴じ</option></select><div class="actions"><button id="run">折丁を計算</button><button class="secondary" id="reset">サンプル</button></div><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>02 / 設計結果</h2><div id="out" aria-live="polite">条件を入力して計算してください。</div><div class="actions"><button id="csv" disabled>面付けCSV</button><button id="print" class="secondary" disabled>計画を印刷</button></div></section></div><footer>原稿の並び替えは行いません。面付けは二つ折りの紙を入れ子にする形式のページ番号表です。PDF生成、紙厚・クリープ補正、プリンタ設定の検証は対象外。試し刷りして確認してください。入力は端末内でのみ処理します。</footer></main>
<script id="core">
function parse(raw){const rows=raw.trim().split(/\r?\n/).filter(s=>s.trim()).map((s,i)=>{const a=s.split('|').map(x=>x.trim());if(a.length!==4||!a[0]||!/^[1-9]\d*$/.test(a[1])||!['任意','奇数','折丁'].includes(a[2])||!['可','禁止'].includes(a[3]))throw Error(`${i+1}行目の形式を確認してください`);return {name:a[0],n:Number(a[1]),start:a[2],lock:a[3]==='禁止'}});if(!rows.length||rows.length>60||rows.reduce((s,r)=>s+r.n,0)>400)throw Error('1〜60章、合計400ページ以下にしてください');return rows}
function solve(rows,sizes,penalty){if(!sizes.length||sizes.some(x=>![4,8,12,16,20,24,28,32].includes(x))||!Number.isInteger(penalty)||penalty<0||penalty>100)throw Error('折丁サイズと負担点を確認してください');sizes=[...new Set(sizes)].sort((a,b)=>a-b);const src=rows.flatMap((r,c)=>Array.from({length:r.n},(_,j)=>({c,j,start:r.start,lock:r.lock}))),n=src.length,dp=Array(n+1).fill(null);dp[n]={cost:0,blank:0,cuts:0,count:0};const better=(a,b)=>!b||a.cost<b.cost||a.cost===b.cost&&(a.blank<b.blank||a.blank===b.blank&&a.count<b.count);for(let i=n-1;i>=0;i--){let pages=[];for(let j=i;j<n;j++){const p=src[j];if(p.j===0&&p.start==='折丁'&&pages.length)break;if(p.j===0&&p.start==='奇数'&&pages.length%2)pages.push(null);pages.push(j+1);if(pages.length>sizes.at(-1))break;const next=j+1,cut=next<n&&src[next].j!==0;if(cut&&src[next].lock||!dp[next])continue;for(const size of sizes){if(size<pages.length)continue;const list=pages.concat(Array(size-pages.length).fill(null)),blank=size-(next-i),tail=dp[next],a={cost:blank+penalty*Number(cut)+tail.cost,blank:blank+tail.blank,cuts:Number(cut)+tail.cuts,count:1+tail.count,next,list};if(better(a,dp[i]))dp[i]=a}}}if(!dp[0])return null;const sig=[];for(let i=0;i<n;i=dp[i].next)sig.push(dp[i].list);return {...dp[0],sig,src}}
function impose(pages,right=false){const n=pages.length;return Array.from({length:n/4},(_,i)=>{const f=[pages[n-1-2*i],pages[2*i]],b=[pages[2*i+1],pages[n-2-2*i]];return right?[f.reverse(),b.reverse()]:[f,b]})}
function csvText(plan,right){const lines=['signature,sheet,side,left_source,right_source'];plan.sig.forEach((p,i)=>impose(p,right).forEach((s,j)=>s.forEach((pair,k)=>lines.push([i+1,j+1,k?'back':'front',...pair.map(x=>x??'blank')].join(',')))));return lines.join('\r\n')+'\r\n'}
</script><script>
const $=id=>document.getElementById(id),sample='序章 | 5 | 奇数 | 禁止\n第一章 | 7 | 奇数 | 禁止\n図版 | 4 | 折丁 | 禁止\n第二章 | 11 | 奇数 | 可\nあとがき | 3 | 任意 | 禁止';let plan=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('sizes').innerHTML=[4,8,12,16,20,24,28,32].map(n=>`<label><input type="checkbox" value="${n}" ${[8,12,16].includes(n)?'checked':''}>${n}頁</label>`).join('');function invalidate() {plan=null;$('csv').disabled=$('print').disabled=true;$('out').textContent='条件が変更されました。再計算してください。';$('status').textContent=''}function reset(){$('chapters').value=sample;$('penalty').value=4;$('binding').value='left';document.querySelectorAll('#sizes input').forEach(x=>x.checked=[8,12,16].includes(+x.value));run()}function run(){invalidate();try{const rows=parse($('chapters').value),sizes=[...document.querySelectorAll('#sizes input:checked')].map(x=>+x.value),p=$('penalty').value;if(p==='')throw Error('負担点を入力してください');plan=solve(rows,sizes,+p);if(!plan)throw Error('条件を満たす折丁はありません。サイズを増やすか分割禁止を見直してください。');const right=$('binding').value==='right';let h=`<div class="metrics"><div class="metric">白紙<b>${plan.blank}頁</b></div><div class="metric">章途中の境界<b>${plan.cuts}回</b></div><div class="metric">折丁数<b>${plan.count}組</b></div></div><p class="small">原稿${plan.src.length}頁 / 印刷${plan.src.length+plan.blank}頁 / 評価${plan.cost}点（最小）<br>数字は元原稿のページ番号、橙色は白紙。</p>`;let offset=0;plan.sig.forEach((pages,i)=>{const first=pages.find(x=>x!==null),last=pages.filter(x=>x!==null).at(-1);h+=`<div class="signature"><b>折丁 ${i+1} · ${pages.length}頁</b> <span class="small">原稿 ${first}–${last} / 本 ${offset+1}–${offset+pages.length}</span><div class="pages">${pages.map(x=>`<span class="page ${x===null?'blank':''}" title="${x===null?'白紙':esc(rows[plan.src[x-1].c].name)}">${x??'—'}</span>`).join('')}</div><div class="small">${[...new Set(pages.filter(x=>x!==null).map(x=>rows[plan.src[x-1].c].name))].map(esc).join(' / ')}</div><details><summary>面付け表（外側の紙から）</summary><div class="scroll"><table><thead><tr><th>紙</th><th>表 左｜右</th><th>裏 左｜右</th></tr></thead><tbody>${impose(pages,right).map((s,j)=>`<tr><td>${j+1}</td>${s.map(a=>`<td>${a.map(x=>x??'白紙').join(' ｜ ')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`;offset+=pages.length});$('out').innerHTML=h;$('csv').disabled=$('print').disabled=false;$('status').textContent='計算完了'}catch(e){plan=null;$('out').textContent='結果なし';$('status').textContent=e.message}}$('chapters').addEventListener('input',invalidate);$('penalty').addEventListener('input',invalidate);$('sizes').addEventListener('change',invalidate);$('binding').addEventListener('change',invalidate);$('run').onclick=run;$('reset').onclick=reset;$('print').onclick=()=>window.print();$('csv').onclick=()=>{if(!plan)return;const url=URL.createObjectURL(new Blob([csvText(plan,$('binding').value==='right')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='orichapter-imposition.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};reset();
</script></html>
