<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現組 / GENKUMI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b1b;color:#e6e4d9;font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px 16px 50px}header{border-bottom:1px solid #45504b;margin-bottom:24px;padding-bottom:18px}h1{font-size:36px;line-height:1.2;margin:5px 0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#b1b9ad}header small{letter-spacing:3px;color:#e5aa72}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:#222928;border:1px solid #424c46;border-radius:12px;padding:18px;min-width:0}label{display:block;margin:8px 0}input,textarea,button{font:inherit;color:inherit;border:1px solid #59665d;background:#141a18;border-radius:6px;padding:9px}input{width:100%}textarea{width:100%;resize:vertical;font-family:monospace;min-height:185px}button{cursor:pointer;background:#35493f;margin:5px 5px 5px 0}button.primary{background:#edb27a;color:#201a15;font-weight:700;border-color:#edb27a}button:disabled{opacity:.45;cursor:default}.pair,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#141a18;border-radius:8px;padding:12px}.metric strong{display:block;font-size:28px;color:#edb27a}.batch{margin:12px 0;padding:12px;background:#171e1b;border-radius:8px}.slots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.roll{border:1px solid #638675;border-radius:4px;background:#345646;padding:4px 8px;overflow-wrap:anywhere}.urgent{border-color:#edb27a;color:#ffdcaf}.empty{border:1px dashed #687369;color:#b1b9ad;padding:4px 8px;border-radius:4px}.error{color:#ffc0a8}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:720px){.layout{grid-template-columns:1fr}h1{font-size:30px}}@media print{body{background:white;color:black}section,.batch,.metric{background:white;color:black;border:1px solid #aaa}button,.inputs{display:none}.metric strong,.muted,small,.roll,.empty{color:black}.layout{display:block}}
</style><main><header><small>DARKROOM / SESSION PLANNER</small><h1>現組 <span class="muted">GENKUMI</span></h1><p>限られた現像回数で、優先ロールを先に、できるだけ多くまとめる。</p></header><div class="layout"><section class="inputs"><h2>01 / セッション条件</h2><div class="pair"><label>タンク容量（単位）<input id="cap" type="number" min="1" max="30" value="4"></label><label>今回の最大回数<input id="limit" type="number" min="0" max="12" value="2"></label></div><label for="rows">ロール一覧（最大12本）</label><p class="muted">1行に ID, 同時処理グループ, 占有単位, 優先(0/1)。IDとグループは英数字・ハイフンのみ。グループは実機で同時処理が確認済みの条件に限定。</p><textarea id="rows" spellcheck="false" aria-label="ロール一覧"></textarea><p><button id="run" class="primary">最適計画を計算</button><button id="sample">サンプルに戻す</button></p><p class="muted">容量単位は仮想の加算モデルです。実際のリール構成、薬品量、時間、温度、適合性は判定しません。サンプルは架空条件です。</p></section><section><h2>02 / 計画結果</h2><div id="out" aria-live="polite"></div><button id="csv" disabled>CSV出力</button><button id="print" onclick="window.print()">印刷</button></section></div></main>
<script id="engine">
function parse(raw,cap,limit){
 if(!Number.isInteger(cap)||cap<1||cap>30||!Number.isInteger(limit)||limit<0||limit>12)throw Error('容量1〜30、回数0〜12の整数を入力してください。');
 const lines=raw.trim()?raw.trim().split(/\r?\n/):[];
 if(lines.length<1||lines.length>12)throw Error('1〜12行を入力してください。');
 const seen=new Set();return lines.map((line,i)=>{const [id,g,u,p,...rest]=line.split(',').map(x=>x.trim());if(rest.length||!/^[A-Za-z0-9-]{1,24}$/.test(id||'')||!/^[A-Za-z0-9-]{1,24}$/.test(g||'')||!/^\d+$/.test(u||'')||+u<1||+u>30||!['0','1'].includes(p)||seen.has(id))throw Error((i+1)+'行目：形式・数値・ID重複を確認してください。');seen.add(id);return {id,g,u:+u,p:+p};});
}
function solve(r,cap,limit){
 const N=1<<r.length,full=N-1,units=new Int16Array(N),count=new Uint8Array(N),priority=new Uint8Array(N),valid=new Uint8Array(N),groups=Array(N).fill(null),dp=new Uint8Array(N).fill(255),pick=new Int32Array(N);dp[0]=0;
 for(let m=1;m<N;m++){const bit=m&-m,i=31-Math.clz32(bit),prev=m^bit;units[m]=units[prev]+r[i].u;count[m]=count[prev]+1;priority[m]=priority[prev]+r[i].p;groups[m]=prev===0?r[i].g:groups[prev]===r[i].g?r[i].g:null;valid[m]=+(groups[m]!==null&&units[m]<=cap);}
 let best=0;for(let m=1;m<N;m++){const first=m&-m;for(let s=m;s;s=(s-1)&m){if((s&first)&&valid[s]&&dp[m^s]+1<dp[m]){dp[m]=dp[m^s]+1;pick[m]=s;}}if(dp[m]<=limit&&(priority[m]>priority[best]||priority[m]===priority[best]&&(count[m]>count[best]||count[m]===count[best]&&dp[m]<dp[best])))best=m;}
 const unpack=m=>r.filter((_,i)=>m&(1<<i));const batches=[];for(let m=best;m;m^=pick[m])batches.push(unpack(pick[m]));batches.sort((a,b)=>b.reduce((s,x)=>s+x.p,0)-a.reduce((s,x)=>s+x.p,0));
 const fifo=[];let cur=null;for(const x of r){if(x.u>cap)continue;if(!cur||cur[0].g!==x.g||cur.reduce((s,y)=>s+y.u,0)+x.u>cap){if(fifo.length===limit)break;cur=[];fifo.push(cur);}cur.push(x);}
 return {batches,fifo,left:unpack(full^best),count:count[best],priority:priority[best],allMin:dp[full]===255?null:dp[full]};
}
function csvText(plan){return 'batch,id,group,units,priority\n'+[...plan.batches.flatMap((b,i)=>b.map(x=>[i+1,x.id,x.g,x.u,x.p])),...plan.left.map(x=>['pending',x.id,x.g,x.u,x.p])].map(a=>a.map(v=>typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:v).join(',')).join('\n')+'\n';}
</script><script>
const $=id=>document.getElementById(id),demo='R01,A,1,0\nR02,B,1,0\nR03,A,1,1\nR04,B,1,0\nR05,A,2,0\nR06,B,2,1';let last=null;
function draw(){last=null;$('csv').disabled=true;try{if(!$('cap').value.trim()||!$('limit').value.trim())throw Error('容量と回数を入力してください。');const cap=+$('cap').value,limit=+$('limit').value,r=parse($('rows').value,cap,limit),p=solve(r,cap,limit),f=p.fifo.flat();last=p;const batch=(b,i)=>'<div class="batch"><b>回 '+(i+1)+' · '+b[0].g+'</b> <small>'+b.reduce((s,x)=>s+x.u,0)+' / '+cap+' 単位</small><div class="slots">'+b.map(x=>'<span class="roll '+(x.p?'urgent':'')+'">'+x.id+' ×'+x.u+(x.p?' ★':'')+'</span>').join('')+(cap>b.reduce((s,x)=>s+x.u,0)?'<span class="empty">空き '+(cap-b.reduce((s,x)=>s+x.u,0))+'</span>':'')+'</div></div>';$('out').innerHTML='<div class="metrics"><div class="metric"><small>入力順・連続まとめ</small><strong>'+f.length+' 本</strong>優先 '+f.reduce((s,x)=>s+x.p,0)+' 本</div><div class="metric"><small>最適計画</small><strong id="done">'+p.count+' 本</strong>優先 '+p.priority+' 本</div></div><p>使用 '+p.batches.length+' / '+limit+' 回 · 全ロールの最少回数 '+(p.allMin===null?'収容不能あり':p.allMin+' 回')+'</p><h2>推奨バッチ</h2>'+ (p.batches.map(batch).join('')||'<p>今回の処理なし</p>')+'<p><b>保留：</b> '+(p.left.map(x=>x.id+(x.p?' ★':'')+(x.u>cap?'（容量超過）':'')).join(' / ')||'なし')+'</p><details><summary>入力順の比較計画</summary>'+ (p.fifo.map(batch).join('')||'<p>処理なし</p>')+'</details><small>優先本数 → 総本数 → 少ない回数の順で最適化。入力順比較は容量超過を飛ばし、連続した同グループだけをまとめます。</small>';$('csv').disabled=false;}catch(e){$('out').textContent=e.message;$('out').classList.add('error');return;}$('out').classList.remove('error');}
function reset(){$('rows').value=demo;$('cap').value=4;$('limit').value=2;draw();} $('run').onclick=draw;$('sample').onclick=reset;for(const id of ['rows','cap','limit'])$(id).addEventListener('input',()=>{last=null;$('csv').disabled=true;$('out').textContent='条件が変更されました。再計算してください。';});$('csv').onclick=()=>{if(!last)return;const u=URL.createObjectURL(new Blob([csvText(last)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='genkumi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};reset();
</script></html>
