<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcousticPair | 共通観測時間</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ec;color:#19352d;font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}header{background:#173c32;color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}h1{font-size:clamp(27px,5vw,42px);margin:0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}small{color:#51675e}.layout{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}section{background:#fff;border:1px solid #cddbd1;border-radius:14px;padding:18px;min-width:0}label{display:block;font-weight:600;margin:12px 0 4px}input,textarea,button{font:inherit;border:1px solid #9eafa6;border-radius:7px;padding:9px}input,textarea{width:100%;background:#fcfdfa;color:inherit}textarea{min-height:190px;resize:vertical;font:14px/1.6 ui-monospace,monospace}button{cursor:pointer;background:#235e4b;color:white;font-weight:600;margin:8px 5px 0 0}button.alt{background:#fff;color:#235e4b}button:disabled{opacity:.45;cursor:default}.fields,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics div{background:#edf4ef;padding:12px;border-radius:10px}.metrics strong{display:block;font-size:25px;overflow-wrap:anywhere}.scroll{overflow:auto;max-height:300px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #dce5df;padding:6px;white-space:nowrap}th{background:#f2f6f3}svg{width:100%;height:auto;display:block}.warn{color:#a63d22;font-weight:600}.muted{color:#51675e}#error{white-space:pre-wrap}footer{margin-top:16px;color:#51675e} @media(max-width:720px){main{padding:12px}.layout{grid-template-columns:1fr}section{padding:14px}header{padding:18px}}@media print{body{background:white}main{padding:0}.layout{display:block}button,#inputs,footer{display:none}.scroll{max-height:none}}
</style><main><header><small style="color:#c2e1d0">FIELD DATA / QA</small><h1>AcousticPair</h1><p>共通観測時間 — Equal-time recording audit</p><p>録音済みの区間から、複数地点で同時に観測できた時間だけを抽出。</p></header><div class="layout"><section id="inputs"><h2>01 / 観測条件</h2><div class="fields"><div><label for="stations">地点数 (A〜L)</label><input id="stations" type="number" min="2" max="12" value="3"></div><div><label for="window">観測予定時間（秒）</label><input id="window" type="number" min="1" max="604800" value="3600"></div></div><label for="minimum">共通区間の最小連続秒数</label><input id="minimum" type="number" min="1" max="604800" value="300"><label for="data">録音済み区間（CSV）</label><small>1行 = 地点ID, 開始秒, 終了秒。全地点で共通の時刻原点を使用。予定範囲外は切り詰め、重複・隣接区間は統合します。録音がない地点も地点数に含めます。</small><textarea id="data" spellcheck="false"></textarea><button id="run">検査する / Audit</button><button class="alt" id="sample">サンプル</button><p id="error" class="warn" role="alert"></p></section><section><h2>02 / 同時観測の検査結果</h2><div id="result" aria-live="polite"></div><button id="export" disabled>共通区間 CSV</button><button id="json" disabled class="alt">JSON 報告書</button><button id="print" class="alt">印刷</button></section></div><footer>音声・位置情報・個人情報の入力不要。外部通信なし。時刻の同期、録音内容・検出率・調査設計の妥当性は別途確認してください。</footer></main>
<script id="core">
'use strict';
const integer=(x,min,max)=>Number.isSafeInteger(x)&&x>=min&&x<=max;
function merge(a){const out=[];for(const [s,e] of a.slice().sort((x,y)=>x[0]-y[0]||x[1]-y[1])){const last=out.at(-1);if(last&&s<=last[1])last[1]=Math.max(last[1],e);else out.push([s,e]);}return out;}
function intersect(a,b){const out=[];let i=0,j=0;while(i<a.length&&j<b.length){const s=Math.max(a[i][0],b[j][0]),e=Math.min(a[i][1],b[j][1]);if(s<e)out.push([s,e]);if(a[i][1]<=b[j][1])i++;else j++;}return out;}
const duration=a=>a.reduce((sum,[s,e])=>sum+e-s,0);
function analyze(n,w,min,raw){if(!integer(n,2,12)||!integer(w,1,604800)||!integer(min,1,w))throw Error('地点数・予定時間・最小秒数を確認してください。');const ids=Array.from({length:n},(_,i)=>String.fromCharCode(65+i));const groups=ids.map(()=>[]);let count=0;for(const [i,line] of raw.split(/\r?\n/).entries()){if(!line.trim()||line.trim()==='station,start,end')continue;if(++count>20000)throw Error('最大20,000行です。');const p=line.split(',').map(x=>x.trim());const k=ids.indexOf(p[0]),s=Number(p[1]),e=Number(p[2]);if(p.length!==3||k<0||!p.slice(1).every(x=>/^-?\d+$/.test(x))||!Number.isSafeInteger(s)||!Number.isSafeInteger(e)||s>=e)throw Error('CSV '+(i+1)+'行目が不正です。');if(Math.max(s,0)<Math.min(e,w))groups[k].push([Math.max(s,0),Math.min(e,w)]);}
const intervals=groups.map(merge),common=intervals.reduce(intersect),usable=common.filter(([s,e])=>e-s>=min),pairs=ids.flatMap((a,i)=>ids.slice(i+1).map((b,j)=>({a,b,seconds:duration(intersect(intervals[i],intervals[i+j+1]))})));return {window:w,minimum:min,stations:ids.map((id,i)=>({id,intervals:intervals[i],seconds:duration(intervals[i])})),common,usable,commonSeconds:duration(common),usableSeconds:duration(usable),pairs};}
</script><script>
const $=id=>document.getElementById(id);let current=null;const sample='station,start,end\nA,0,1200\nA,1500,3600\nB,0,1800\nB,2100,3600\nC,300,900\nC,1000,2400\nC,2700,3600';
const sec=x=>x.toLocaleString('ja-JP')+' 秒';const pct=(x,w)=>(100*x/w).toFixed(1)+'%';
function invalidate(){current=null;$('export').disabled=$('json').disabled=true;$('result').textContent='入力を検査してください。';$('error').textContent='';}
function run(){invalidate();try{const read=id=>$(id).value.trim()===''?NaN:Number($(id).value);current=analyze(read('stations'),read('window'),read('minimum'),$('data').value);render(current);$('export').disabled=$('json').disabled=false;}catch(e){$('error').textContent=e.message;}}
function render(r){const tracks=[...r.stations.map(s=>[s.id,s.intervals,'#7b9b85']),['ALL',r.common,'#bf8848'],['USE',r.usable,'#22634c']];const timeline='<svg viewBox="0 0 520 '+(tracks.length*25+26)+'" role="img" aria-label="各地点と共通区間のタイムライン">'+tracks.map(([id,a,c],i)=>'<text x="0" y="'+(i*25+16)+'" font-size="12" fill="#19352d">'+id+'</text><rect x="40" y="'+(i*25+3)+'" width="475" height="17" rx="3" fill="#e8eee9"/>'+a.map(([s,e])=>'<rect x="'+(40+475*s/r.window)+'" y="'+(i*25+3)+'" width="'+475*(e-s)/r.window+'" height="17" fill="'+c+'"/>').join('')).join('')+'<text x="40" y="'+(tracks.length*25+15)+'" font-size="11">0</text><text x="515" y="'+(tracks.length*25+15)+'" text-anchor="end" font-size="11">'+r.window+' s</text></svg>';
const table=(headers,rows)=>'<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
$('result').innerHTML='<div class="metrics"><div>全地点共通<strong>'+sec(r.commonSeconds)+'</strong>'+pct(r.commonSeconds,r.window)+'</div><div>最小長を満たす<strong>'+sec(r.usableSeconds)+'</strong>'+pct(r.usableSeconds,r.window)+'</div></div><p class="muted">ALL: 全地点共通 / USE: 最小長を満たす区間</p>'+timeline+'<h2>地点ごとの録音率</h2>'+table(['地点','録音','予定内の未録音','共通採用率*'],r.stations.map(s=>[s.id,sec(s.seconds),sec(r.window-s.seconds),s.seconds?pct(r.usableSeconds,s.seconds):'—']))+'<small>* 各地点の録音時間に占める USE の割合。</small><h2 style="margin-top:16px">地点ペアの同時録音</h2>'+table(['ペア','共通秒','予定比'],r.pairs.map(p=>[p.a+' / '+p.b,sec(p.seconds),pct(p.seconds,r.window)]))+'<h2 style="margin-top:16px">採用する共通区間</h2>'+(r.usable.length?table(['開始秒','終了秒','連続秒'],r.usable.map(([s,e])=>[s,e,e-s])):'<p class="warn">採用条件を満たす共通区間がありません。</p>');}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('run').onclick=run;$('sample').onclick=()=>{$('stations').value=3;$('window').value=3600;$('minimum').value=300;$('data').value=sample;run();};for(const id of ['stations','window','minimum','data'])$(id).addEventListener('input',invalidate);$('export').onclick=()=>{if(current)download('common-intervals.csv','start,end,duration\n'+current.usable.map(([s,e])=>[s,e,e-s].join(',')).join('\n')+'\n','text/csv;charset=utf-8');};$('json').onclick=()=>{if(current)download('acousticpair.json',JSON.stringify(current,null,2),'application/json');};$('print').onclick=()=>window.print();$('sample').click();
</script></html>
