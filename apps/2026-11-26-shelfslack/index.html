<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棚余白 / ShelfSlack</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3ed;color:#203b35;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #b8c8bb;margin-bottom:20px}h1{font-size:clamp(30px,5vw,48px);margin:8px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0 16px}.eyebrow{letter-spacing:.15em;font-size:12px;font-weight:700;color:#53766b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #cbd6cd;border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}textarea{width:100%;min-height:174px;resize:vertical;border:1px solid #aabbb1;border-radius:8px;padding:12px;font:14px/1.5 monospace;color:#203b35;background:#fafbf8}button{border:1px solid #235747;border-radius:8px;padding:10px 16px;background:#235747;color:white;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:white;color:#235747}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#52685f;font-size:13px}.error{color:#a23d22;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#eef4ed;border-radius:8px;padding:12px}.metric strong{display:block;font-size:26px}.shelf{margin:14px 0}.bar{display:flex;height:28px;border:1px solid #b7c4bb;border-radius:5px;overflow:hidden;background:#f5f6f1}.block{background:#608b78;color:white;overflow:hidden;text-align:center;font-size:12px;white-space:nowrap;border-right:1px solid white}.moved{background:#b36632}.fresh{background:#426e9b}.reserve{margin-left:auto;background:repeating-linear-gradient(135deg,#d9ded4,#d9ded4 5px,#f5f6f1 5px,#f5f6f1 10px)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #dce3da;white-space:nowrap}th{background:#eef4ed}footer{font-size:13px;color:#52685f}@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}.metric strong{font-size:20px}.metric{padding:8px}}@media print{.inputs,.actions,footer{display:none}body{background:white}.panel{break-inside:avoid}}
</style><main><header><div class="eyebrow">ORDERED COLLECTION PLANNER / 01</div><h1>棚余白 <small style="font-size:.45em">ShelfSlack</small></h1><p>並び順と各棚の余白を守りながら、棚をまたぐ既存資料の幅を最小化。</p></header>
<section class="grid inputs"><div class="panel"><h2>01 / 書架（mm）</h2><label for="shelves">1行に棚幅, 確保する余白（棚順）</label><textarea id="shelves" spellcheck="false"></textarea><div class="muted">最大40棚。余白は棚ごとに指定可能。</div></div><div class="panel"><h2>02 / 資料ブロック</h2><label for="books">1行にラベル, 幅mm, 現在の棚番号</label><textarea id="books" spellcheck="false"></textarea><div class="muted">最大120ブロック。並べたい順番で入力。新規資料は棚番号0。ブロックは分割しません。</div></div></section>
<div class="actions"><button id="run">最小移動を計算</button><button class="secondary" id="reset">サンプル</button><button class="secondary" id="save" disabled>JSON保存</button><button class="secondary" id="print" disabled>印刷</button></div><p id="status" role="status" aria-live="polite"></p><section id="result" class="panel" hidden><h2>03 / 再配架計画</h2><div id="metrics" class="metrics"></div><p class="muted">緑：同じ棚　橙：棚をまたぐ移動　青：新規　斜線：必須余白（右端）</p><div id="diagram"></div><div class="scroll"><table><thead><tr><th>ブロック</th><th>幅mm</th><th>現棚</th><th>新棚</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>計画用の一次元モデル。棚内の移動・重量・高さ・作業順・仮置き場所は評価しません。入力はブラウザ内のみで処理します。</footer></main>
<script>
'use strict';
function parse(s,b){const lines=t=>t.trim().split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split(',').map(y=>y.trim()));const int=(x,min,max)=>{if(!/^\d+$/.test(x||'')||+x<min||+x>max)throw Error('整数または範囲を確認してください: '+x);return +x};const ss=lines(s),bb=lines(b);if(!ss.length||ss.length>40||!bb.length||bb.length>120)throw Error('棚1〜40、資料1〜120件で入力してください');const shelves=ss.map(r=>{if(r.length!==2)throw Error('棚は 幅,余白 の2列です');const width=int(r[0],1,100000),reserve=int(r[1],0,width);return {width,reserve,cap:width-reserve}});const ids=new Set();const books=bb.map(r=>{if(r.length!==3||!r[0]||r[0].length>80||ids.has(r[0]))throw Error('資料は重複のないラベル,幅,棚番号の3列です');ids.add(r[0]);return {id:r[0],w:int(r[1],1,100000),old:int(r[2],0,shelves.length)}});return {shelves,books}}
function solve(s,b){const n=b.length,m=s.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(Infinity)),prev=Array.from({length:m+1},()=>Array(n+1).fill(-1));dp[0][0]=0;for(let j=0;j<m;j++)for(let i=0;i<=n;i++){if(!Number.isFinite(dp[j][i]))continue;let w=0,c=0;for(let k=i;k<=n;k++){if(k>i){const x=b[k-1];w+=x.w;if(x.old&&x.old!==j+1)c+=x.w*(n+1)+1}if(w>s[j].cap)break;const v=dp[j][i]+c;if(v<dp[j+1][k]){dp[j+1][k]=v;prev[j+1][k]=i}}}if(!Number.isFinite(dp[m][n]))return null;const a=Array(n);let k=n;for(let j=m;j>0;j--){const i=prev[j][k];for(let l=i;l<k;l++)a[l]=j;k=i}return {a,...cost(b,a)}}
function cost(b,a){let width=0,count=0;b.forEach((x,i)=>{if(x.old&&x.old!==a[i]){width+=x.w;count++}});return {width,count}}
function greedy(s,b){let j=0,w=0;const a=[];for(const x of b){while(j<s.length&&w+x.w>s[j].cap){j++;w=0}if(j===s.length)return null;a.push(j+1);w+=x.w}return {a,...cost(b,a)}}
const sampleS='900,150\n900,150\n900,150\n900,150',sampleB='A,300,1\nB,250,1\nC,120,0\nD,300,2\nE,300,2\nF,150,3\nG,350,3\nH,300,4\nI,300,4';
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id);let data=null;function clear(){data=null;$('result').hidden=true;$('save').disabled=$('print').disabled=true;$('status').textContent=''}function el(tag,t,cls){const e=document.createElement(tag);if(t!==undefined)e.textContent=t;if(cls)e.className=cls;return e}function render(){clear();try{const {shelves:s,books:b}=parse($('shelves').value,$('books').value),p=solve(s,b),g=greedy(s,b);if(!p)throw Error('順序と余白を守る配置は存在しません。余白・棚数・ブロック幅を見直してください。');data={shelves:s,books:b,optimal:p,greedy:g};$('metrics').replaceChildren(...[['最小移動幅',p.width+' mm'],['移動ブロック',p.count+' 件'],['左詰めとの差',g.width-p.width+' mm']].map(([k,v])=>{const e=el('div',undefined,'metric');e.append(el('span',k,'muted'),el('strong',v));return e}));$('diagram').replaceChildren();s.forEach((x,j)=>{const indices=b.map((_,i)=>i).filter(i=>p.a[i]===j+1),used=indices.reduce((t,i)=>t+b[i].w,0),wrap=el('div',undefined,'shelf'),bar=el('div',undefined,'bar');wrap.append(el('div','棚 '+(j+1)+' | 使用 '+used+' / '+x.width+' mm | 空き '+(x.width-used)+' mm','muted'),bar);indices.forEach(i=>{const q=b[i],e=el('div',q.id,'block '+(!q.old?'fresh':q.old!==j+1?'moved':''));e.style.width=q.w/x.width*100+'%';e.title=q.id+' '+q.w+' mm';bar.append(e)});const r=el('div',undefined,'reserve');r.style.width=x.reserve/x.width*100+'%';bar.append(r);$('diagram').append(wrap)});$('rows').replaceChildren(...b.map((x,i)=>{const tr=el('tr');[x.id,x.w,x.old||'新規',p.a[i]].forEach(v=>tr.append(el('td',v)));return tr}));$('result').hidden=false;$('save').disabled=$('print').disabled=false;$('status').className='';$('status').textContent='計算完了。左詰め基準の移動幅 '+g.width+' mm。'}catch(e){$('status').className='error';$('status').textContent=e.message}}function reset(){$('shelves').value=sampleS;$('books').value=sampleB;render()}$('run').onclick=render;$('reset').onclick=reset;$('print').onclick=()=>window.print();$('save').onclick=()=>{if(!data)return;const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='shelfslack-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};['shelves','books'].forEach(id=>$(id).addEventListener('input',clear));reset();}
if(typeof module!=='undefined')module.exports={parse,solve,cost,greedy,sampleS,sampleB};
</script></html>
