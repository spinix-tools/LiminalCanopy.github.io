<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>譜返し / FUMEKAESHI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f0e8;color:#253b37;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px 16px 48px}header{border-bottom:2px solid #253b37;margin-bottom:24px;padding-bottom:14px}small,.muted{color:#53675f}h1{font-size:clamp(28px,6vw,48px);line-height:1.1;margin:10px 0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}section{background:#fffdf6;border:1px solid #d0d7c9;border-radius:15px;padding:20px;margin:16px 0}label{display:block;font-weight:700;margin:8px 0}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #88988a;border-radius:7px;padding:10px;background:white;color:#253b37}textarea{min-height:84px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:1px solid #315b4e;border-radius:8px;padding:9px 16px;background:#315b4e;color:white;cursor:pointer}button.alt{background:transparent;color:#315b4e}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bd8b37;outline-offset:2px}.metric{padding:14px;background:#e9eee3;border-radius:9px}.metric strong{display:block;font-size:28px}.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 18px}.spread{display:inline-flex;gap:3px;border:1px solid #9cae99;padding:5px;border-radius:6px;background:#eef2e9}.sheet{display:inline-grid;place-items:center;min-width:36px;height:48px;border:1px solid #a8b5a1;background:repeating-linear-gradient(#fffdf6 0 8px,#dce1d4 8px 9px);font-weight:800}.turn{font-size:12px;font-weight:700;color:#24664c}.bad{color:#9b3928}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #dce1d4;white-space:nowrap}#error{color:#9b3928;font-weight:700}footer{font-size:13px;color:#53675f}@media print{body{background:white}#settings,.actions,footer{display:none}section{break-inside:avoid;border:none}main{padding:0}}
</style><main><header><small>PERFORMANCE LAB / 01</small><h1>譜返し <small>FUMEKAESHI</small></h1><p>いまある紙の楽譜を、めくれる場所で並べ直す。</p></header>
<section id="settings"><h2>01 / 演奏条件</h2><p class="muted">ページ境界ごとに、譜面を交換できる連続時間（秒）を入力。数値が7個なら8ページです。小数第1位まで、0は交換できない箇所。各ページの楽譜内容は変更しません。</p><label for="gaps">各ページ直後の交換可能時間（空白・改行・カンマ区切り）</label><textarea id="gaps" spellcheck="false">0.4 0.2 3 0.1 3 0.2 0.4</textarea><div class="grid"><div><label for="need">必要な交換時間（秒）</label><input id="need" type="number" min="0.1" max="60" step="0.1" value="2"></div><div><label for="budget">3面展開の使用上限（組）</label><input id="budget" type="number" min="0" max="20" step="1" value="2"></div></div><div class="actions"><button id="run">配置を計算</button><button class="alt" id="reset">サンプルに戻す</button></div><p id="error" role="alert"></p></section>
<section id="results" aria-live="polite"><h2>02 / 配置の比較</h2><div id="metrics" class="grid"></div><div id="plans"></div><h2>03 / 推奨配置の準備表</h2><div class="scroll"><table><thead><tr><th>組</th><th>同時に置くページ</th><th>面数</th><th>交換可能時間</th><th>不足</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="csv" class="alt">CSV保存</button><button id="print" class="alt">印刷</button></div></section><footer>1〜3面の独立した譜面セットを順に交換する想定です。冊子の綴じ方・反復・譜面台の幅・手の動きは自動判定しません。実演前に必ず確認してください。入力は端末内のみで処理され、外部通信しません。</footer></main>
<script id="core">
'use strict';
function parseInput(raw,need,budget){const tokens=raw.trim()?raw.trim().split(/[\s,、]+/):[];const dec=s=>/^\d{1,2}(\.\d)?$/.test(String(s))&&Number(s)<=60?Math.round(Number(s)*10):NaN;const gaps=tokens.map(dec),t=dec(need),b=Number(budget);if(gaps.length>119||gaps.some(x=>!Number.isFinite(x))||!Number.isFinite(t)||t<1||String(budget).trim()===''||!Number.isInteger(b)||b<0||b>20)throw Error('境界は最大119個、時間は0〜60秒（必要時間は0.1秒以上）、3面上限は0〜20の整数で指定してください。');return {gaps,t,b};}
function score(parts,gaps,t){let end=0,risk=0,deficit=0,turns=0,wide=0;for(const len of parts){end+=len;wide+=+(len===3);if(end<=gaps.length){const d=Math.max(0,t-gaps[end-1]);risk+=+(d>0);deficit+=d;turns++;}}return [risk,deficit,turns,wide];}
function better(a,b){return a.some((v,i)=>v<b[i]&&a.slice(0,i).every((x,j)=>x===b[j]));}
function solve(gaps,t,b){const n=gaps.length+1,memo=new Map();function visit(i,left){if(i===n)return {parts:[],s:[0,0,0,0]};const key=i+':'+left;if(memo.has(key))return memo.get(key);let best=null;for(let k=1;k<=3&&i+k<=n;k++){if(k===3&&left===0)continue;const end=i+k,next=visit(end,left-+(k===3)),d=end<n?Math.max(0,t-gaps[end-1]):0,s=next.s.map((v,j)=>v+[+(d>0),d,+(end<n),+(k===3)][j]);if(!best||better(s,best.s))best={parts:[k,...next.parts],s};}memo.set(key,best);return best;}return visit(0,b);}
function baseline(n){return Array.from({length:Math.ceil(n/2)},(_,i)=>Math.min(2,n-i*2));}
function details(parts,gaps,t){let end=0;return parts.map((k,i)=>{const start=end+1;end+=k;const g=end<=gaps.length?gaps[end-1]:null;return {i:i+1,start,end,k,g,d:g===null?0:Math.max(0,t-g)};});}
function csvText(parts,gaps,t){return ['組,開始ページ,終了ページ,面数,交換可能秒,不足秒',...details(parts,gaps,t).map(r=>[r.i,r.start,r.end,r.k,r.g===null?'':r.g/10,r.g===null?'':r.d/10].join(','))].join('\r\n');}
function selfTest(){let seed=73,count=0;const rnd=n=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed%n;};function assert(v){if(!v)throw Error('test '+count);}for(let z=0;z<300;z++){const n=1+rnd(9),g=Array.from({length:n-1},()=>rnd(41)),t=1+rnd(40),b=rnd(4);let best=null;function brute(p,left,used){if(!left){const s=score(p,g,t);if(!best||s.join(',')!==best.join(',')&&s.findIndex((v,i)=>v!==best[i])>=0&&s[s.findIndex((v,i)=>v!==best[i])]<best[s.findIndex((v,i)=>v!==best[i])])best=s;return;}for(let k=1;k<=Math.min(3,left);k++)if(used+(k===3)<=b)brute([...p,k],left-k,used+(k===3));}brute([],n,0);const a=solve(g,t,b);assert(a.s.join()===best.join()&&score(a.parts,g,t).join()===best.join()&&a.parts.reduce((x,y)=>x+y,0)===n&&a.parts.filter(x=>x===3).length<=b);count++;}const p=parseInput('0.4 0.2 3 0.1 3 0.2 0.4','2','2');assert(solve(p.gaps,p.t,p.b).parts.join()==='3,2,3');count++;assert(solve(Array(119).fill(0),20,20).parts.reduce((a,b)=>a+b,0)===120);count++;for(const v of ['x','-1','1.25','61']){let fail=false;try{parseInput(v,'2','2');}catch{fail=true;}assert(fail);count++;}return count;}
</script><script>
const $=id=>document.getElementById(id);let current=null;const sec=v=>(v/10).toFixed(1)+'秒';function draw(){try{const {gaps,t,b}=parseInput($('gaps').value,$('need').value,$('budget').value),base=baseline(gaps.length+1),opt=solve(gaps,t,b),s=score(base,gaps,t);current={gaps,t,parts:opt.parts};$('error').textContent='';$('results').hidden=false;$('metrics').innerHTML=[['時間不足の交換',s[0]+' → '+opt.s[0]+'回'],['不足時間の合計',sec(s[1])+' → '+sec(opt.s[1])],['推奨の3面展開',opt.s[3]+' / '+b+'組']].map(([k,v])=>'<div class="metric">'+k+'<strong>'+v+'</strong></div>').join('');$('plans').innerHTML=[['通常の2面配置',base],['推奨配置',opt.parts]].map(([name,parts])=>'<p><b>'+name+'</b></p><div class="strip">'+details(parts,gaps,t).map(r=>'<span class="spread">'+Array.from({length:r.k},(_,i)=>'<span class="sheet">'+(r.start+i)+'</span>').join('')+'</span>'+(r.g===null?'':'<span class="turn '+(r.d?'bad':'')+'">'+sec(r.g)+(r.d?' 不足':' OK')+' →</span>')).join('')+'</div>').join('');$('rows').innerHTML=details(opt.parts,gaps,t).map(r=>'<tr><td>'+r.i+'</td><td>'+r.start+'–'+r.end+'</td><td>'+r.k+'</td><td>'+(r.g===null?'終了':sec(r.g))+'</td><td class="'+(r.d?'bad':'')+'">'+(r.g===null?'—':sec(r.d))+'</td></tr>').join('');}catch(e){current=null;$('results').hidden=true;$('error').textContent=e.message;}}
$('run').onclick=draw;$('reset').onclick=()=>{$('gaps').value='0.4 0.2 3 0.1 3 0.2 0.4';$('need').value='2';$('budget').value='2';draw();};for(const id of ['gaps','need','budget'])$(id).oninput=()=>{current=null;$('results').hidden=true;$('error').textContent='条件が変わりました。再計算してください。';};$('csv').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob(['\ufeff'+csvText(current.parts,current.gaps,current.t)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='fumekaeshi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('print').onclick=()=>window.print();draw();
</script></html>
