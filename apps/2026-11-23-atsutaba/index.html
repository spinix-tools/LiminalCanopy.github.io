<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>厚束 / ATSUTABA</title><style>body{font-family:system-ui,sans-serif;background:#112e26;color:#fff;display:grid;min-height:100vh;place-items:center;margin:0}p{line-height:1.7;max-width:40em;padding:1em}a{color:#a6efbd}</style></head><body><p id="message">厚束 / ATSUTABA を展開しています…</p><script src="payload.js"></script><script>(async()=>{try{const s=atob(window.ATSUTABA_PAYLOAD),bytes=Uint8Array.from(s,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('DecompressionStream非対応');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('message').textContent='展開できませんでした。配布ファイルの unpack.py を Python 3 で実行し、復元した standalone.html を開いてください。 '+e.message;}})();</script></body></html>
