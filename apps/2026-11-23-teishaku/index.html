<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>停尺 / TEISHAKU — 鉄道模型の編成・ホーム長検算</title><style>body{background:#07161b;color:#d6ed82;font-family:system-ui,sans-serif;padding:3rem}p{color:#aec6c6}</style></head><body><h1>停尺 / TEISHAKU</h1><p id="status">オフラインアプリを展開しています…</p><script src="payload.js"></script><script>
(async()=>{try{if(typeof DecompressionStream==='undefined')throw Error('このブラウザはgzip展開に対応していません。unpack.pyで可読版に復元してください。');const encoded=window.__TEISHAKU_PAYLOAD;if(!encoded)throw Error('payload.js がありません');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(e){document.querySelector('#status').textContent='起動できません: '+e.message;}})();
</script></body></html>
