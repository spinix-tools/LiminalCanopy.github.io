<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CueRest | 譜めくり設計</title>
<style>
:root{color-scheme:light;--ink:#192e34;--muted:#50666c;--line:#d9e1df;--green:#126b59;--paper:#f5f6f1;--red:#a4462e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px 48px}header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}h1{font-size:clamp(32px,5vw,54px);line-height:1.05;margin:8px 0;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--green);font-weight:800}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:650;font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #aabbb8;border-radius:8px;background:white;color:var(--ink);padding:9px}textarea{min-height:215px;resize:vertical;font:13px/1.55 ui-monospace,monospace;tab-size:8}button{border:1px solid var(--green);border-radius:8px;padding:9px 13px;background:var(--green);color:white;font-weight:700;cursor:pointer}button.secondary{background:white;color:var(--green)}button:disabled{opacity:.4;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}.metric{background:#eef3ee;padding:12px;border-radius:10px}.metric strong{display:block;font-size:25px;line-height:1.2}.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0 18px}.page{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;background:#fbfcf9}.page b{font-size:12px}.sheet{height:92px;display:flex;flex-direction:column;gap:2px;justify-content:flex-start;background:#edf1eb;padding:5px;margin:6px 0;border-radius:4px;overflow:hidden}.system{background:#80aa9c;min-height:2px;border-radius:2px}.bad{color:var(--red);font-weight:700}.ok{color:var(--green);font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted)}#status{min-height:24px;color:var(--red)}@media(max-width:760px){main{padding:18px 12px}.layout{grid-template-columns:1fr}.panel{padding:15px}.metric strong{font-size:20px}}@media print{body{background:white}.layout{display:block}.controls,.actions,header .muted{display:none}.panel{border:0}.page{break-inside:avoid}}
</style></head><body><main><header><div class="eyebrow">CUEREST / SCORE LAYOUT LAB</div><h1>譜めくり設計</h1><p class="muted">休める場所でページをめくる。楽譜を作り直す前に、改ページ候補を比較。</p></header><div class="layout"><section class="panel controls"><h2>01 / 条件入力</h2><div class="fields"><label>1ページの容量<input id="capacity" type="number" min="1" max="1000" value="12"></label><label>最大ページ数<input id="limit" type="number" min="1" max="60" value="5"></label><label>必要な休止（秒）<input id="threshold" type="number" min="0" max="60" step="0.1" value="2"></label><label>ページの見方<select id="mode"><option value="right">見開き・右始まり</option><option value="left">見開き・左始まり</option><option value="single">単ページ</option></select></label></div><p><small>各段の高さを同じ単位で指定。休止は段末の実際に手を離せる秒数です。</small></p><label for="data">段名 / 高さ / 段末休止秒（タブ区切り）</label><textarea id="data" spellcheck="false"></textarea><div class="actions"><button id="run">計画を計算</button><button id="sample" class="secondary">サンプル</button></div><p id="status" role="alert"></p><small>最大200段。反復・楽譜自体の組版は扱いません。入力は端末内でのみ処理されます。</small></section><section class="panel" aria-label="結果"><h2>02 / 計画比較</h2><div id="result" aria-live="polite"></div><div class="actions"><button id="export" class="secondary" disabled>JSON保存</button><button id="print" class="secondary" disabled>印刷</button></div></section></div></main>
<script id="core">
'use strict';
function parse(text){const lines=text.trim().split(/\r?\n/);if(lines.length>200||!text.trim())throw Error('1〜200段を入力してください');return lines.map((line,i)=>{const a=line.split('\t');if(a.length!==3||a.some(x=>!x.trim())||a[0].length>100)throw Error(`${i+1}行目：段名・高さ・休止秒の3列が必要です`);const h=Number(a[1]),s=Number(a[2]);if(!Number.isInteger(h)||h<1||h>1000||!Number.isFinite(s)||s<0||s>600||Math.abs(s*1000-Math.round(s*1000))>1e-7)throw Error(`${i+1}行目：高さ1〜1000の整数、休止0〜600秒（小数3桁まで）`);return {name:a[0],h,ms:Math.round(s*1000)}})}
function plan(rows,cap,limit,threshold,mode){if(!Number.isInteger(cap)||cap<1||cap>1000||!Number.isInteger(limit)||limit<1||limit>60||!Number.isInteger(threshold)||threshold<0||threshold>60000||!['right','left','single'].includes(mode))throw Error('設定値が範囲外です');if(!rows.length||rows.length>200||rows.some(r=>r.h>cap))throw Error('容量を超える段があるか、段数が範囲外です');const n=rows.length,prefix=[0];for(const r of rows)prefix.push(prefix.at(-1)+r.h);const turn=p=>mode==='single'||(mode==='right'?p%2===1:p%2===0);function page(i,j,p){const used=prefix[j]-prefix[i],physical=j<n&&turn(p),rest=rows[j-1].ms,deficit=physical?Math.max(0,threshold-rest):0;return {from:i,to:j,used,physical,rest,deficit}}function score(pages){return {bad:pages.filter(p=>p.deficit>0).length,deficit:pages.reduce((s,p)=>s+p.deficit,0),count:pages.length,waste:pages.reduce((s,p)=>s+(cap-p.used)**2,0)}}function less(a,b,final){if(!b)return true;for(const k of final?['bad','deficit','count','waste']:['bad','deficit','waste'])if(a[k]!==b[k])return a[k]<b[k];return false}const baseline=[];for(let i=0;i<n;){let j=i+1;while(j<n&&prefix[j+1]-prefix[i]<=cap)j++;baseline.push(page(i,j,baseline.length+1));i=j}if(baseline.length>limit)throw Error(`容量上、最低${baseline.length}ページが必要です`);const dp=Array.from({length:limit+1},()=>Array(n+1).fill(null));dp[0][0]={bad:0,deficit:0,waste:0,prev:-1};let best=null;for(let p=1;p<=limit;p++){for(let j=1;j<=n;j++){for(let i=j-1;i>=0;i--){if(prefix[j]-prefix[i]>cap)break;const old=dp[p-1][i];if(!old)continue;const q=page(i,j,p),v={bad:old.bad+(q.deficit>0?1:0),deficit:old.deficit+q.deficit,waste:old.waste+(cap-q.used)**2,prev:i};if(less(v,dp[p][j],false))dp[p][j]=v}}if(dp[p][n]){const v={...dp[p][n],count:p};if(less(v,best,true))best=v}}const optimized=[];let j=n;for(let p=best.count;p>0;p--){const i=dp[p][j].prev;optimized.unshift(page(i,j,p));j=i}return {baseline,optimized,baseScore:score(baseline),optScore:score(optimized)}}
</script><script>
const $=id=>document.getElementById(id),sample=['A1\t4\t0','A2\t4\t3','A3\t4\t0','B1\t4\t0','B2\t4\t3','B3\t4\t0','C1\t4\t0','C2\t4\t3','C3\t4\t0','D1\t4\t0','D2\t4\t3','D3\t4\t0'].join('\n');let report=null;function el(tag,value,cls){const x=document.createElement(tag);if(value!==undefined)x.textContent=value;if(cls)x.className=cls;return x}function invalidate(){report=null;$('export').disabled=$('print').disabled=true;$('result').replaceChildren(el('p','入力を更新しました。計画を再計算してください。','muted'));$('status').textContent=''}function render(){invalidate();try{const rows=parse($('data').value),cap=Number($('capacity').value),limit=Number($('limit').value),threshold=Math.round(Number($('threshold').value)*1000),mode=$('mode').value;if(!$('threshold').value||Number($('threshold').value)<0||Number($('threshold').value)>60)throw Error('休止秒を0〜60で入力してください');const r=plan(rows,cap,limit,threshold,mode);report={rows,cap,limit,threshold,mode,...r};const out=$('result');out.replaceChildren();const metrics=el('div',undefined,'metrics');for(const [label,val] of [['休止不足のめくり',`${r.baseScore.bad} → ${r.optScore.bad}`],['不足時間の合計',`${(r.optScore.deficit/1000).toFixed(1)} 秒`],['ページ数',`${r.baseScore.count} → ${r.optScore.count}`]]){const m=el('div',undefined,'metric');m.append(el('small',label),el('strong',val));metrics.append(m)}out.append(metrics);for(const [title,ps] of [['容量優先の基準案',r.baseline],['最適案',r.optimized]]){out.append(el('h2',title));const box=el('div',undefined,'pages');ps.forEach((p,i)=>{const a=el('div',undefined,'page'),sheet=el('div',undefined,'sheet');a.append(el('b',`P${i+1} · ${p.used}/${cap}`));for(const row of rows.slice(p.from,p.to)){const s=el('div',undefined,'system');s.style.flex=`0 0 ${row.h/cap*85}%`;s.title=row.name;sheet.append(s)}a.append(sheet,el('small',`${rows[p.from].name} – ${rows[p.to-1].name}`),el('div',p.to===rows.length?'終端':!p.physical?'見開き内':`めくり ${p.rest/1000}s`,p.deficit?'bad':p.physical?'ok':'muted'));box.append(a)});out.append(box)}out.append(el('h2','最適案の改ページ一覧'));const wrap=el('div',undefined,'tablewrap'),table=el('table'),head=el('tr');for(const s of ['頁','段の範囲','末尾休止','判定'])head.append(el('th',s));const th=el('thead');th.append(head);table.append(th);const body=el('tbody');r.optimized.forEach((p,i)=>{const tr=el('tr');[i+1,`${rows[p.from].name} – ${rows[p.to-1].name}`,`${p.rest/1000} 秒`,p.to===rows.length?'終端':!p.physical?'見開き内':p.deficit?`不足 ${p.deficit/1000}秒`:'休止確保'].forEach((v,k)=>tr.append(el('td',v,k===3&&p.deficit?'bad':undefined)));body.append(tr)});table.append(body);wrap.append(table);out.append(wrap,el('p','優先順位：不足箇所数 → 不足秒数 → ページ数 → 空き容量の二乗和。実演前に譜面と手の動きを確認してください。','muted'));$('export').disabled=$('print').disabled=false}catch(e){$('status').textContent=e.message}}function reset(){$('data').value=sample;$('capacity').value=12;$('limit').value=5;$('threshold').value=2;$('mode').value='right';render()}for(const id of ['data','capacity','limit','threshold','mode'])$(id).addEventListener('input',invalidate);$('run').onclick=render;$('sample').onclick=reset;$('print').onclick=()=>window.print();$('export').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='cuerest-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};reset();
</script></body></html>
