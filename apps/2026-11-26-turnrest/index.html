<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>譜休 | TURNREST</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#24352f;font:15px/1.65 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{border-bottom:2px solid #335e51;margin-bottom:20px}h1{font-size:clamp(28px,5vw,42px);margin:0}h2{font-size:19px;margin:0 0 12px}small,.muted{color:#52665d}section{background:#fffdf8;border:1px solid #d9ded5;border-radius:14px;padding:20px;margin:0 0 16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600}input,select,textarea,button{font:inherit;border:1px solid #a4b4a9;border-radius:7px;padding:8px;background:white;color:inherit;max-width:100%}input,select,textarea{width:100%}textarea{min-height:245px;font:14px/1.65 monospace;resize:vertical}button{cursor:pointer;background:#335e51;color:white;font-weight:bold;margin:5px 5px 0 0}button.alt{background:white;color:#335e51}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bd8d45;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:10px;background:#e7eee6;border-radius:9px}.metric strong{display:block;font-size:24px}.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.page{border:1px solid #b7c2b8;background:white;padding:10px;border-radius:8px;overflow-wrap:anywhere}.page b{display:block}.system{background:repeating-linear-gradient(0deg,#e8ede7 0px,#e8ede7 2px,#fafbf8 2px,#fafbf8 5px);margin:5px 0;padding:4px 6px;overflow-wrap:anywhere;font-size:12px}.bad{color:#a03926;font-weight:bold}.good{color:#25634e;font-weight:bold}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid #dce1d9;padding:7px 4px;overflow-wrap:anywhere}.tablewrap{overflow-x:auto}#status{min-height:1.7em}footer{font-size:13px;color:#52665d}@media(max-width:720px){main{padding:14px}.layout{display:block}section{padding:14px}}@media print{body{background:white}#editor,button,footer{display:none}section{border:0;padding:0}.page{break-inside:avoid}}
</style>
<main><header><small>PLAYING / PAPER / PLANNING</small><h1>譜休 <small>TURNREST</small></h1><p>演奏を止めないための、紙譜・電子譜の改ページ計画。</p></header>
<div class="layout"><section id="editor"><h2>01 / 条件を入力</h2><div class="fields"><label>1頁の高さ上限<input id="capacity" type="number" min="1" max="100" value="8"></label><label>最大ページ数<input id="limit" type="number" min="1" max="60" value="5"></label><label>必要な空き時間（秒）<input id="need" type="number" min="0" max="60" step="0.1" value="2"></label><label>表示方式<select id="mode"><option value="odd">紙・奇数頁でめくる</option><option value="even">紙・偶数頁でめくる</option><option value="all">電子・毎頁めくる</option></select></label></div><p class="muted">高さは段数でも任意の整数単位でも可。1行＝分割しない譜段。末尾の空き時間は両手が実際に使える秒数を入力。</p><label for="data">譜段：小節名,高さ,空き秒,自由/必須/禁止</label><textarea id="data" spellcheck="false"></textarea><small>必須・禁止はその譜段の直後の改ページ条件。最終行は無視。最大120段。ページ番号は1から開始。</small><div><button id="run">計画を計算</button><button id="reset" class="alt">サンプル</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>02 / 推奨プラン</h2><div id="result" aria-live="polite"></div><div><button id="download" disabled>CSV出力</button><button id="print" class="alt" disabled>印刷</button></div></section></div><section><h2>03 / ページ数別の比較</h2><div id="frontier" class="tablewrap"></div></section><footer>改ページ候補の計画支援。楽譜の作成・PDF編集・反復演奏経路・実際の譜めくり動作は扱いません。入力はブラウザ内のみで処理します。</footer></main>
<script id="core">
'use strict';
function parse(s){const rows=s.trim().split(/\r?\n/);if(!s.trim()||rows.length>120)throw Error('譜段は1〜120行です');return rows.map((line,i)=>{const a=line.split(',').map(x=>x.trim());const h=Number(a[1]),r=Number(a[2]);if(a.length!==4||!a[0]||a[0].length>80||!a[1]||!a[2]||!Number.isInteger(h)||h<1||h>100||!Number.isFinite(r)||r<0||r>60||Math.abs(r*10-Math.round(r*10))>1e-7||!['自由','必須','禁止'].includes(a[3]))throw Error((i+1)+'行目の形式を確認してください');return {name:a[0],h,r:Math.round(r*10),flag:a[3]}})}
function turn(page,mode){return mode==='all'||page%2===(mode==='odd'?1:0)}
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0}
function solve(rows,cap,limit,need,mode){if(!Number.isInteger(cap)||cap<1||cap>100||!Number.isInteger(limit)||limit<1||limit>60||!Number.isInteger(need)||need<0||need>600||!['odd','even','all'].includes(mode))throw Error('設定値の範囲を確認してください');const n=rows.length,dp=Array.from({length:limit+1},()=>Array(n+1).fill(null));dp[0][0]={bad:0,short:0,waste:0,pages:[]};for(let p=1;p<=limit;p++)for(let i=0;i<n;i++){const prev=dp[p-1][i];if(!prev)continue;let h=0;for(let j=i;j<n;j++){h+=rows[j].h;if(h>cap)break;const last=j===n-1,cut=rows[j].flag,flip=!last&&turn(p,mode),d=flip?Math.max(0,need-rows[j].r):0;if(last||cut!=='禁止'){const v={bad:prev.bad+Number(d>0),short:prev.short+d,waste:prev.waste+(cap-h)**2,pages:[...prev.pages,{start:i,end:j,h,flip,d}]},old=dp[p][j+1];if(!old||cmp([v.bad,v.short,v.waste],[old.bad,old.short,old.waste])<0)dp[p][j+1]=v}if(cut==='必須')break}}const frontier=dp.slice(1).map((a,i)=>a[n]?{...a[n],count:i+1}:null).filter(Boolean);const best=frontier.slice().sort((a,b)=>cmp([a.bad,a.short,a.count,a.waste],[b.bad,b.short,b.count,b.waste]))[0]||null;return {best,frontier}}
function csv(rows,plan){const q=x=>'"'+String(x).replace(/^[\s\uFEFF]*[=+\-@]/,"'$&").replace(/"/g,'""')+'"';return [['頁','譜段','高さ','頁末空き秒','操作','不足秒'],...plan.pages.map((p,i)=>[i+1,rows.slice(p.start,p.end+1).map(r=>r.name).join(' / '),p.h,(rows[p.end].r/10).toFixed(1),i===plan.pages.length-1?'終端':p.flip?'譜めくり':'見開き内',(p.d/10).toFixed(1)])].map(a=>a.map(q).join(',')).join('\r\n')}
if(typeof module!=='undefined')module.exports={parse,solve,turn,csv};
</script>
<script>
const $=id=>document.getElementById(id),sample='1–4,2,0,自由\n5–8,2,3,自由\n9–12,2,0,自由\n13–16,2,0,自由\n17–20,2,0,自由\n21–24,2,4,自由\n25–28,2,0,禁止\n29–32,2,0,自由\n33–36,2,3,自由\n37–40,2,0,自由\n41–44,2,0,自由\n45–48,2,0,自由';let current=null;function el(tag,txt,parent,cls){const e=document.createElement(tag);if(txt!==null)e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e}function invalidate(){current=null;$('result').replaceChildren();$('frontier').replaceChildren();$('download').disabled=$('print').disabled=true;$('status').textContent='条件を変更しました。再計算してください。'}function calculate(){invalidate();try{const rows=parse($('data').value);if(['capacity','limit','need'].some(id=>!$(id).value||!$(id).checkValidity()))throw Error('設定値を確認してください');const cap=Number($('capacity').value),out=solve(rows,cap,Number($('limit').value),Math.round(Number($('need').value)*10),$('mode').value),p=out.best;if(!p)throw Error('条件を満たす配置なし。高さ・ページ上限・改ページ制約を確認してください。');current={rows,p};$('status').textContent='計算完了：'+rows.length+'段';$('download').disabled=$('print').disabled=false;const root=$('result'),m=el('div',null,root,'metrics');for(const [label,value] of [['不足するめくり',p.bad+'回'],['合計不足',(p.short/10).toFixed(1)+'秒'],['ページ数',p.count+'頁']]){const box=el('div',null,m,'metric');el('small',label,box);el('strong',value,box)}el('p','不足回数 → 不足秒 → ページ数 → 余白の二乗和の順で最小化。',root,'muted');const pages=el('div',null,root,'pages');p.pages.forEach((x,i)=>{const card=el('div',null,pages,'page');el('b','PAGE '+(i+1)+' / '+x.h+'/'+cap,card);for(let j=x.start;j<=x.end;j++){const s=el('div',rows[j].name,card,'system');s.style.minHeight=(12+rows[j].h*5)+'px'}el('small',i===p.count-1?'終端':!x.flip?'見開き内':x.d?'要対策 −'+(x.d/10).toFixed(1)+'秒':'譜めくり OK',card,x.d?'bad':'good')});const t=el('table',null,$('frontier'));const head=el('tr',null,el('thead',null,t));['ページ数','不足回数','不足秒','推奨'].forEach(x=>el('th',x,head));const body=el('tbody',null,t);out.frontier.forEach(x=>{const tr=el('tr',null,body);[x.count,x.bad,(x.short/10).toFixed(1),x.count===p.count?'✓':''].forEach(v=>el('td',String(v),tr))})}catch(e){$('status').textContent=e.message;$('result').textContent='計画を表示できません。'}}function reset(){$('data').value=sample;$('capacity').value=8;$('limit').value=5;$('need').value=2;$('mode').value='odd';calculate()}$('run').onclick=calculate;$('reset').onclick=reset;for(const id of ['data','capacity','limit','need','mode'])$(id).addEventListener('input',invalidate);$('print').onclick=()=>window.print();$('download').onclick=()=>{if(!current)return;const u=URL.createObjectURL(new Blob(['\uFEFF'+csv(current.rows,current.p)],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='turnrest.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};reset();
</script></html>
