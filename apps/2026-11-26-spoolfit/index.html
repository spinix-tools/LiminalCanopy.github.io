<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巻割 / SpoolFit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f1;color:#20392f;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px}header{background:#193e35;color:#fff;padding:28px;border-radius:18px}h1{font-size:36px;margin:0}h2{font-size:19px;margin:0 0 10px}p{margin:8px 0}small,.muted{color:#52675f}header small{color:#c0d9ce}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}section{background:white;border:1px solid #d7e0da;border-radius:14px;padding:18px;min-width:0}label{display:block;font-weight:600}textarea,input{font:inherit;border:1px solid #a9b9b1;border-radius:7px;padding:9px;width:100%;color:inherit;background:#fbfcfb}textarea{min-height:150px;resize:vertical;font:14px/1.7 monospace}button{font:inherit;font-weight:650;padding:9px 16px;border:1px solid #2e6a58;border-radius:8px;background:#fff;color:#205744;cursor:pointer}button.primary{background:#24604e;color:white}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.metric{background:#e9f2ec;padding:12px;border-radius:10px}.metric b{display:block;font-size:26px}.bar{height:14px;background:#e3e8e3;border-radius:10px;overflow:hidden}.bar i{display:block;background:#3c8b70;height:100%}.spool{border-top:1px solid #dbe4de;padding:12px 0;overflow-wrap:anywhere}.bad{color:#a13f28}.pill{display:inline-block;background:#e5efe9;padding:2px 8px;border-radius:5px;margin:2px;overflow-wrap:anywhere}#status{min-height:24px}footer{margin:16px 0;color:#52675f;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}main{padding:12px}header{padding:20px}h1{font-size:29px}}@media print{header{color:#000;background:#fff}.grid,.actions,footer{display:none}body{background:#fff}}
</style><main><header><small>MAKER WORKBENCH / 01</small><h1>巻割 <span lang="en">SpoolFit</span></h1><p>余ったフィラメントを、途中交換なしで使い切るための配分計画。</p></header>
<div class="grid"><section><h2>01 / スプール在庫</h2><label for="spools">ID, 互換グループ, 総重量g, 空重量g, 誤差g, 残す重量g</label><textarea id="spools" spellcheck="false"></textarea><small>1行1本、最大6本。互換グループは素材・色・径・条件が同じものに同じ任意IDを指定。整数g。</small></section><section><h2>02 / 印刷ジョブ</h2><label for="jobs">ID, 互換グループ, スライサー見積g</label><textarea id="jobs" spellcheck="false"></textarea><small>1行1ジョブ、最大12件。各ジョブは1本から供給（途中交換なし）。</small><div class="grid"><label>上乗せ率 %<input id="margin" type="number" min="0" max="100" step="1" value="0"></label><label>追加消費 g/件<input id="extra" type="number" min="0" max="1000" step="1" value="0"></label></div></section></div>
<div class="actions"><button class="primary" id="run">配分を計算</button><button id="sample">サンプルに戻す</button><button id="save" disabled>JSON保存</button><button id="print" disabled>印刷</button></div><p id="status" role="status" aria-live="polite"></p><section id="result" hidden></section><footer>計算は端末内のみ。実際の残量・供給・印刷成功を保証しません。誤差・余裕は実測に合わせて設定し、材料適合性は別途確認してください。</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
function parse(spools,jobs,margin,extra){
 const integer=(s,min,max)=>{if(!/^\d+$/.test(String(s))||!Number.isSafeInteger(+s)||+s<min||+s>max)throw Error('整数の範囲を確認してください');return +s};
 const rows=(s,n,max)=>{const a=s.trim().split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split(',').map(t=>t.trim()));if(!a.length||a.length>max||a.some(r=>r.length!==n||!r[0]||!r[1]||r[0].length>40||r[1].length>40)||new Set(a.map(r=>r[0])).size!==a.length)throw Error('行数・列数・ID（重複不可）を確認してください');return a};
 margin=integer(margin,0,100);extra=integer(extra,0,1000);
 return {spools:rows(spools,6,6).map(([id,g,...v])=>{const [gross,tare,error,reserve]=v.map(x=>integer(x,0,100000));if(gross<tare)throw Error('総重量が空重量未満です');return {id,g,gross,tare,error,reserve,cap:Math.max(0,gross-tare-error-reserve)}}),jobs:rows(jobs,3,12).map(([id,g,x])=>{const grams=integer(x,1,100000);return {id,g,grams,need:Math.ceil(grams*(100+margin)/100)+extra}}),margin,extra};
}
function solve(data,limit=200000){
 const {spools,jobs}=data,cap=spools.map(s=>s.cap),n=jobs.length;
 function greedy(){const rem=cap.slice(),a=[];let count=0,grams=0;for(const j of jobs){const i=spools.findIndex((s,k)=>s.g===j.g&&rem[k]>=j.need);a.push(i);if(i>=0){rem[i]-=j.need;count++;grams+=j.grams}}return {a,count,grams}}
 const baseline=greedy();let best={...baseline,a:baseline.a.slice()},nodes=0,cut=false;
 const order=jobs.map((j,i)=>({...j,i})).sort((a,b)=>b.need-a.need||a.i-b.i),suffix=Array(n+1).fill(0);for(let i=n-1;i>=0;i--)suffix[i]=suffix[i+1]+order[i].grams;
 const a=Array(n).fill(-1),rem=cap.slice();
 function dfs(k,count,grams){if(cut)return;if(++nodes>limit){cut=true;return}if(count+n-k<best.count||count+n-k===best.count&&grams+suffix[k]<=best.grams)return;if(k===n){best={a:a.slice(),count,grams};return}const j=order[k],seen=new Set();for(let i=0;i<spools.length;i++){if(spools[i].g!==j.g||rem[i]<j.need||seen.has(rem[i]))continue;seen.add(rem[i]);rem[i]-=j.need;a[j.i]=i;dfs(k+1,count+1,grams+j.grams);rem[i]+=j.need;a[j.i]=-1;if(cut)return}dfs(k+1,count,grams)}
 dfs(0,0,0);return {best,baseline,nodes:Math.min(nodes,limit),optimal:!cut||best.count===n};
}
const SAMPLE={spools:'A,PLA-black,280,225,3,2\nB,PLA-black,280,225,3,2\nC,PETG-white,265,225,3,2',jobs:'clip-1,PLA-black,20\nclip-2,PLA-black,20\ncase-1,PLA-black,30\ncase-2,PLA-black,30\nstand,PETG-white,35'};
let current=null;const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};
function invalidate(){current=null;$('result').hidden=true;$('save').disabled=$('print').disabled=true;$('status').textContent='入力を変更しました。再計算してください。'}
function calculate(){invalidate();try{const data=parse($('spools').value,$('jobs').value,$('margin').value,$('extra').value),plan=solve(data),{best,baseline}=plan;current={data,plan};const out=$('result');out.replaceChildren(el('h2','03 / 配分結果'));const m=el('div',undefined,'metrics');for(const [label,value] of [['割当済み',best.count+' / '+data.jobs.length],['先着順',baseline.count+' 件'],['割当見積',best.grams+' g']]){const x=el('div',undefined,'metric');x.append(el('small',label),el('b',value));m.append(x)}out.append(m,el('p',plan.optimal?'最適性確認済み（件数 → 見積重量の順に最大化）':'探索上限到達：暫定案。最適性・未割当の不可避性は未確認。'));
 data.spools.forEach((s,i)=>{const js=data.jobs.filter((j,k)=>best.a[k]===i),used=js.reduce((v,j)=>v+j.need,0),box=el('div',undefined,'spool'),bar=el('div',undefined,'bar'),fill=el('i');fill.style.width=(s.cap?100*used/s.cap:0)+'%';bar.append(fill);box.append(el('b',s.id+' / '+s.g),el('p','安全側容量 '+s.cap+'g ｜ 割当 '+used+'g ｜ 残り '+(s.cap-used)+'g'),bar);for(const j of js)box.append(el('span',j.id+' · '+j.need+'g','pill'));if(!js.length)box.append(el('small','割当なし'));out.append(box)});
 const missing=data.jobs.filter((j,k)=>best.a[k]<0);out.append(el('h2','未割当 '+missing.length+' 件'));for(const j of missing){const fits=data.spools.some(s=>s.g===j.g&&s.cap>=j.need);out.append(el('p',j.id+' / '+j.need+'g — '+(fits?'他ジョブとの容量競合・暫定除外':'互換容量を満たす単一スプールなし'),'bad'))}out.hidden=false;$('save').disabled=$('print').disabled=false;$('status').textContent='計算完了 · 探索 '+plan.nodes+' ノード';}catch(e){$('status').textContent=e.message}}
function sample(){$('spools').value=SAMPLE.spools;$('jobs').value=SAMPLE.jobs;$('margin').value='0';$('extra').value='0';calculate()}
for(const id of ['spools','jobs','margin','extra'])$(id).addEventListener('input',invalidate);$('run').onclick=calculate;$('sample').onclick=sample;$('print').onclick=()=>window.print();$('save').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='spoolfit-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};sample();
</script></html>
